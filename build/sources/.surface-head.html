<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原子工坊 · 面层目录</title>
<style>
:root{
  --bg:#070b14; --bg2:#0b1220; --panel:#0f172a; --panel2:#111c31; --panel3:#16233a;
  --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.24);
  --text:#e5edf8; --dim:#8fa2bb; --faint:#5f7188;
  --blue:#3b82f6; --cyan:#06b6d4; --violet:#8b5cf6; --amber:#f59e0b;
  --green:#22c55e; --red:#ef4444; --pink:#ec4899;
  --shadow:0 18px 50px rgba(0,0,0,.34);
  --radius:14px; --radius-sm:9px;
  --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
body.light{
  --bg:#f4f7fb; --bg2:#eaf0f7; --panel:#ffffff; --panel2:#f7fafc; --panel3:#eef4fb;
  --line:rgba(15,23,42,.10); --line2:rgba(15,23,42,.18);
  --text:#0f172a; --dim:#52637a; --faint:#7c8ba1;
  --shadow:0 18px 44px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; font-family:var(--font); color:var(--text);
  background:
    radial-gradient(900px 480px at 8% -8%, rgba(59,130,246,.16), transparent 60%),
    radial-gradient(760px 420px at 96% 0%, rgba(139,92,246,.12), transparent 62%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  transition:background .25s ease,color .2s ease;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
code,.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

.app{max-width:1600px;margin:0 auto;padding:18px 20px 34px}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;
  padding:12px 14px;margin:-4px 0 14px;border:1px solid var(--line);
  background:rgba(10,16,28,.78);backdrop-filter:blur(18px);
  border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.16);
}
body.light .topbar{background:rgba(255,255,255,.82)}
.brand{display:flex;align-items:center;gap:11px;min-width:250px}
.logo{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:17px;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  box-shadow:0 8px 20px rgba(59,130,246,.28);
}
.brand-name{font-size:14px;font-weight:700;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--faint);margin-top:3px;font-family:var(--mono)}
.search{
  flex:1;display:flex;align-items:center;gap:9px;min-width:180px;
  padding:9px 12px;border:1px solid var(--line);border-radius:11px;
  background:var(--panel2);
}
.search span{color:var(--faint);font-size:16px}
.search input{width:100%;border:0;outline:0;background:transparent;font-size:13px}
.search input::placeholder{color:var(--faint)}
.top-actions{display:flex;align-items:center;gap:9px}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.seg button{border:0;background:transparent;color:var(--dim);padding:6px 11px;border-radius:7px;font-size:12px}
.seg button.active{background:rgba(59,130,246,.18);color:#93c5fd}
body.light .seg button.active{background:rgba(59,130,246,.12);color:#1d4ed8}
.icon-btn{
  width:36px;height:36px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel2);color:var(--dim);font-size:16px;
}
.icon-btn:hover{border-color:var(--line2);color:var(--text)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.stat:after{content:"";position:absolute;right:-18px;top:-24px;width:80px;height:80px;border-radius:50%;background:var(--accent,var(--blue));opacity:.08}
.stat-k{font-size:11px;color:var(--faint);letter-spacing:.8px;text-transform:uppercase}
.stat-v{font-size:27px;font-weight:800;line-height:1.15;margin-top:6px}
.stat-s{font-size:11px;color:var(--dim);margin-top:4px}

.layout{display:grid;grid-template-columns:245px minmax(0,1fr) 335px;gap:14px;align-items:start}
.panel{
  border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:var(--shadow);
}
.sidebar{padding:15px;position:sticky;top:82px;max-height:calc(100vh - 100px);overflow:auto}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin:4px 0 9px}
.panel-head .muted{font-size:10px;letter-spacing:0;text-transform:none}
.family-btn,.filter-btn{
  width:100%;display:flex;align-items:center;gap:9px;border:1px solid transparent;
  background:transparent;color:var(--dim);padding:8px 9px;border-radius:9px;
  font-size:12px;text-align:left;margin-bottom:3px;
}
.family-btn:hover,.filter-btn:hover{background:var(--panel3);color:var(--text)}
.family-btn.active,.filter-btn.active{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.22);color:var(--text)}
.family-dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--blue));box-shadow:0 0 0 3px rgba(59,130,246,.08);flex:none}
.family-btn .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
.filter-btn{justify-content:space-between}
.filter-btn .check{font-family:var(--mono);color:var(--green);font-size:11px}
.divider{height:1px;background:var(--line);margin:14px 0}
.legend{display:flex;flex-direction:column;gap:7px;font-size:11px;color:var(--dim)}
.legend-row{display:flex;align-items:center;gap:8px}
.legend-node{width:10px;height:10px;border-radius:3px;background:var(--blue)}
.legend-node.inst{background:var(--cyan);border-radius:50%}
.legend-node.gate{background:var(--amber);border-radius:2px;transform:rotate(45deg)}
.side-note{margin-top:14px;padding:11px;border:1px solid var(--line);border-radius:10px;background:rgba(59,130,246,.06);font-size:11px;line-height:1.7;color:var(--dim)}
.side-note b{color:var(--text)}
.side-note code{color:#93c5fd;font-size:10px}

.main{padding:16px;min-height:620px}
.main-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:14px}
.kicker{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);font-family:var(--mono)}
.main-head h1{font-size:22px;line-height:1.2;margin:5px 0 5px;letter-spacing:-.3px}
.main-head p{margin:0;color:var(--dim);font-size:12px;line-height:1.6;max-width:720px}
.count{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}

.family-section{margin:18px 0 10px}
.family-head{display:flex;align-items:center;gap:9px;margin:0 0 9px}
.family-head h2{font-size:12px;margin:0;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.family-head .line{flex:1;height:1px;background:var(--line)}
.family-head .cnt{font-family:var(--mono);font-size:10px;color:var(--faint)}
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px}
.class-card{
  position:relative;border:1px solid var(--line);border-radius:12px;padding:13px 13px 11px;
  background:linear-gradient(180deg,var(--panel2),rgba(15,23,42,.45));overflow:hidden;
  transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease;cursor:pointer;
}
body.light .class-card{background:linear-gradient(180deg,#fff,#f8fbfe)}
.class-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--blue));opacity:.85}
.class-card:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 14px 30px rgba(0,0,0,.16)}
.class-card.selected{border-color:var(--c,var(--blue));box-shadow:0 0 0 1px var(--c,var(--blue)),0 16px 32px rgba(0,0,0,.16)}
.card-head{display:flex;align-items:flex-start;gap:10px}
.class-icon{
  width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;
  color:var(--c,var(--blue));background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.16);
  font-size:17px;font-family:var(--mono);
}
.class-title{min-width:0;flex:1}
.class-title h3{font-size:14px;margin:1px 0 3px;line-height:1.25}
.class-title code{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.p0{font-family:var(--mono);font-size:9px;padding:2px 5px;border-radius:5px;background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.22);white-space:nowrap}
body.light .p0{color:#15803d}
.card-desc{font-size:11px;line-height:1.65;color:var(--dim);margin:9px 0 10px;min-height:34px}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pill{font-size:9px;padding:3px 6px;border-radius:5px;background:var(--panel3);color:var(--dim);border:1px solid var(--line)}
.pill.fam{color:var(--c,var(--blue));border-color:rgba(59,130,246,.16);background:rgba(59,130,246,.07)}
.pill.mono{font-family:var(--mono)}
.instances{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.inst-chip{
  display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel3);color:var(--dim);font-size:10px;padding:4px 7px;max-width:100%;
}
.inst-chip:hover{border-color:var(--cyan);color:var(--text)}
.inst-chip .dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);flex:none}
.inst-chip code{font-size:9px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inst-chip b{font-weight:600;white-space:nowrap}

.catalog-table{width:100%;border-collapse:collapse;font-size:12px}
.catalog-table th{position:sticky;top:0;background:var(--panel2);z-index:2;text-align:left;color:var(--faint);font-size:10px;letter-spacing:.7px;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line)}
.catalog-table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.catalog-table tr{cursor:pointer}
.catalog-table tbody tr:hover{background:rgba(59,130,246,.06)}
.catalog-table tr.selected{background:rgba(59,130,246,.09)}
.catalog-table .id{font-family:var(--mono);font-size:10px;color:var(--faint);display:block;margin-top:3px}
.catalog-table .desc{color:var(--dim);font-size:11px;max-width:480px;line-height:1.55}
.catalog-table .num{font-family:var(--mono);font-size:11px;color:var(--dim)}
.mini-chips{display:flex;flex-wrap:wrap;gap:4px;max-width:420px}

.graph-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.graph-toolbar label{font-size:11px;color:var(--faint)}
.graph-toolbar select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;outline:0}
.graph-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:
  linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px),
  var(--panel2);
  background-size:26px 26px;padding:12px;
}
.graph{position:relative;min-width:820px}
.graph svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.graph-node{position:absolute;border:1px solid var(--line2);border-radius:11px;background:var(--panel);box-shadow:0 10px 24px rgba(0,0,0,.16);cursor:pointer;transition:border-color .14s,transform .14s}
.graph-node:hover{transform:translateY(-1px);border-color:var(--c,var(--blue))}
.graph-class{width:235px;padding:12px;border-left:3px solid var(--c,var(--blue))}
.graph-class h3{font-size:13px;margin:0 0 3px}
.graph-class code{font-size:10px;color:var(--faint)}
.graph-class p{font-size:10px;color:var(--dim);line-height:1.55;margin:7px 0 0}
.graph-inst{width:225px;padding:9px 10px;display:flex;gap:8px;align-items:center}
.graph-inst .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);flex:none;box-shadow:0 0 0 3px rgba(6,182,212,.10)}
.graph-inst b{font-size:11px;display:block}
.graph-inst code{font-size:9px;color:var(--faint);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.graph-legend{display:flex;gap:14px;font-size:10px;color:var(--faint);margin-top:10px}
.graph-legend span{display:flex;align-items:center;gap:5px}
.graph-legend i{width:8px;height:8px;border-radius:2px;background:var(--blue);display:inline-block}
.graph-legend i.inst{border-radius:50%;background:var(--cyan)}

.inspector{padding:15px;position:sticky;top:82px;max-height:calc(100vh - 100px);overflow:auto}
.insp-head .kicker{color:var(--c,var(--blue))}
.insp-head h2{font-size:18px;margin:6px 0 3px;line-height:1.25}
.insp-head code{font-size:10px;color:var(--faint);word-break:break-all}
.insp-sub{font-size:11px;color:var(--dim);line-height:1.65;margin:8px 0 0}
.insp-section{margin-top:15px}
.insp-section h4{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:0 0 7px;display:flex;justify-content:space-between;gap:8px}
.insp-section h4 .n{font-family:var(--mono);font-size:9px;color:var(--faint)}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 9px;font-size:11px;line-height:1.55}
.kv .k{color:var(--faint)}
.kv .v{color:var(--dim);word-break:break-word}
.kv .v code{color:var(--text);font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10px;padding:3px 6px;border-radius:5px;background:var(--panel3);border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.chip.state{color:#93c5fd;border-color:rgba(59,130,246,.18);background:rgba(59,130,246,.07)}
.chip.action{color:#86efac;border-color:rgba(34,197,94,.16);background:rgba(34,197,94,.06)}
.inst-list{display:flex;flex-direction:column;gap:5px}
.inst-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--panel2);cursor:pointer;text-align:left}
.inst-row:hover{border-color:var(--cyan)}
.inst-row .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex:none}
.inst-row b{font-size:11px;font-weight:600}
.inst-row code{font-size:9px;color:var(--faint);margin-left:auto;max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:transparent;color:var(--faint);font-size:11px;padding:0 0 9px}
.back:hover{color:var(--text)}
.bind-table{width:100%;border-collapse:collapse;font-size:10px}
.bind-table th{text-align:left;color:var(--faint);font-weight:500;padding:4px 5px;border-bottom:1px solid var(--line);font-size:9px;text-transform:uppercase;letter-spacing:.5px}
.bind-table td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--dim)}
.bind-table td.mono{font-family:var(--mono);font-size:9px;word-break:break-all}
.type-tag{font-family:var(--mono);font-size:8px;padding:2px 4px;border-radius:4px;background:rgba(6,182,212,.10);color:#67e8f9;border:1px solid rgba(6,182,212,.18);white-space:nowrap}
.type-tag.action{background:rgba(34,197,94,.08);color:#86efac;border-color:rgba(34,197,94,.16)}
.json{max-height:230px;overflow:auto;margin:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#060b13;color:#a9c5e8;font-family:var(--mono);font-size:9px;line-height:1.65;white-space:pre}
body.light .json{background:#f1f5f9;color:#334155}
.empty{padding:44px 16px;text-align:center;color:var(--faint);font-size:12px;border:1px dashed var(--line2);border-radius:12px;background:var(--panel2)}
.empty b{display:block;color:var(--dim);font-size:14px;margin-bottom:5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#0b1220;border:1px solid var(--line2);color:#dbeafe;padding:10px 14px;border-radius:10px;font-size:12px;box-shadow:0 16px 36px rgba(0,0,0,.35);transition:.2s;z-index:80}
body.light .toast{background:#fff;color:#0f172a}
.toast.show{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--faint)}
.hidden{display:none!important}
@media(max-width:1240px){
  .layout{grid-template-columns:215px minmax(0,1fr) 300px}
  .catalog-grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
}
@media(max-width:1040px){
  .layout{grid-template-columns:1fr}
  .sidebar,.inspector{position:static;max-height:none}
  .sidebar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sidebar .divider{display:none}
  .sidebar .side-note{grid-column:1/-1}
  .sidebar .panel-head{margin:0}
  .sidebar #families,.sidebar #filters{grid-column:1/-1}
  .inspector{position:static}
}
@media(max-width:720px){
  .app{padding:10px}
  .topbar{flex-wrap:wrap;gap:10px}
  .brand{min-width:0;flex:1}
  .search{order:3;flex-basis:100%}
  .stats{grid-template-columns:1fr 1fr}
  .main-head{flex-direction:column}
  .sidebar{grid-template-columns:1fr}
  .catalog-grid{grid-template-columns:1fr}
  .catalog-table .desc{max-width:220px}
}
</style>
</head>
