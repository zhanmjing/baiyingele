<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>点层界面与编译设置 · Point Studio</title>
<style>
:root{
  --bg:#070b12;--panel:#0d1420;--card:#111a29;--card2:#152235;--line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.25);
  --ink:#e6eef9;--dim:#8fa2bb;--faint:#5f7188;--cyan:#22d3ee;--blue:#3b82f6;--violet:#8b5cf6;
  --amber:#f59e0b;--green:#22c55e;--pink:#ec4899;--red:#ef4444;
  --mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
  --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:248px minmax(0,1fr) 326px;grid-template-rows:56px minmax(0,1fr) 142px;height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;background:linear-gradient(180deg,#0e1725,#0a111c);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-width:190px}
.brand .mark{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#04121a;font:800 13px var(--mono)}
.brand b{font-size:13px;letter-spacing:.02em}
.brand span{display:block;font:7.5px var(--mono);color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
nav{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#0a1420}
nav button{border:none;background:transparent;color:#7e91a7;border-radius:5px;padding:6px 10px;font-size:10px;white-space:nowrap}
nav button.on{background:rgba(34,211,238,.10);color:#a5f3fc}
nav button:hover{color:#dbeafe}
.search{flex:1;max-width:340px;margin-left:auto;border:1px solid var(--line);border-radius:7px;background:#0a1420;padding:7px 9px;color:var(--ink);font-size:10.5px;outline:none}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:rgba(34,211,238,.4)}
.build-btn{border:1px solid rgba(34,211,238,.35);background:linear-gradient(180deg,rgba(34,211,238,.16),rgba(34,211,238,.07));color:#a5f3fc;border-radius:7px;padding:7px 12px;font:600 10px var(--mono);white-space:nowrap}
.build-btn:hover{background:rgba(34,211,238,.18)}
.build-btn:disabled{opacity:.45;cursor:not-allowed}
#sidebar{grid-row:2;background:linear-gradient(180deg,#0e1624,#080d15);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:11px 12px 7px}
.kicker{font:7.5px var(--mono);letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.side-head h2{font-size:12px;margin:4px 0 2px}
.side-head p{margin:0;font-size:9px;color:var(--dim);line-height:1.5}
.filters{display:flex;flex-wrap:wrap;gap:3px;padding:5px 12px 7px}
.chip{border:1px solid var(--line);background:#111b28;color:#8fa2bb;border-radius:99px;padding:2px 6px;font-size:8px;font-family:var(--mono)}
.chip.on{color:#a5f3fc;border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.08)}
.classList{flex:1;overflow-y:auto;padding:0 7px 14px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
.classList::-webkit-scrollbar{width:7px}
.classList::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px;border:2px solid #080d15}
.class-item{display:flex;gap:8px;align-items:center;padding:7px 8px;border:1px solid transparent;border-radius:7px;cursor:pointer;margin-bottom:2px}
.class-item:hover{background:#121d2c;border-color:var(--line)}
.class-item.on{background:rgba(34,211,238,.07);border-color:rgba(34,211,238,.22)}
.effect{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--ec,#22c55e);box-shadow:0 0 7px var(--ec,#22c55e)}
.class-main{min-width:0;flex:1}
.class-name{font:9.5px var(--mono);color:#dbeafe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.class-sub{font-size:8px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.class-count{font:8px var(--mono);color:var(--dim)}
#main{grid-row:2;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(circle at 25% 0%,rgba(34,211,238,.04),transparent 45%),linear-gradient(180deg,#0a111c,#070b12);display:flex;flex-direction:column}
.main-head{padding:10px 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:9px}
.main-head .mh-icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:#162234;border:1px solid var(--line);color:var(--cyan);font-size:14px;flex:0 0 32px}
.main-head .mh-text{min-width:0;flex:1}
.main-head .mh-kicker{font:7.5px var(--mono);color:var(--faint);letter-spacing:.13em;text-transform:uppercase}
.main-head h1{font-size:15px;margin:2px 0 1px}
.main-head .mh-sub{font:8.5px var(--mono);color:var(--faint)}
.main-head .mh-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.badge{font:7.5px var(--mono);padding:2px 5px;border-radius:3px;border:1px solid var(--line);background:#121d2c;color:#93a4ba}
.badge.cyan{color:#a5f3fc;border-color:rgba(34,211,238,.22);background:rgba(34,211,238,.05)}
.badge.amber{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.05)}
.view{flex:1;min-height:0;overflow:auto;padding:11px 14px 14px;scrollbar-width:thin;scrollbar-color:#26344a transparent;display:none}
.view.on{display:block}
.view::-webkit-scrollbar{width:7px}
.view::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px}
.section-title{font:7.5px var(--mono);letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin:0 0 6px}
.matrix-wrap{border:1px solid var(--line);border-radius:9px;overflow:auto;background:#0a1420}
.matrix{display:grid;min-width:520px;grid-template-columns:minmax(190px,1.2fr) repeat(4,minmax(64px,1fr));font-size:9px}
.matrix .mh{padding:7px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font:7.5px var(--mono);color:var(--faint);background:#0d1926;position:sticky;top:0;z-index:2}
.matrix .mh:last-child{border-right:none}
.matrix .row-label{padding:7px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;min-width:0}
.matrix .row-label .rl-main{min-width:0;flex:1}
.matrix .row-label .rl-id{font:8.5px var(--mono);color:#b9c7da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.matrix .row-label .rl-sub{font-size:7px;color:var(--faint);margin-top:2px}
.matrix .cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;min-height:40px;position:relative;background:#0b1420}
.matrix .cell:last-child{border-right:none}
.matrix .cell:hover{background:#111f30}
.matrix .cell.sel{background:rgba(34,211,238,.08);box-shadow:inset 0 0 0 1px rgba(34,211,238,.3)}
.dotbtn{width:18px;height:18px;border-radius:50%;border:1px solid var(--ec,#22c55e);background:var(--ec,#22c55e);box-shadow:0 0 9px var(--ec,#22c55e)55;position:relative}
.dotbtn.warn{border-color:#f59e0b;background:transparent;box-shadow:none}
.dotbtn.err{border-color:#ef4444;background:rgba(239,68,68,.2);box-shadow:none}
.dotbtn.disabled{border-color:#475569;background:#1e293b;box-shadow:none}
.dotbtn .rev{position:absolute;right:-7px;top:-7px;background:#08111c;border:1px solid var(--line);border-radius:3px;color:#93a4ba;font:6px var(--mono);padding:1px 2px}
.cell-more{font:7.5px var(--mono);color:var(--faint)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;font:7.5px var(--mono);color:var(--faint)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:-1px}
.relation{display:grid;grid-template-columns:1.1fr 22px 1.2fr 22px 1.5fr;gap:6px;align-items:stretch;margin-top:10px}
.rel-col{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px;min-width:0}
.rel-col h4{margin:0 0 6px;font:7.5px var(--mono);color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.rel-arrow{display:grid;place-items:center;color:var(--faint);font-size:14px}
.port-row{display:flex;align-items:center;gap:5px;margin:4px 0;font:8px var(--mono);color:#9fb1c8;white-space:nowrap;overflow:hidden}
.port-row .dir{color:var(--cyan);width:10px}
.port-row .pty{color:var(--faint);margin-left:auto}
.binding-row{border:1px solid var(--line);border-radius:5px;background:#0c1623;padding:5px;margin:4px 0;font:8px var(--mono);color:#9fb1c8}
.binding-row b{display:block;color:#a5f3fc;font-weight:500;font-size:7.5px;margin-bottom:2px}
.binding-row span{color:var(--faint)}
.table{width:100%;border-collapse:collapse;font-size:8.5px}
.table th{text-align:left;font:7px var(--mono);color:var(--faint);padding:6px 7px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em;background:#0d1926;position:sticky;top:0}
.table td{padding:6px 7px;border-bottom:1px solid var(--line);color:#9fb1c8;white-space:nowrap}
.table tr:hover td{background:#101d2c}
.table .mono{font-family:var(--mono);color:#b9c7da}
.table .status{font:7px var(--mono);padding:2px 4px;border-radius:3px;border:1px solid var(--line)}
.table .status.ok{color:#86efac;border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.05)}
.table .status.warn{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.05)}
.table .status.err{color:#fca5a5;border-color:rgba(239,68,68,.22);background:rgba(239,68,68,.05)}
.table .status.disabled{color:#94a3b8;border-color:var(--line);background:#121d2c}
.build-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:#111b28;color:#8fa2bb;font-size:8px;padding:5px 8px}
.seg button.on{background:rgba(34,211,238,.11);color:#a5f3fc}
.select{border:1px solid var(--line);background:#111b28;color:#b9c7da;border-radius:5px;font-size:8.5px;padding:4px 5px;outline:none}
.setting-group{border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:8px;overflow:hidden}
.setting-group>.gh{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:#0f1a29}
.setting-group>.gh b{font:8.5px var(--mono);color:#a9bbd0;letter-spacing:.04em}
.setting-group>.gh span{font-size:7.5px;color:var(--faint);margin-left:auto}
.setting-row{display:grid;grid-template-columns:minmax(160px,1.3fr) minmax(120px,1fr) 74px 28px;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid rgba(148,163,184,.07)}
.setting-row:last-child{border-bottom:none}
.setting-row:hover{background:#121f30}
.setting-label b{display:block;font:8.5px var(--mono);color:#b9c7da}
.setting-label span{display:block;font-size:7px;color:var(--faint);margin-top:2px;line-height:1.4}
.setting-control select,.setting-control input[type=text]{width:100%;border:1px solid var(--line);background:#0a1420;color:#a9bbd0;border-radius:4px;font:8px var(--mono);padding:4px 5px;outline:none}
.setting-control input[type=checkbox]{accent-color:var(--cyan);width:13px;height:13px}
.setting-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.src{font:6.5px var(--mono);padding:1px 3px;border-radius:2px;border:1px solid var(--line);color:#8fa2bb;background:#121d2c}
.src.override{color:#fcd34d;border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.06)}
.src.policy{color:#fca5a5;border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.06)}
.reset{border:none;background:transparent;color:#5f7188;font:8px var(--mono);padding:2px}
.reset:hover{color:#a5f3fc}
.setting-val{font:7px var(--mono);color:#8fa2bb;text-align:right;overflow:hidden;text-overflow:ellipsis}
.pipeline{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.step{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:7px 9px}
.step .sic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:8px var(--mono);border:1px solid var(--line);color:var(--faint);flex:0 0 18px}
.step.running .sic{border-color:rgba(34,211,238,.45);color:#a5f3fc;background:rgba(34,211,238,.08)}
.step.ok .sic{border-color:rgba(34,197,94,.35);color:#86efac;background:rgba(34,197,94,.06)}
.step.failed .sic{border-color:rgba(239,68,68,.35);color:#fca5a5;background:rgba(239,68,68,.06)}
.step .st-main{flex:1;min-width:0}
.step .st-name{font:8.5px var(--mono);color:#b9c7da}
.step .st-sub{font-size:7px;color:var(--faint);margin-top:1px}
.step .st-time{font:7px var(--mono);color:var(--faint)}
.diag{display:flex;gap:7px;align-items:flex-start;border:1px solid var(--line);border-left:2px solid var(--amber);border-radius:5px;background:var(--card);padding:7px;margin-bottom:5px}
.diag.error{border-left-color:var(--red)}
.diag.info{border-left-color:var(--cyan)}
.diag .dg-code{font:7px var(--mono);color:#fcd34d;white-space:nowrap}
.diag.error .dg-code{color:#fca5a5}
.diag.info .dg-code{color:#a5f3fc}
.diag .dg-msg{font-size:8px;color:#9fb1c8;line-height:1.5}
.artifact{border:1px solid rgba(34,197,94,.22);border-radius:8px;background:rgba(34,197,94,.03);padding:9px}
.artifact h4{margin:0 0 6px;font:8px var(--mono);color:#86efac;letter-spacing:.08em}
.artifact .kv{display:grid;grid-template-columns:60px 1fr;gap:4px 7px;font:8px var(--mono);color:#9fb1c8}
.artifact .kv .k{color:var(--faint)}
#inspector{grid-row:2;border-left:1px solid var(--line);background:linear-gradient(180deg,#0e1624,#080d15);overflow-y:auto;padding:12px 12px 30px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
#inspector::-webkit-scrollbar{width:7px}
#inspector::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px;border:2px solid #080d15}
.insp-kicker{font:7.5px var(--mono);letter-spacing:.15em;color:var(--faint);text-transform:uppercase}
.insp-title{font-size:13px;margin:4px 0 2px;color:#dbeafe}
.insp-id{font:8px var(--mono);color:var(--faint);word-break:break-all;margin-bottom:9px}
.insp-section{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px;margin-bottom:7px}
.lh{font:7.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.kv{display:grid;grid-template-columns:54px 1fr;gap:3px 6px;font-size:8.5px;line-height:1.45}
.kv .k{color:var(--faint);font-family:var(--mono)}
.kv .v{color:#b9c7da;word-break:break-all}
.pill{display:inline-block;font:7px var(--mono);padding:1px 4px;border-radius:3px;border:1px solid var(--line);background:#162132;color:#93a4ba;margin:1px 2px 1px 0}
.pill.cyan{color:#a5f3fc;border-color:rgba(34,211,238,.22);background:rgba(34,211,238,.06)}
.pill.amber{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.06)}
.pill.green{color:#86efac;border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.06)}
.insp-btn{width:100%;border:1px solid var(--line);background:#142134;color:#9fb1c8;border-radius:5px;padding:5px;font-size:8.5px;margin-top:5px}
.insp-btn:hover{color:#dbeafe;border-color:var(--line2)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.summary .sbox{border:1px solid var(--line);border-radius:5px;background:#0c1623;padding:6px}
.summary .sbox b{display:block;font:700 11px var(--mono);color:#a5f3fc}
.summary .sbox span{font:6.5px var(--mono);color:var(--faint)}
#dock{grid-column:1/-1;grid-row:3;background:#080e17;border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.dock-head{display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--line);font:7.5px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
.dock-tabs{display:flex;gap:4px}
.dock-tab{border:1px solid transparent;background:transparent;color:#5f7188;border-radius:4px;padding:3px 6px;font:7.5px var(--mono)}
.dock-tab.on{color:#a5f3fc;background:rgba(34,211,238,.07);border-color:rgba(34,211,238,.16)}
.dock-clear{margin-left:auto;border:none;background:transparent;color:#5f7188;font:7.5px var(--mono)}
.dock-body{flex:1;overflow:auto;padding:6px 12px;font:8px/1.6 var(--mono);color:#8fa8c0;scrollbar-width:thin;scrollbar-color:#26344a transparent}
.dock-body::-webkit-scrollbar{width:7px}
.dock-body::-webkit-scrollbar-thumb{background:#26344a;border-radius:4px}
.log{white-space:pre-wrap}
.log .t{color:#4b5d73}
.log .ok{color:#86efac}
.log .warn{color:#fcd34d}
.log .err{color:#fca5a5}
.log .info{color:#a5f3fc}
.toast{position:fixed;left:50%;bottom:156px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#0b1420;border:1px solid var(--line2);color:#dbeafe;padding:7px 11px;border-radius:7px;font-size:9px;z-index:60;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){#app{grid-template-columns:230px minmax(0,1fr)}#inspector{display:none}}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:56px 1fr 120px;height:100%}#sidebar{display:none}header .search{display:none}nav button{padding:5px 6px;font-size:9px}.brand{min-width:auto}.relation{grid-template-columns:1fr}.rel-arrow{display:none}}
</style>
</head>
