<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLaunch 式启动坞 · 面层实例</title>
<style>
:root{
  --bg:#070b14; --bg2:#0b1220; --panel:rgba(15,23,42,.92); --panel2:#111c31; --panel3:#16233a;
  --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.24);
  --text:#e5edf8; --dim:#8fa2bb; --faint:#5f7188;
  --blue:#3b82f6; --cyan:#06b6d4; --violet:#8b5cf6; --amber:#f59e0b;
  --green:#22c55e; --red:#ef4444;
  --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --tile:74px;
}
body.light{
  --bg:#eaf0f7; --bg2:#f7fafc; --panel:rgba(255,255,255,.92); --panel2:#f7fafc; --panel3:#eef4fb;
  --line:rgba(15,23,42,.10); --line2:rgba(15,23,42,.18);
  --text:#0f172a; --dim:#52637a; --faint:#7c8ba1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--text);overflow:hidden;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
code,.mono{font-family:var(--mono)}
.desktop{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:
    radial-gradient(900px 500px at 18% 8%,rgba(59,130,246,.24),transparent 62%),
    radial-gradient(800px 460px at 86% 18%,rgba(139,92,246,.18),transparent 64%),
    radial-gradient(700px 500px at 55% 110%,rgba(6,182,212,.12),transparent 60%),
    linear-gradient(145deg,#050912,#0b1424 52%,#111a2d);
}
body.light .desktop{background:
  radial-gradient(900px 500px at 18% 8%,rgba(59,130,246,.12),transparent 62%),
  radial-gradient(800px 460px at 86% 18%,rgba(139,92,246,.10),transparent 64%),
  linear-gradient(145deg,#eef4fb,#fff 55%,#e8f0f9)}
.desktop:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(148,163,184,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.055) 1px,transparent 1px);
  background-size:42px 42px;mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 78%);
}
.desk-label{
  position:absolute;left:24px;top:20px;font-size:11px;color:rgba(226,239,255,.55);
  font-family:var(--mono);letter-spacing:.2px;display:flex;gap:9px;align-items:center;
}
body.light .desk-label{color:var(--faint)}
.desk-label kbd{border:1px solid var(--line2);border-radius:4px;padding:2px 5px;background:rgba(15,23,42,.35);font-size:9px}
body.light .desk-label kbd{background:#fff}
.desk-badge{
  position:absolute;right:24px;top:20px;display:flex;gap:7px;align-items:center;
  font-size:9px;color:rgba(226,239,255,.55);font-family:var(--mono);
}
body.light .desk-badge{color:var(--faint)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.10)}

.dock-wrap{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;transition:transform .28s ease,opacity .28s ease}
.dock-wrap.hidden{transform:translate(-50%,calc(100% + 42px));opacity:0;pointer-events:none}
.dock{
  width:min(780px,calc(100vw - 30px));border:1px solid rgba(148,163,184,.22);border-radius:20px;
  background:linear-gradient(180deg,rgba(17,28,49,.94),rgba(10,17,30,.94));
  backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.48),0 1px 0 rgba(255,255,255,.04) inset;
  overflow:hidden;position:relative;
}
body.light .dock{background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(247,250,252,.94));border-color:rgba(15,23,42,.14)}
.dock:before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(6,182,212,.65),rgba(139,92,246,.55),transparent)}
.dock-head{display:flex;align-items:center;gap:10px;padding:11px 13px 9px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow:auto}
.tab{border:1px solid transparent;border-radius:8px;background:transparent;color:var(--faint);font-size:10px;padding:6px 9px;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--panel3)}
.tab.active{color:#93c5fd;border-color:rgba(59,130,246,.24);background:rgba(59,130,246,.12)}
body.light .tab.active{color:#1d4ed8}
.dock-tools{display:flex;align-items:center;gap:6px;flex:none}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:6px 8px;width:150px}
.search span{color:var(--faint);font-size:12px}
.search input{width:100%;border:0;outline:0;background:transparent;font-size:10px}
.search input::placeholder{color:var(--faint)}
.icon-btn{width:31px;height:31px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--dim);font-size:13px}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}
.icon-btn.on{color:#93c5fd;border-color:rgba(59,130,246,.28);background:rgba(59,130,246,.12)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding:12px 13px 8px;min-height:190px}
.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid transparent;
  border-radius:11px;background:transparent;padding:8px 5px 7px;min-height:calc(var(--tile) + 12px);transition:.14s;
  user-select:none;
}
.tile:hover{background:rgba(148,163,184,.08);border-color:var(--line);transform:translateY(-2px)}
.tile.dragging{opacity:.35}
.tile.drop-target{border-color:var(--cyan);background:rgba(6,182,212,.09)}
.tile-icon{
  width:calc(var(--tile) * .60);height:calc(var(--tile) * .60);border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(145deg,rgba(59,130,246,.18),rgba(139,92,246,.10));
  border:1px solid rgba(148,163,184,.18);box-shadow:0 8px 18px rgba(0,0,0,.16);position:relative;
}
.tile[data-kind="flow"] .tile-icon{background:linear-gradient(145deg,rgba(139,92,246,.22),rgba(59,130,246,.10));border-color:rgba(139,92,246,.24)}
.tile[data-kind="point"] .tile-icon{background:linear-gradient(145deg,rgba(6,182,212,.20),rgba(59,130,246,.08));border-color:rgba(6,182,212,.20)}
.tile-icon .kind-dot{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--cyan);border:2px solid #0c1525;display:grid;place-items:center;font-size:5px;color:#04212a;font-weight:800}
.tile[data-kind="flow"] .kind-dot{background:var(--violet);color:#fff}
.tile-label{font-size:9px;line-height:1.25;text-align:center;color:var(--dim);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:hover .tile-label{color:var(--text)}
.tile-sub{font-size:7px;color:var(--faint);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hotkey{position:absolute;top:4px;right:5px;font-size:6px;color:var(--faint);font-family:var(--mono);background:rgba(15,23,42,.65);border:1px solid var(--line);border-radius:3px;padding:1px 3px}
body.light .hotkey{background:rgba(255,255,255,.8)}
.dock-foot{display:flex;align-items:center;gap:10px;padding:8px 13px 10px;border-top:1px solid var(--line)}
.pages{display:flex;gap:5px;align-items:center;flex:1}
.page-dot{width:7px;height:7px;border-radius:50%;border:0;background:rgba(148,163,184,.28);padding:0}
.page-dot.active{background:var(--cyan);box-shadow:0 0 0 3px rgba(6,182,212,.10);width:16px;border-radius:99px}
.foot-tools{display:flex;align-items:center;gap:8px}
.size-label{font-size:8px;color:var(--faint);font-family:var(--mono);display:flex;align-items:center;gap:5px}
input[type=range]{width:64px;accent-color:var(--cyan);height:3px}
.add-btn,.settings-btn{border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--dim);font-size:10px;padding:5px 7px}
.add-btn:hover,.settings-btn:hover{color:var(--text);border-color:var(--line2)}
.show-dock{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:19;display:none;
  border:1px solid rgba(6,182,212,.30);border-radius:9px;background:rgba(8,47,73,.82);color:#a5f3fc;
  font-size:10px;padding:8px 12px;backdrop-filter:blur(12px);box-shadow:0 12px 28px rgba(0,0,0,.30);
}
.show-dock.visible{display:block}
.launch-bubble{
  position:fixed;left:50%;bottom:210px;transform:translateX(-50%) translateY(8px);z-index:30;
  width:min(420px,calc(100vw - 30px));border:1px solid var(--line2);border-radius:12px;
  background:rgba(10,17,30,.92);backdrop-filter:blur(18px);box-shadow:0 18px 48px rgba(0,0,0,.42);
  padding:10px 12px;opacity:0;pointer-events:none;transition:.2s;
}
body.light .launch-bubble{background:rgba(255,255,255,.94)}
.launch-bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lb-head{display:flex;align-items:center;gap:7px}
.lb-kind{font-size:7px;padding:2px 4px;border-radius:3px;font-family:var(--mono);background:rgba(6,182,212,.12);color:#67e8f9;border:1px solid rgba(6,182,212,.20)}
.lb-kind.flow{background:rgba(139,92,246,.12);color:#c4b5fd;border-color:rgba(139,92,246,.22)}
.lb-name{font-size:11px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-status{font-size:8px;color:var(--faint);font-family:var(--mono)}
.lb-bar{height:5px;border-radius:99px;background:var(--panel3);overflow:hidden;margin:8px 0 5px}
.lb-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .1s linear}
.lb-sub{font-size:8px;color:var(--faint);font-family:var(--mono);display:flex;justify-content:space-between;gap:8px}
.ctx{
  position:fixed;z-index:50;min-width:150px;border:1px solid var(--line2);border-radius:9px;
  background:rgba(10,17,30,.96);box-shadow:0 18px 44px rgba(0,0,0,.42);padding:4px;display:none;
}
body.light .ctx{background:#fff}
.ctx.show{display:block}
.ctx button{width:100%;display:flex;justify-content:space-between;gap:12px;border:0;border-radius:5px;background:transparent;color:var(--dim);font-size:10px;padding:7px 8px;text-align:left}
.ctx button:hover{background:var(--panel3);color:var(--text)}
.ctx .sep{height:1px;background:var(--line);margin:3px 4px}
.ctx .danger{color:#fca5a5}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#0b1220;border:1px solid var(--line2);color:#dbeafe;padding:9px 13px;border-radius:9px;font-size:11px;box-shadow:0 14px 30px rgba(0,0,0,.35);transition:.2s;z-index:90}
body.light .toast{background:#fff;color:#0f172a}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){
  .dock{border-radius:16px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:9px}
  .tile{min-height:78px}
  .tile-icon{width:38px;height:38px;font-size:17px}
  .search{width:110px}
  .tabs .tab{padding:5px 7px}
  .dock-head{gap:6px;padding:9px}
  .size-label{display:none}
}
</style>
</head>
