<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>面板层可视化 · PanelClass / PanelInstance</title>
<style>
:root{
  --bg:#070b12;--panel:#0d1420;--card:#111a29;--card2:#152235;--line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.25);
  --ink:#e6eef9;--dim:#8fa2bb;--faint:#5f7188;--cyan:#22d3ee;--blue:#3b82f6;--violet:#8b5cf6;
  --amber:#f59e0b;--green:#22c55e;--pink:#ec4899;--red:#ef4444;
  --mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
  --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:260px minmax(0,1fr) 330px;height:100%}
#sidebar{background:linear-gradient(180deg,#0e1624,#080d15);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 15px 10px}
.eyebrow{font:9px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.brand h1{font-size:17px;margin:5px 0 3px}
.brand p{margin:0;color:var(--dim);font-size:11px;line-height:1.6}
.stats{display:flex;gap:7px;margin-top:10px}
.stat{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 8px}
.stat b{display:block;font:700 15px var(--mono);color:var(--cyan)}
.stat span{font-size:8.5px;color:var(--faint);font-family:var(--mono)}
.search-wrap{padding:8px 15px 6px}
.search{width:100%;border:1px solid var(--line);border-radius:8px;background:#0b1420;color:var(--ink);padding:8px 10px;outline:none;font-size:11px}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:rgba(34,211,238,.45);box-shadow:0 0 0 2px rgba(34,211,238,.08)}
.filters{padding:4px 15px 8px;display:flex;flex-wrap:wrap;gap:4px}
.chip-btn{border:1px solid var(--line);background:#111b28;color:#93a4ba;border-radius:99px;padding:3px 7px;font-size:9px;font-family:var(--mono)}
.chip-btn.on{color:#a5f3fc;border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.10)}
.classList{flex:1;overflow-y:auto;padding:0 8px 18px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
.classList::-webkit-scrollbar{width:7px}
.classList::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px;border:2px solid #080d15}
.class-item{display:flex;gap:9px;align-items:center;padding:8px 9px;border:1px solid transparent;border-radius:8px;cursor:pointer;margin-bottom:2px}
.class-item:hover{background:#121d2c;border-color:var(--line)}
.class-item.on{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.25)}
.class-icon{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:13px;flex:0 0 28px;background:#162234;border:1px solid var(--line);color:var(--cat,#22d3ee)}
.class-main{min-width:0;flex:1}
.class-name{font-size:11.5px;color:#dbeafe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.class-id{font:8.5px var(--mono);color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.class-side{text-align:right}
.class-count{font:600 10px var(--mono);color:var(--dim)}
.class-family{font:7.5px var(--mono);color:var(--faint);margin-top:2px}
#main{min-width:0;display:flex;flex-direction:column;background:radial-gradient(circle at 25% 0%,rgba(34,211,238,.05),transparent 45%),linear-gradient(180deg,#0a111c,#070b12);overflow:hidden}
.hero{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.hero-top{display:flex;gap:12px;align-items:flex-start}
.hero-icon{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:0 0 44px;background:linear-gradient(135deg,var(--cat,#22d3ee),rgba(15,23,42,.2));border:1px solid var(--line2);color:#fff;box-shadow:0 0 28px var(--cat,#22d3ee)22}
.hero-text{min-width:0;flex:1}
.hero-kicker{font:8.5px var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.hero h1{font-size:19px;margin:3px 0 2px}
.hero-id{font:10px var(--mono);color:var(--dim)}
.hero-desc{margin:6px 0 0;color:#94a8c0;font-size:11.5px;line-height:1.55;max-width:760px}
.hero-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.badge{font:8.5px var(--mono);padding:3px 6px;border-radius:4px;border:1px solid var(--line);background:#121d2c;color:#93a4ba}
.badge.cyan{color:#a5f3fc;border-color:rgba(34,211,238,.25);background:rgba(34,211,238,.07)}
.badge.amber{color:#fcd34d;border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.07)}
.badge.green{color:#86efac;border-color:rgba(34,197,94,.25);background:rgba(34,197,94,.07)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 18px;border-bottom:1px solid var(--line);background:rgba(13,20,32,.72)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:none;background:#111b28;color:#8fa2bb;font-size:9px;padding:5px 8px}
.seg button:hover{color:#dbeafe}
.seg button.on{background:rgba(34,211,238,.12);color:#a5f3fc}
.tool-label{font:8.5px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
.toolbar input[type=range]{width:110px;accent-color:var(--cyan)}
.toolbar select{border:1px solid var(--line);background:#111b28;color:#b9c7da;border-radius:5px;font-size:9px;padding:4px 5px;outline:none}
.chk{display:flex;align-items:center;gap:5px;font-size:9.5px;color:#9fb1c8;user-select:none;cursor:pointer}
.chk input{accent-color:var(--cyan);width:12px;height:12px;margin:0}
.workbench-wrap{flex:1;min-height:0;padding:12px 18px 18px}
.workbench{position:relative;height:100%;min-height:420px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:
  radial-gradient(circle at 60% 20%,rgba(34,211,238,.04),transparent 55%),
  linear-gradient(180deg,#0b1522,#080d15)}
.workbench::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.035) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.fake-sidebar{position:absolute;left:0;top:0;bottom:0;width:176px;border-right:1px solid var(--line);background:rgba(10,18,29,.88);padding:12px 10px;transition:margin .2s}
.fake-sidebar .fs-logo{font:700 11px var(--mono);color:#a5f3fc;margin-bottom:12px}
.fake-sidebar .fs-item{font-size:9.5px;color:#7e91a7;padding:6px 7px;border-radius:5px;margin-bottom:2px}
.fake-sidebar .fs-item.on{background:rgba(34,211,238,.07);color:#dbeafe}
.fake-main{position:absolute;left:176px;right:0;top:0;bottom:0;padding:18px;transition:margin .2s}
.fake-main .fm-kicker{font:8px var(--mono);color:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.fake-main h2{font-size:16px;margin:5px 0 6px;color:#dbeafe}
.fake-main p{font-size:10px;color:#72859b;line-height:1.6;max-width:560px;margin:0}
.fm-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;max-width:640px}
.fm-card{border:1px solid var(--line);border-radius:8px;background:rgba(17,26,41,.72);padding:9px;min-height:70px}
.fm-card b{display:block;font:600 10px var(--mono);color:#9fb1c8;margin-bottom:5px}
.fm-card span{display:block;height:5px;border-radius:3px;background:#1a283a;margin:4px 0}
.fm-card span.short{width:55%}
.panel-shell{position:absolute;display:flex;flex-direction:column;background:linear-gradient(180deg,#101a29,#0c1522);border:1px solid rgba(148,163,184,.22);box-shadow:0 18px 50px rgba(0,0,0,.42);z-index:6;min-width:0;overflow:hidden;transition:top .2s,left .2s,right .2s,bottom .2s,width .12s,height .2s,transform .2s,opacity .2s}
.panel-shell.closed{opacity:0;pointer-events:none;transform:translateY(8px) scale(.985)}
.workbench.mode-right .panel-shell{top:0;right:0;bottom:0;width:var(--pw);border-radius:0;border-right:none;border-top:none;border-bottom:none}
.workbench.mode-right .fake-main{margin-right:var(--pw)}
.workbench.mode-left .panel-shell{top:0;left:0;bottom:0;width:var(--pw);border-radius:0;border-left:none;border-top:none;border-bottom:none}
.workbench.mode-left .fake-sidebar{display:none}
.workbench.mode-left .fake-main{left:0;margin-left:var(--pw)}
.workbench.mode-bottom .panel-shell{left:176px;right:0;bottom:0;height:260px;border-radius:0;border-bottom:none;border-left:none;border-right:none}
.workbench.mode-bottom .fake-main{margin-bottom:260px}
.workbench.mode-floating .panel-shell{right:18px;bottom:18px;top:auto;width:var(--pw);height:min(540px,calc(100% - 36px));border-radius:11px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.workbench.mode-modal .panel-shell{left:50%;top:50%;right:auto;bottom:auto;width:min(var(--pw),calc(100% - 48px));height:min(560px,calc(100% - 48px));transform:translate(-50%,-50%);border-radius:12px;z-index:12}
.workbench.mode-modal .panel-backdrop{opacity:1;pointer-events:auto}
.workbench.mode-sheet .panel-shell{left:0;right:0;bottom:0;top:auto;height:320px;border-radius:14px 14px 0 0;z-index:12}
.workbench.mode-sheet .panel-backdrop{opacity:1;pointer-events:auto}
.panel-backdrop{position:absolute;inset:0;background:rgba(2,6,12,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:10}
.panel-head{flex:0 0 44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);position:relative}
.panel-head .ph-icon{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:#162234;border:1px solid var(--line);font-size:11px;color:var(--cat,#22d3ee)}
.panel-head .ph-main{min-width:0;flex:1}
.panel-head .ph-name{font:600 10.5px var(--mono);color:#dbeafe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-head .ph-sub{font:8px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.panel-head .ph-actions{display:flex;gap:3px}
.icon-btn{width:22px;height:22px;border:1px solid transparent;border-radius:5px;background:transparent;color:#72859b;font-size:11px;display:grid;place-items:center}
.icon-btn:hover{background:#162234;color:#dbeafe;border-color:var(--line)}
.panel-toolbar{flex:0 0 34px;display:flex;align-items:center;gap:5px;padding:0 9px;border-bottom:1px solid var(--line);background:rgba(13,22,35,.55);position:relative;overflow:hidden}
.ptab{font-size:8.5px;padding:4px 7px;border-radius:4px;color:#7e91a7;white-space:nowrap}
.ptab.on{background:rgba(34,211,238,.08);color:#a5f3fc}
.ptab-sep{width:1px;height:13px;background:var(--line);margin:0 2px}
.panel-body{flex:1;min-height:0;overflow:auto;padding:11px;position:relative;scrollbar-width:thin;scrollbar-color:#26344a transparent}
.panel-body::-webkit-scrollbar{width:7px}
.panel-body::-webkit-scrollbar-thumb{background:#26344a;border-radius:4px}
.panel-foot{flex:0 0 32px;display:flex;align-items:center;gap:7px;padding:0 10px;border-top:1px solid var(--line);background:rgba(13,22,35,.55);font:8px var(--mono);color:var(--faint);position:relative}
.panel-foot .dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.panel-foot .grow{flex:1}
.anatomy [data-region]{outline:1px dashed rgba(34,211,238,.55);outline-offset:-1px;position:relative}
.anatomy [data-region]::after{content:attr(data-region);position:absolute;right:3px;top:2px;font:7px var(--mono);color:#a5f3fc;background:rgba(8,17,30,.85);border:1px solid rgba(34,211,238,.25);border-radius:3px;padding:1px 3px;z-index:20;pointer-events:none}
.region-hl{background:rgba(34,211,238,.06)}
.wire-stack{display:flex;flex-direction:column;gap:7px}
.wire-row{display:flex;align-items:center;gap:6px}
.wire-label{width:54px;font:8px var(--mono);color:var(--faint);flex:0 0 54px}
.wire-value{flex:1;height:14px;border:1px solid var(--line);border-radius:4px;background:#0c1623;display:flex;align-items:center;padding:0 5px;font:8px var(--mono);color:#8fa2bb;overflow:hidden;white-space:nowrap}
.wire-value.hi{color:#a5f3fc;border-color:rgba(34,211,238,.25);background:rgba(34,211,238,.05)}
.wire-line{height:6px;border-radius:3px;background:#1a283a}
.wire-line.w40{width:40%}.wire-line.w60{width:60%}.wire-line.w80{width:80%}
.wire-box{border:1px solid var(--line);border-radius:7px;background:#0c1623;padding:8px;margin-bottom:7px}
.wire-box b{display:block;font:600 9px var(--mono);color:#a9bbd0;margin-bottom:5px}
.wire-chips{display:flex;flex-wrap:wrap;gap:4px}
.wire-chip{font:8px var(--mono);color:#93a4ba;border:1px solid var(--line);border-radius:4px;background:#121d2c;padding:2px 5px}
.wire-chip.cyan{color:#a5f3fc;border-color:rgba(34,211,238,.22);background:rgba(34,211,238,.06)}
.wire-chip.amber{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.06)}
.wire-chip.green{color:#86efac;border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.06)}
.wire-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(34,211,238,.25);background:rgba(34,211,238,.08);color:#a5f3fc;border-radius:4px;font:8px var(--mono);padding:4px 7px}
.wire-btn.gray{border-color:var(--line);background:#121d2c;color:#8fa2bb}
.wire-btn.red{border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.07);color:#fca5a5}
.wire-search{height:24px;border:1px solid var(--line);border-radius:5px;background:#0a1420;display:flex;align-items:center;padding:0 7px;font:9px var(--mono);color:#5f7188;margin-bottom:8px}
.wire-list-row{display:flex;align-items:center;gap:6px;padding:6px;border-radius:5px;border:1px solid transparent}
.wire-list-row:hover{background:#111d2c;border-color:var(--line)}
.wire-list-row .wr-main{flex:1;min-width:0}
.wire-list-row .wr-title{font:9px var(--mono);color:#b9c7da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wire-list-row .wr-sub{font:7.5px var(--mono);color:var(--faint);margin-top:2px}
.wire-list-row .wr-status{width:6px;height:6px;border-radius:50%;background:var(--green)}
.wire-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.wire-kpi{border:1px solid var(--line);border-radius:6px;background:#0c1623;padding:7px}
.wire-kpi b{display:block;font:700 13px var(--mono);color:#a5f3fc}
.wire-kpi span{font:7px var(--mono);color:var(--faint)}
.wire-chart{height:80px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(180deg,rgba(34,211,238,.05),transparent);position:relative;overflow:hidden;margin-top:7px}
.wire-chart::before{content:"";position:absolute;left:0;right:0;top:35%;height:1px;background:rgba(148,163,184,.12)}
.wire-chart svg{position:absolute;inset:0;width:100%;height:100%}
.wire-diff{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wire-code{font:8px/1.7 var(--mono);color:#8fa8c0;border:1px solid var(--line);border-radius:6px;background:#08111c;padding:7px;white-space:pre-wrap;overflow:hidden}
.wire-code .add{color:#86efac}.wire-code .del{color:#fca5a5}
.wire-msg{max-width:88%;border:1px solid var(--line);border-radius:7px;background:#0c1623;padding:7px;font:8.5px/1.5 var(--mono);color:#a9bbd0;margin-bottom:6px}
.wire-msg.me{margin-left:auto;background:rgba(34,211,238,.06);border-color:rgba(34,211,238,.18);color:#c8ecf5}
.wire-prompt{border:1px solid var(--line);border-radius:7px;background:#0a1420;padding:7px;font:8px var(--mono);color:#5f7188;display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.wire-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:150px;text-align:center;color:var(--faint)}
.wire-empty b{font-size:11px;color:#9fb1c8;margin-bottom:4px}
.wire-empty p{font-size:8.5px;max-width:220px;line-height:1.6;margin:0 0 8px}
.skeleton{height:8px;border-radius:3px;background:linear-gradient(90deg,#172538,#223550,#172538);background-size:200% 100%;animation:sk 1.2s linear infinite;margin:5px 0}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
#inspector{border-left:1px solid var(--line);background:linear-gradient(180deg,#0e1624,#080d15);overflow-y:auto;padding:15px 14px 42px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
#inspector::-webkit-scrollbar{width:8px}
#inspector::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px;border:2px solid #080d15}
.insp-kicker{font:8px var(--mono);letter-spacing:.15em;color:var(--faint);text-transform:uppercase}
.insp-title{font-size:14px;margin:5px 0 2px;color:#dbeafe}
.insp-id{font:8.5px var(--mono);color:var(--faint);word-break:break-all;margin-bottom:10px}
.insp-section{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px;margin-bottom:8px}
.insp-section .lh{font:8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.kv{display:grid;grid-template-columns:58px 1fr;gap:4px 7px;font-size:9.5px;line-height:1.45}
.kv .k{color:var(--faint);font-family:var(--mono)}
.kv .v{color:#b9c7da;word-break:break-all}
.pill{display:inline-block;font:8px var(--mono);padding:2px 4px;border-radius:3px;border:1px solid var(--line);background:#162132;color:#93a4ba;margin:2px 2px 0 0}
.pill.cyan{color:#a5f3fc;border-color:rgba(34,211,238,.22);background:rgba(34,211,238,.06)}
.pill.amber{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.06)}
.insp-btn{width:100%;border:1px solid var(--line);background:#142134;color:#9fb1c8;border-radius:6px;padding:6px;font-size:9.5px;margin-top:6px}
.insp-btn:hover{color:#dbeafe;border-color:var(--line2)}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#0b1420;border:1px solid var(--line2);color:#dbeafe;padding:8px 12px;border-radius:8px;font-size:10px;z-index:60;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1180px){#app{grid-template-columns:240px minmax(0,1fr)}#inspector{display:none}}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:38vh 1fr}#sidebar{border-right:none;border-bottom:1px solid var(--line)}.hero-badges{display:none}.fm-cards{grid-template-columns:1fr 1fr}}

/* v0.1 patches */
.mono{font-family:var(--mono)}
.workbench.mode-right .fake-main{right:var(--pw);margin-right:0}
.workbench.mode-left .fake-main{left:var(--pw);margin-left:0}
.workbench.mode-bottom .fake-main{bottom:260px;margin-bottom:0}
.workbench.panel-closed .panel-backdrop{opacity:0!important;pointer-events:none!important}
.wire-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.wire-tile{border:1px solid var(--line);border-radius:6px;background:#0c1623;padding:8px 6px;text-align:center;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.wire-tile b{font:700 10px var(--mono);color:#a5f3fc}
.wire-tile span{font:7.5px var(--mono);color:#7e91a7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wire-tile:hover{border-color:rgba(34,211,238,.28);background:rgba(34,211,238,.05)}

@media(max-width:820px){
  #main{overflow-y:auto}
  .workbench .fake-sidebar{display:none}
  .workbench.mode-right .panel-shell,.workbench.mode-left .panel-shell{width:min(var(--pw),78%)}
  .workbench.mode-right .fake-main{left:0;right:min(var(--pw),78%)}
  .workbench.mode-left .fake-main{left:min(var(--pw),78%);right:0}
  .workbench.mode-bottom .panel-shell{left:0}
  .workbench.mode-bottom .fake-main{left:0;bottom:260px}
  .hero{padding:10px 12px 8px}
  .hero h1{font-size:17px}
  .toolbar{padding:8px 12px}
  .workbench-wrap{padding:10px 12px 12px}
}
</style>
</head>
