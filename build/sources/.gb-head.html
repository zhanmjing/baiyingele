<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手势识别 → 点/线实例</title>
<style>
:root{
  --bg:#070b14;--bg2:#0b1220;--panel:#0f172a;--panel2:#111c31;--panel3:#16233a;
  --line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.24);
  --text:#e5edf8;--dim:#8fa2bb;--faint:#5f7188;
  --blue:#3b82f6;--cyan:#06b6d4;--violet:#8b5cf6;--amber:#f59e0b;--green:#22c55e;--red:#ef4444;
  --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
body.light{--bg:#f4f7fb;--bg2:#eaf0f7;--panel:#fff;--panel2:#f7fafc;--panel3:#eef4fb;--line:rgba(15,23,42,.10);--line2:rgba(15,23,42,.18);--text:#0f172a;--dim:#52637a;--faint:#7c8ba1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 8% -8%,rgba(6,182,212,.16),transparent 60%),radial-gradient(800px 460px at 96% 0%,rgba(139,92,246,.12),transparent 62%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:var(--font);padding:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
code,.mono{font-family:var(--mono)}
.app{max-width:1260px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;background:rgba(10,16,28,.72);backdrop-filter:blur(18px);padding:10px 13px;margin-bottom:12px}
body.light .topbar{background:rgba(255,255,255,.8)}
.brand{display:flex;align-items:center;gap:9px;min-width:230px}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#fff;font-size:15px;font-weight:800}
.brand b{font-size:12px;display:block}
.brand span{font-size:9px;color:var(--faint);font-family:var(--mono);display:block;margin-top:2px}
.top-hint{flex:1;text-align:center;font-size:9px;color:var(--faint);font-family:var(--mono)}
.top-hint kbd{border:1px solid var(--line2);border-radius:3px;padding:1px 4px;background:var(--panel3);font-size:8px}
.icon-btn{width:31px;height:31px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--dim)}
.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:12px}
.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel),var(--panel2));overflow:hidden}
.pad-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pad-head b{font-size:11px}
.pad-head span{font-size:9px;color:var(--faint);font-family:var(--mono)}
.phase{padding:2px 6px;border-radius:4px;border:1px solid var(--line);background:var(--panel3);font-size:8px;color:var(--faint);font-family:var(--mono)}
.phase.drawing{color:#67e8f9;border-color:rgba(6,182,212,.22);background:rgba(6,182,212,.08)}
.pad{position:relative;height:360px;margin:10px 12px;border:1px solid var(--line2);border-radius:12px;background:
  radial-gradient(circle at 50% 50%,rgba(59,130,246,.06),transparent 60%),
  linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px),
  var(--panel2);
  background-size:auto,24px 24px,24px 24px,auto;overflow:hidden;cursor:crosshair;touch-action:none}
.pad-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--faint);font-size:10px;pointer-events:none;line-height:1.7}
.pad-hint b{display:block;color:var(--dim);font-size:12px;margin-bottom:3px}
.pad svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.readout{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:0 12px 10px;align-items:center}
.pattern-box{border:1px solid var(--line);border-radius:8px;background:var(--panel3);padding:8px 10px}
.pattern-box .k{font-size:7px;letter-spacing:1px;color:var(--faint);font-family:var(--mono);text-transform:uppercase}
.pattern-box .v{font-size:16px;font-weight:700;font-family:var(--mono);margin-top:3px;letter-spacing:1px;color:#a5f3fc}
.dirs{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.dir{font-size:8px;padding:3px 6px;border-radius:4px;border:1px solid rgba(6,182,212,.18);background:rgba(6,182,212,.07);color:#67e8f9;font-family:var(--mono)}
.dir.fuzzy{border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.08);color:#fcd34d}
.pad-foot{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);background:rgba(15,23,42,.35)}
body.light .pad-foot{background:#f8fafc}
.preset{border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--dim);font-size:9px;padding:4px 6px;font-family:var(--mono)}
.preset:hover{color:var(--text);border-color:var(--line2)}
.spacer{flex:1}
.fuzzy-label{font-size:9px;color:var(--faint);display:flex;align-items:center;gap:4px}
.fuzzy-label input{accent-color:var(--amber)}
.side{display:flex;flex-direction:column;min-height:0}
.side-head{padding:11px 13px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-family:var(--mono)}
.binding-list{padding:8px;overflow:auto;max-height:310px}
.binding{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:8px 9px;margin-bottom:5px;cursor:pointer}
.binding:hover{border-color:var(--line2)}
.binding.hit{border-color:rgba(34,197,94,.38);background:rgba(34,197,94,.06);box-shadow:0 0 0 1px rgba(34,197,94,.12)}
.binding-top{display:flex;align-items:center;gap:6px}
.pattern-pill{font-family:var(--mono);font-size:10px;font-weight:700;color:#a5f3fc;min-width:48px}
.type-badge{font-size:7px;padding:2px 4px;border-radius:3px;font-family:var(--mono)}
.type-badge.point{color:#67e8f9;background:rgba(6,182,212,.10);border:1px solid rgba(6,182,212,.18)}
.type-badge.flow{color:#c4b5fd;background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.18)}
.binding-name{font-size:10px;color:var(--text);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.binding-sub{font-size:8px;color:var(--faint);font-family:var(--mono);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match{margin:0 8px 8px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:10px;min-height:100px}
.match.empty{display:grid;place-items:center;color:var(--faint);font-size:10px;text-align:center}
.match .k{font-size:7px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-family:var(--mono)}
.match h3{font-size:13px;margin:5px 0 3px}
.match .target{font-size:8px;color:var(--faint);font-family:var(--mono);word-break:break-all}
.match .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.match .run{margin-top:9px;width:100%;border:1px solid rgba(59,130,246,.35);border-radius:6px;background:rgba(59,130,246,.16);color:#93c5fd;font-size:10px;padding:7px}
body.light .match .run{color:#1d4ed8}
.match .run:disabled{opacity:.4;cursor:not-allowed}
.bubble{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;width:min(430px,calc(100vw - 30px));border:1px solid var(--line2);border-radius:11px;background:rgba(10,17,30,.94);backdrop-filter:blur(18px);padding:10px 12px;box-shadow:0 20px 50px rgba(0,0,0,.42);transition:.2s;z-index:30}
body.light .bubble{background:rgba(255,255,255,.94)}
.bubble.show{opacity:1;transform:translate(-50%,0)}
.bubble .top{display:flex;gap:6px;align-items:center}
.bubble .name{font-size:10px;font-weight:600;flex:1}
.bubble .status{font-size:8px;color:var(--faint);font-family:var(--mono)}
.bubble .bar{height:4px;border-radius:99px;background:var(--panel3);overflow:hidden;margin:8px 0 4px}
.bubble .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .08s linear}
.bubble .sub{font-size:8px;color:var(--faint);font-family:var(--mono);display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#0b1220;border:1px solid var(--line2);color:#dbeafe;padding:8px 12px;border-radius:8px;font-size:10px;z-index:40;transition:.2s}
body.light .toast{background:#fff;color:#0f172a}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.pad{height:300px}.binding-list{max-height:240px}}
</style>
</head>
