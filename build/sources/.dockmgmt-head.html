<html lang="zh-CN">
<head>

<style>

*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px}button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}

.brand{display:flex;align-items:center;gap:8px;min-width:190px}.brand .mark{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#08111c;font:800 12px var(--mono)}.brand b{font-size:13px}.brand span{display:block;font:7px var(--mono);color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.top-stats{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-left:auto}.mini{font:6.8px var(--mono);padding:2px 4px;border-radius:3px;border:1px solid var(--line);color:#8fa2bb;background:#121d2c;white-space:nowrap}.mini.cyan{color:#a5f3fc;border-color:rgba(34,211,238,.22);background:rgba(34,211,238,.06)}.mini.green{color:#86efac;border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.06)}.mini.amber{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.06)}.mini.violet{color:#c4b5fd;border-color:rgba(139,92,246,.24);background:rgba(139,92,246,.06)}
.btn{border:1px solid var(--line);background:#111b28;color:#9fb1c8;border-radius:6px;padding:5px 8px;font-size:8.5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:3px;cursor:pointer}.btn:hover{color:#dbeafe;border-color:var(--line2)}.btn.primary{border-color:rgba(139,92,246,.36);background:rgba(139,92,246,.12);color:#ddd6fe}.btn.small{padding:3px 5px;font-size:7px}.btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.25)}

.flow-item{border:1px solid var(--line);border-radius:6px;background:#0e1826;padding:6px 7px;margin-bottom:4px;cursor:pointer}.flow-item:hover{border-color:var(--line2);background:#121f30}.flow-item.on{border-color:rgba(139,92,246,.45);background:rgba(139,92,246,.08)}.fi-top{display:flex;align-items:center;gap:4px}.fi-name{font-size:9px;font-weight:650;color:#dbeafe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fi-ver{font:6px var(--mono);color:var(--faint);margin-left:auto;white-space:nowrap}.fi-id{font:6px var(--mono);color:var(--faint);margin-top:2px;word-break:break-all}.fi-meta{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}.fi-badge{font:6px var(--mono);color:#8fa2bb;border:1px solid var(--line);border-radius:2px;padding:1px 2px}
.inst-item{border:1px solid var(--line);border-radius:5px;background:#0b1420;padding:5px 6px;margin-bottom:3px;cursor:pointer}.inst-item:hover{background:#121f30}.inst-item.on{border-color:rgba(34,211,238,.38);background:rgba(34,211,238,.06)}.ii-top{display:flex;align-items:center;gap:4px}.ii-name{font-size:8px;color:#b9c7da;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ii-rev{font:6px var(--mono);color:#a5f3fc;margin-left:auto}.ii-id{font:6px var(--mono);color:var(--faint);margin-top:2px;word-break:break-all}.ii-status{font:6px var(--mono);padding:1px 2px;border-radius:2px;border:1px solid var(--line);color:#86efac;margin-top:3px;display:inline-block}.ii-status.draft{color:#fcd34d;border-color:rgba(245,158,11,.22)}.ii-status.archived{color:#94a3b8}

.hero{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}.hero-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#171f33;border:1px solid rgba(139,92,246,.25);color:#c4b5fd;font:800 13px var(--mono);flex:0 0 38px}.hero-main{min-width:0;flex:1}.kicker{font:7px var(--mono);color:var(--faint);letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:18px;margin:2px 0 2px}.hero p{margin:0;color:#94a8c0;font-size:10px;line-height:1.5}.hero-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.mode-tabs{display:flex;gap:2px;border:1px solid var(--line);border-radius:5px;padding:2px;background:#0a1420;align-self:flex-start}.mode-tabs button{border:none;background:transparent;color:#7e91a7;border-radius:3px;padding:4px 6px;font-size:7.5px}.mode-tabs button.on{background:rgba(139,92,246,.14);color:#ddd6fe}
.stats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}
.graph-panel{border:1px solid var(--line);border-radius:8px;background:#0a1420;margin-bottom:9px;overflow:hidden}.panel-head{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}.panel-head b{font-size:8.5px;color:#dbeafe}.panel-head .sub{font:6.8px var(--mono);color:var(--faint)}.panel-head .right{margin-left:auto;display:flex;gap:4px;align-items:center}.graph-scroll{overflow:auto;max-height:440px;min-height:250px;background:#08101b}.canvas{position:relative;margin:12px}.canvas svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{position:absolute;border:1px solid var(--line2);border-radius:7px;background:#101b2a;padding:7px 7px 6px;cursor:pointer;transition:border-color .12s,background .12s,box-shadow .12s;overflow:hidden}.node:hover{background:#152238}.node.selected{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(34,211,238,.22),0 6px 18px rgba(0,0,0,.24)}.node.point.impl{border-color:rgba(34,197,94,.42)}.node.point.placeholder{border-style:dashed;border-color:rgba(245,158,11,.42);background:rgba(35,27,16,.7)}.node.gate{border-color:rgba(139,92,246,.38);background:rgba(24,20,38,.8)}.node.subflow{border-color:rgba(59,130,246,.4);background:rgba(15,26,45,.8)}.n-kind{font:6px var(--mono);letter-spacing:.08em;color:var(--faint);text-transform:uppercase}.n-label{font-size:9px;font-weight:650;color:#dbeafe;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n-meta{font:6.5px var(--mono);color:#8fa2bb;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n-pin{font:6px var(--mono);color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n-badge{position:absolute;right:4px;bottom:4px;font:5.5px var(--mono);padding:1px 2px;border-radius:2px;border:1px solid var(--line);color:#8fa2bb;background:#0a1420}.n-badge.ok{color:#86efac;border-color:rgba(34,197,94,.28)}.n-badge.sub{color:#93c5fd;border-color:rgba(59,130,246,.28)}.n-badge.ph{color:#fcd34d;border-color:rgba(245,158,11,.28)}.n-jump{position:absolute;right:4px;top:4px;width:16px;height:16px;border-radius:4px;border:1px solid rgba(34,197,94,.3);background:rgba(34,197,94,.09);color:#86efac;font-size:8px;line-height:1;padding:0}
.legend{display:flex;gap:9px;flex-wrap:wrap;padding:5px 8px;border-top:1px solid var(--line);font:6.8px var(--mono);color:var(--faint)}.legend span{display:flex;align-items:center;gap:3px}.legend i{width:6px;height:6px;border-radius:2px;display:inline-block}.legend i.impl{background:var(--green)}.legend i.ph{background:var(--amber)}.legend i.gate{background:var(--violet)}.legend i.sub{background:var(--blue)}
.bind-panel{border:1px solid var(--line);border-radius:8px;background:#0a1420;overflow:hidden}.table-wrap{overflow:auto;max-height:290px}table{width:100%;border-collapse:collapse;font-size:8px}th{position:sticky;top:0;z-index:2;text-align:left;font:7px var(--mono);color:var(--faint);padding:6px 7px;border-bottom:1px solid var(--line);background:#0d1926;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}td{padding:6px 7px;border-bottom:1px solid rgba(148,163,184,.07);color:#9fb1c8;vertical-align:middle}.tr-node{cursor:pointer}.tr-node:hover td{background:#101d2c}.tr-node.on td{background:rgba(34,211,238,.05)}.mono{font-family:var(--mono);font-size:7px;color:#8fa2bb}.t-label{font-size:8.5px;color:#dbeafe}.t-sub{display:block;font:6.3px var(--mono);color:var(--faint);margin-top:1px;word-break:break-all}.pill{font:6px var(--mono);padding:1px 3px;border-radius:2px;border:1px solid var(--line);white-space:nowrap}.pill.ok{color:#86efac;border-color:rgba(34,197,94,.25);background:rgba(34,197,94,.05)}.pill.ph{color:#fcd34d;border-color:rgba(245,158,11,.28);background:rgba(245,158,11,.05)}.pill.gate{color:#c4b5fd;border-color:rgba(139,92,246,.28);background:rgba(139,92,246,.06)}.pill.sub{color:#93c5fd;border-color:rgba(59,130,246,.28);background:rgba(59,130,246,.06)}.plink{font:6.8px var(--mono);color:#86efac;border:1px solid rgba(34,197,94,.28);border-radius:3px;padding:2px 4px;background:rgba(34,197,94,.06);white-space:nowrap}.plink:hover{background:rgba(34,197,94,.12)}
#inspector{border-left:1px solid var(--line);background:linear-gradient(180deg,#0e1624,#080d15);overflow-y:auto;padding:12px 12px 32px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
.insp-kicker{font:7px var(--mono);color:var(--faint);letter-spacing:.14em;text-transform:uppercase}.insp-title{font-size:13px;margin:4px 0 2px;color:#dbeafe}.insp-id{font:8px var(--mono);color:#c4b5fd;word-break:break-all;margin-bottom:7px}.insp-section{border:1px solid var(--line);border-radius:7px;background:var(--card);padding:8px;margin-bottom:7px}.lh{font:7px var(--mono);color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}.kv{display:grid;grid-template-columns:60px 1fr;gap:3px 6px;font-size:8px;line-height:1.45}.kv .k{color:var(--faint);font-family:var(--mono)}.kv .v{color:#b9c7da;word-break:break-all}.note{font-size:7.5px;line-height:1.55;color:var(--faint);border-left:2px solid rgba(245,158,11,.4);padding-left:6px;margin-top:6px}.actions{display:flex;gap:4px;flex-wrap:wrap}.actions .btn{flex:1;min-width:70px}.insp-list{border:1px solid var(--line);border-radius:5px;overflow:auto;max-height:190px;background:#0a1420}.insp-row{display:flex;justify-content:space-between;gap:5px;padding:4px 6px;border-bottom:1px solid rgba(148,163,184,.07);font:6.8px var(--mono);color:#8fa2bb;cursor:pointer}.insp-row:hover,.insp-row.on{background:#121f30;color:#dbeafe}.empty{padding:24px 8px;text-align:center;color:var(--faint);font-size:9px}

/* ===== dock management ===== */
.panel-search{width:100%;border:1px solid var(--line);border-radius:5px;background:#08111b;color:#dbeafe;font:7px var(--mono);padding:5px 6px;outline:none;margin-bottom:6px}.panel-search::placeholder{color:#5f7188}

.dock-head{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line)}
.dock-brand{display:flex;align-items:center;gap:5px;min-width:0}.dock-brand b{font:8px var(--mono);color:#dbeafe;white-space:nowrap}.dock-brand span{font:5.5px var(--mono);color:#5f7188;white-space:nowrap}

.dock-tools{display:flex;gap:3px;flex:none}.dock-icon-btn{border:1px solid var(--line);background:#0d1826;color:#8fa2bb;border-radius:3px;width:18px;height:18px;font-size:8px;display:grid;place-items:center}

.dock-tile-icon{width:calc(var(--tile,64px) * .58);height:calc(var(--tile,64px) * .58);border-radius:10px;display:grid;place-items:center;margin:0 auto 4px;font:7px var(--mono);background:linear-gradient(145deg,rgba(34,211,238,.16),rgba(59,130,246,.06));border:1px solid rgba(34,211,238,.2);color:#a5f3fc;overflow:hidden}

.dock-label{font-size:6.5px;line-height:1.2;color:#9fb1c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dock-show-sub .dock-sub{display:block}.dock-sub{display:none;font:5px var(--mono);color:#5f7188;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dock-hotkey{position:absolute;right:3px;top:3px;font:5px var(--mono);border:1px solid var(--line);border-radius:2px;padding:0 2px;background:#0a1420;color:#8fa2bb}
.dock-map-dot{position:absolute;left:4px;top:4px;width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.6)}.dock-map-dot.ph{background:#f59e0b;box-shadow:none}
.dock-foot{display:flex;align-items:center;gap:5px;padding:6px 9px;border-top:1px solid var(--line)}.dock-page{width:13px;height:3px;border-radius:9px;background:#22d3ee;opacity:.65}.dock-page.dim{width:3px;background:#334155;opacity:1}.dock-foot .grow{flex:1}
.dock-template-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:8px}.dock-template{border:1px solid var(--line);border-radius:7px;background:#0d1826;padding:8px;cursor:pointer}.dock-template:hover{border-color:rgba(34,211,238,.3)}.dock-template b{display:block;font-size:8px;color:#dbeafe}.dock-template span{display:block;font:6px var(--mono);color:#5f7188;line-height:1.5;margin-top:3px}
.dock-settings{border:1px solid var(--line);border-radius:7px;background:#0d1826;padding:8px;margin-bottom:8px}.dock-settings .row{display:flex;align-items:center;gap:5px;margin-bottom:5px;font:6.5px var(--mono);color:#8fa2bb}.dock-settings .row label{min-width:54px;color:#5f7188}.dock-settings input[type=range]{flex:1;accent-color:#22d3ee}.dock-settings input[type=number],.dock-settings select{border:1px solid var(--line);border-radius:3px;background:#08111b;color:#9fb1c8;font:6.5px var(--mono);padding:2px 3px}.dock-settings .chk{display:flex;gap:3px;align-items:center}.dock-settings .chk input{accent-color:#22d3ee}
.target-tabs{display:flex;gap:3px;margin:6px 0}.target-tabs button{border:1px solid var(--line);border-radius:3px;padding:3px 7px;background:#0d1826;color:#7e91a7;font:6.5px var(--mono)}.target-tabs button.on{border-color:rgba(34,211,238,.28);background:rgba(34,211,238,.07);color:#a5f3fc}.target-search{width:100%;border:1px solid var(--line);border-radius:4px;background:#08111b;color:#dbeafe;padding:4px 6px;font:7px var(--mono);outline:none;margin-bottom:4px}.target-list{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:4px;background:#08111b}.target-item{display:flex;align-items:center;gap:5px;width:100%;border:none;border-bottom:1px solid rgba(148,163,184,.07);background:transparent;color:#8fa2bb;text-align:left;padding:4px 6px;font:6.5px var(--mono)}.target-item:hover{background:#121f30}.target-item.on{background:rgba(34,211,238,.07);color:#dbeafe}.target-item .ti-main{min-width:0;flex:1}.target-item .ti-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.target-item .ti-sub{display:block;color:#5f7188;font-size:5.6px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.target-kind{font:5.5px var(--mono);border:1px solid var(--line);border-radius:2px;padding:1px 2px;white-space:nowrap}.target-kind.point{color:#a5f3fc;border-color:rgba(34,211,238,.24)}.target-kind.line{color:#c4b5fd;border-color:rgba(139,92,246,.26)}.target-summary{display:flex;align-items:center;gap:5px;border:1px solid rgba(34,197,94,.2);border-radius:4px;background:rgba(34,197,94,.04);padding:4px 6px;margin-top:5px;font:6.5px var(--mono);color:#86efac;min-height:25px}
