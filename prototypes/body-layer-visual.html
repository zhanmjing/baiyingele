<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>体层可视化 · BodyClass / BodyInstance</title>
<style>
:root{
  --bg:#070b12;--bg2:#0b1220;--panel:#0d1420;--card:#111a29;--card2:#152235;
  --line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.24);
  --ink:#e6eef9;--dim:#8fa2bb;--faint:#5f7188;
  --cyan:#22d3ee;--blue:#3b82f6;--violet:#8b5cf6;--amber:#f59e0b;--green:#22c55e;--pink:#ec4899;--red:#ef4444;
  --mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
  --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:290px minmax(0,1fr) 330px;height:100%}
#sidebar{background:linear-gradient(180deg,#0e1624,#080d15);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 15px 10px}
.brand .eyebrow{font:9px var(--mono);letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.brand h1{font-size:17px;margin:5px 0 3px;letter-spacing:.01em}
.brand p{margin:0;color:var(--dim);font-size:11px;line-height:1.6}
.stats{display:flex;gap:7px;margin-top:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.stat b{display:block;font:700 15px var(--mono);color:var(--cyan)}
.stat span{font-size:8.5px;color:var(--faint);font-family:var(--mono)}
.search-wrap{padding:8px 15px 6px}
.search{width:100%;border:1px solid var(--line);border-radius:8px;background:#0b1420;color:var(--ink);padding:8px 10px;outline:none;font-size:11px}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:rgba(34,211,238,.45);box-shadow:0 0 0 2px rgba(34,211,238,.08)}
.filters{padding:4px 15px 8px;display:flex;flex-wrap:wrap;gap:4px}
.chip-btn{border:1px solid var(--line);background:#111b28;color:#93a4ba;border-radius:99px;padding:3px 7px;font-size:9px;font-family:var(--mono)}
.chip-btn:hover{color:#dbeafe;border-color:var(--line2)}
.chip-btn.on{color:#a5f3fc;border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.10)}
.prio-row{padding:0 15px 8px;display:flex;gap:4px}
.prio-btn{flex:1;border:1px solid var(--line);background:#111b28;color:#93a4ba;border-radius:5px;padding:4px;font-size:9px;font-family:var(--mono)}
.prio-btn.on{color:#fcd34d;border-color:rgba(245,158,11,.32);background:rgba(245,158,11,.08)}
.classList{flex:1;overflow-y:auto;padding:0 8px 18px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
.classList::-webkit-scrollbar{width:7px}
.classList::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px;border:2px solid #080d15}
.class-item{display:flex;gap:9px;align-items:center;padding:8px 9px;border:1px solid transparent;border-radius:8px;cursor:pointer;margin-bottom:2px}
.class-item:hover{background:#121d2c;border-color:var(--line)}
.class-item.on{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.25)}
.class-icon{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:13px;flex:0 0 28px;background:#162234;border:1px solid var(--line);color:var(--cat,#22d3ee)}
.class-main{min-width:0;flex:1}
.class-name{font-size:11.5px;color:#dbeafe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.class-id{font:8.5px var(--mono);color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.class-side{text-align:right;flex:0 0 auto}
.class-count{font:600 10px var(--mono);color:var(--dim)}
.class-prio{font:7.5px var(--mono);margin-top:2px;color:var(--faint)}
.class-prio.p0{color:#fca5a5}.class-prio.p1{color:#fcd34d}.class-prio.p2{color:#93c5fd}
#main{min-width:0;display:flex;flex-direction:column;background:radial-gradient(circle at 25% 0%,rgba(34,211,238,.055),transparent 45%),linear-gradient(180deg,#0a111c,#070b12);overflow:hidden}
.hero{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.hero-top{display:flex;gap:13px;align-items:flex-start}
.hero-icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:0 0 48px;background:linear-gradient(135deg,var(--cat,#22d3ee),rgba(15,23,42,.2));border:1px solid var(--line2);color:#fff;box-shadow:0 0 28px var(--cat,#22d3ee)22}
.hero-text{min-width:0;flex:1}
.hero-kicker{font:8.5px var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.hero h1{font-size:20px;margin:3px 0 2px;letter-spacing:.01em}
.hero-id{font:10px var(--mono);color:var(--dim)}
.hero-desc{margin:7px 0 0;color:#94a8c0;font-size:11.5px;line-height:1.6;max-width:760px}
.hero-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}
.badge{font:8.5px var(--mono);padding:3px 6px;border-radius:4px;border:1px solid var(--line);background:#121d2c;color:#93a4ba}
.badge.p0{color:#fca5a5;border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.07)}
.badge.p1{color:#fcd34d;border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.07)}
.badge.p2{color:#93c5fd;border-color:rgba(59,130,246,.25);background:rgba(59,130,246,.07)}
.tabs{display:flex;gap:2px;padding:9px 20px 0;border-bottom:1px solid var(--line)}
.tab{border:none;background:transparent;color:var(--faint);font-size:11px;padding:8px 11px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:#dbeafe}
.tab.on{color:#a5f3fc;border-bottom-color:var(--cyan)}
#content{flex:1;overflow-y:auto;padding:14px 20px 46px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
#content::-webkit-scrollbar{width:9px}
#content::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px;border:2px solid #070b12}
.panel{border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,var(--card),#0e1725)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.panel-head b{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.panel-body{padding:12px}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.mono{font-family:var(--mono)}
.pkg{position:relative;border:1px dashed rgba(34,211,238,.36);border-radius:13px;background:linear-gradient(180deg,rgba(34,211,238,.055),rgba(17,26,41,.86));box-shadow:0 0 0 1px rgba(34,211,238,.05) inset;padding:12px}
.pkg::before{content:"";position:absolute;inset:-1px;border-radius:13px;pointer-events:none;background:radial-gradient(240px 100px at 20% 0%,rgba(34,211,238,.08),transparent 70%)}
.pkg-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;position:relative;z-index:1}
.pkg-kicker{font:8px var(--mono);letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}
.pkg-id{font:600 13px var(--mono);color:#dbeafe;margin-top:3px}
.pkg-id span{color:var(--faint);font-weight:400}
.pkg-sub{font:9px var(--mono);color:var(--faint);margin-top:4px}
.pkg-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.layer-strip{display:grid;grid-template-columns:1.3fr auto 1.3fr auto 1.3fr auto 1.3fr;align-items:center;gap:4px;margin:4px 0 13px;position:relative;z-index:1}
.layer-node{border:1px solid var(--line);border-radius:8px;background:#0d1725;padding:7px 8px;text-align:center;min-width:0}
.layer-node b{display:block;font:600 10px var(--mono);color:var(--lc,#22d3ee);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-node span{display:block;font-size:8px;color:var(--faint);margin-top:2px}
.layer-arrow{color:var(--faint);font:12px var(--mono);text-align:center}
.pkg-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:relative;z-index:1}
.layer-block{border:1px solid var(--line);border-radius:8px;background:#0c1522;padding:8px;min-width:0}
.layer-block .lh{font:8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:9px var(--mono);color:#a9bbd0;background:#142134;border:1px solid var(--line);border-radius:4px;padding:3px 5px;white-space:nowrap}
.chip.surface{color:#93c5fd;border-color:rgba(59,130,246,.22);background:rgba(59,130,246,.07)}
.chip.flow{color:#c4b5fd;border-color:rgba(139,92,246,.24);background:rgba(139,92,246,.07)}
.chip.point{color:#86efac;border-color:rgba(34,197,94,.24);background:rgba(34,197,94,.07)}
.chip.setting{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.07)}
.chip.perm{color:#f9a8d4;border-color:rgba(236,72,153,.22);background:rgba(236,72,153,.07)}
.pkg-meta{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:8px;margin-top:8px;position:relative;z-index:1}
.meta-block{border:1px solid var(--line);border-radius:8px;background:#0c1522;padding:8px;min-width:0}
.meta-block .lh{font:8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.pkg-foot{display:flex;flex-wrap:wrap;gap:5px 13px;margin-top:10px;padding-top:9px;border-top:1px solid rgba(148,163,184,.10);font:8.5px var(--mono);color:var(--faint);position:relative;z-index:1}
.pkg-foot b{color:var(--dim);font-weight:400}
.instance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
.inst-card{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:10px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
.inst-card:hover{border-color:rgba(34,211,238,.28);background:#132033;transform:translateY(-1px)}
.inst-card.sel{border-color:rgba(34,211,238,.5);box-shadow:0 0 0 1px rgba(34,211,238,.12) inset}
.inst-top{display:flex;align-items:center;gap:6px}
.inst-name{font:600 11px var(--mono);color:#dbeafe;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inst-rev{font:8px var(--mono);color:var(--faint);margin-left:auto}
.inst-status{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.inst-id{font:8px var(--mono);color:var(--faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inst-desc{font-size:10px;color:#93a8c0;margin-top:6px;line-height:1.45;min-height:28px}
.inst-chips{margin-top:6px}
.inst-card .start{position:absolute;right:8px;bottom:8px;border:1px solid rgba(34,211,238,.25);background:rgba(34,211,238,.09);color:#a5f3fc;border-radius:4px;font-size:8px;padding:3px 6px;opacity:0;transition:.14s}
.inst-card:hover .start{opacity:1}
.manifest-pre{margin:0;border:1px solid var(--line);border-radius:9px;background:#08111c;padding:12px;font:10px/1.65 var(--mono);color:#a9c4df;white-space:pre-wrap;word-break:break-word;max-height:560px;overflow:auto}
.copy-btn{border:1px solid var(--line);border-radius:5px;background:#142134;color:#9fb1c8;font-size:9px;padding:4px 7px}
.copy-btn:hover{color:#dbeafe;border-color:var(--line2)}
.life{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:8px 2px 6px}
.life-step{flex:1 0 150px;position:relative;padding:10px;border:1px solid var(--line);border-radius:9px;background:#0c1522;margin-right:24px;min-height:118px}
.life-step:last-child{margin-right:0}
.life-step::after{content:"→";position:absolute;right:-19px;top:50%;transform:translateY(-50%);color:var(--faint);font:12px var(--mono)}
.life-step:last-child::after{display:none}
.life-step.done{border-color:rgba(34,197,94,.24);background:rgba(34,197,94,.045)}
.life-step.active{border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.065);box-shadow:0 0 0 1px rgba(34,211,238,.08) inset}
.life-num{font:8px var(--mono);color:var(--faint)}
.life-name{font-size:11px;color:#dbeafe;margin:4px 0 3px}
.life-desc{font-size:9px;color:var(--dim);line-height:1.45}
.life-gates{margin-top:7px;display:flex;flex-wrap:wrap;gap:3px}
.life-gate{font:7.5px var(--mono);padding:2px 4px;border-radius:3px;border:1px solid var(--line);color:#93a4ba;background:#121d2c}
#inspector{border-left:1px solid var(--line);background:linear-gradient(180deg,#0e1624,#080d15);overflow-y:auto;padding:15px 14px 42px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
#inspector::-webkit-scrollbar{width:8px}
#inspector::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px;border:2px solid #080d15}
.insp-kicker{font:8px var(--mono);letter-spacing:.15em;color:var(--faint);text-transform:uppercase}
.insp-title{font-size:14px;margin:5px 0 2px;color:#dbeafe}
.insp-id{font:8.5px var(--mono);color:var(--faint);word-break:break-all;margin-bottom:10px}
.insp-section{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px;margin-bottom:8px}
.insp-section .lh{font:8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.kv{display:grid;grid-template-columns:58px 1fr;gap:4px 7px;font-size:9.5px;line-height:1.45}
.kv .k{color:var(--faint);font-family:var(--mono)}
.kv .v{color:#b9c7da;word-break:break-all}
.insp-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.insp-btn{border:1px solid var(--line);background:#142134;color:#9fb1c8;border-radius:6px;padding:6px;font-size:9.5px}
.insp-btn:hover{color:#dbeafe;border-color:var(--line2)}
.insp-btn.primary{border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.10);color:#a5f3fc}
.insp-empty{color:var(--faint);font-size:10px;line-height:1.7;padding:8px 0}
.bubble{position:fixed;left:50%;bottom:20px;transform:translate(-50%,18px);opacity:0;pointer-events:none;width:min(430px,calc(100vw - 30px));border:1px solid var(--line2);border-radius:11px;background:rgba(10,17,30,.95);backdrop-filter:blur(18px);padding:10px 12px;box-shadow:0 20px 50px rgba(0,0,0,.46);transition:.2s;z-index:40}
.bubble.show{opacity:1;transform:translate(-50%,0)}
.bubble .top{display:flex;align-items:center;gap:6px}
.bubble .name{font:600 10px var(--mono);flex:1;color:#dbeafe}
.bubble .status{font:8px var(--mono);color:var(--faint)}
.bubble .bar{height:4px;border-radius:99px;background:#162233;overflow:hidden;margin:8px 0 4px}
.bubble .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .08s linear}
.bubble .sub{display:flex;justify-content:space-between;gap:8px;font:8px var(--mono);color:var(--faint)}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#0b1420;border:1px solid var(--line2);color:#dbeafe;padding:8px 12px;border-radius:8px;font-size:10px;z-index:50;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1180px){#app{grid-template-columns:260px minmax(0,1fr)}#inspector{display:none}}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:42vh 1fr}#sidebar{border-right:none;border-bottom:1px solid var(--line)}#main{min-height:0}.hero-badges{display:none}}
</style>
</head>

<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="eyebrow">Body Layer</div>
      <h1>体层可视化</h1>
      <p>BodyClass 是产品蓝图；BodyInstance 是具体安装配置。点开一个类，看它由哪些面、线、点组成。</p>
      <div class="stats">
        <div class="stat"><b id="statClasses">29</b><span>classes</span></div>
        <div class="stat"><b id="statInstances">82</b><span>instances</span></div>
        <div class="stat"><b id="statP0">9</b><span>P0</span></div>
      </div>
    </div>
    <div class="search-wrap"><input class="search" id="search" placeholder="搜索 body / 实例 / 描述…"></div>
    <div class="filters" id="filters"></div>
    <div class="prio-row" id="prioRow">
      <button class="prio-btn on" data-prio="all">全部</button>
      <button class="prio-btn" data-prio="P0">P0</button>
      <button class="prio-btn" data-prio="P1">P1</button>
      <button class="prio-btn" data-prio="P2">P2</button>
    </div>
    <div class="classList" id="classList"></div>
  </aside>

  <main id="main">
    <header class="hero">
      <div class="hero-top">
        <div class="hero-icon" id="heroIcon">◈</div>
        <div class="hero-text">
          <div class="hero-kicker">BodyClass</div>
          <h1 id="heroName">文件预览</h1>
          <div class="hero-id" id="heroId">body.file-preview@1.0.0</div>
          <p class="hero-desc" id="heroDesc"></p>
        </div>
        <div class="hero-badges" id="heroBadges"></div>
      </div>
    </header>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="composition">组合</button>
      <button class="tab" data-tab="instances">实例</button>
      <button class="tab" data-tab="manifest">Manifest</button>
      <button class="tab" data-tab="lifecycle">生命周期</button>
    </nav>
    <div id="content"></div>
  </main>

  <aside id="inspector">
    <div class="insp-empty">选择左侧的 BodyClass，或点击实例卡片查看详情。</div>
  </aside>
</div>

<div class="bubble" id="bubble">
  <div class="top"><span class="badge" id="bubbleKind">BODY</span><span class="name" id="bubbleName">—</span><span class="status" id="bubbleStatus">running</span></div>
  <div class="bar"><i id="bubbleBar"></i></div>
  <div class="sub"><span id="bubbleSub">—</span><span id="bubblePct">0%</span></div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const CATS = {
  content:  { label: '内容', color: '#22d3ee' },
  clipboard:{ label: '剪贴板', color: '#f59e0b' },
  window:   { label: '窗口', color: '#3b82f6' },
  system:   { label: '系统', color: '#22c55e' },
  web:      { label: 'Web', color: '#ec4899' },
  ai:       { label: 'AI', color: '#8b5cf6' },
  suite:    { label: '套件', color: '#f97316' }
};

function I(label, desc, rev = 1, acts = [], settings = '') {
  return { label, desc, rev, acts, settings, status: 'active' };
}

function C(id, name, icon, cat, prio, desc, flows, surfaces, points, settings, perms, instances, tests = []) {
  return { id, name, icon, cat, prio, desc, flows, surfaces, points, settings, perms, instances, tests, version: '1.0.0' };
}

const CLASSES = [
  C('body.file-preview', '文件预览', '◈', 'content', 'P0', '任意文件预览：文本、图片、PDF、视频、音频统一窗口。',
    ['flow.preview-file'], ['surface.preview-window'], ['file.read', 'render.text', 'render.image'],
    ['preview.maxBytes', 'preview.encoding', 'preview.zoom'], ['fs.read', 'window.open'], [
      I('text', '文本预览，支持编码/换行识别', 1, ['.txt', '.log', '.json'], 'renderer=text · UTF-8'),
      I('markdown', 'Markdown 渲染与代码块', 1, ['.md', '.markdown'], 'renderer=markdown · sanitize=true'),
      I('image', '图片预览，fit/zoom', 1, ['.png', '.jpg', '.jpeg', '.webp', '.gif'], 'renderer=image · fit=contain'),
      I('pdf', 'PDF 分页/缩放', 1, ['.pdf'], 'renderer=pdf · page=1 · zoom=fit'),
      I('video', '视频播放器，流式读取', 1, ['.mp4', '.webm', '.mkv'], 'renderer=video · stream=true'),
      I('audio', '音频波形与播放', 1, ['.mp3', '.wav', '.flac'], 'renderer=audio · waveform=true')

CLASSES.forEach(c => {
  c.tests = c.tests.length ? c.tests : ['smoke.' + c.id.split('.').pop()];
  c.instances.forEach(ins => {
    ins.id = `${c.id}.${ins.label}@r${ins.rev}`;
    ins.classId = c.id;
    ins.status = ins.status || 'active';
  });
});

const state = {
  selectedId: 'body.file-preview',
  tab: 'composition',
  query: '',
  cat: 'all',
  prio: 'all',
  selInstance: null,
  bubbleTimer: null,
  progressTimer: null,
  toastTimer: null
};

const selectedClass = () => CLASSES.find(c => c.id === state.selectedId) || CLASSES[0];
const totalInstances = () => CLASSES.reduce((n, c) => n + c.instances.length, 0);
const p0Count = () => CLASSES.filter(c => c.prio === 'P0').length;

/* ============================================================
   1. 列表与顶部
   ============================================================ */
function renderStats() {
  $('#statClasses').textContent = CLASSES.length;
  $('#statInstances').textContent = totalInstances();
  $('#statP0').textContent = p0Count();
}

function renderFilters() {
  const cats = [{ id: 'all', label: '全部' }, ...Object.entries(CATS).map(([id, v]) => ({ id, label: v.label }))];
  $('#filters').innerHTML = cats.map(c => {
    const n = c.id === 'all' ? CLASSES.length : CLASSES.filter(x => x.cat === c.id).length;
    return `<button class="chip-btn ${state.cat === c.id ? 'on' : ''}" data-cat="${c.id}">${c.label} ${n}</button>`;
  }).join('');
  $$('#filters [data-cat]').forEach(b => b.onclick = () => { state.cat = b.dataset.cat; renderFilters(); renderList(); });
  $$('#prioRow [data-prio]').forEach(b => b.classList.toggle('on', b.dataset.prio === state.prio));
}

function filteredClasses() {
  const q = state.query.trim().toLowerCase();
  return CLASSES.filter(c => {
    if (state.cat !== 'all' && c.cat !== state.cat) return false;
    if (state.prio !== 'all' && c.prio !== state.prio) return false;
    if (!q) return true;
    const hay = [c.id, c.name, c.desc, ...c.instances.map(i => i.id + ' ' + i.desc)].join(' ').toLowerCase();
    return hay.includes(q);
  }).sort((a, b) => {
    const rank = { P0: 0, P1: 1, P2: 2 };
    return rank[a.prio] - rank[b.prio] || a.name.localeCompare(b.name, 'zh');
  });
}

function renderList() {
  const list = filteredClasses();
  if (!list.length) {
    $('#classList').innerHTML = '<div style="padding:20px 10px;color:var(--faint);font-size:10.5px;text-align:center;line-height:1.7">没有匹配的 BodyClass。<br>换个关键词或清空筛选。</div>';
    return;
  }
  $('#classList').innerHTML = list.map(c => {
    const color = CATS[c.cat].color;
    return `<div class="class-item ${c.id === state.selectedId ? 'on' : ''}" data-class="${esc(c.id)}" style="--cat:${color}">
      <div class="class-icon">${esc(c.icon)}</div>
      <div class="class-main"><div class="class-name">${esc(c.name)}</div><div class="class-id">${esc(c.id)}</div></div>
      <div class="class-side"><div class="class-count">${c.instances.length}</div><div class="class-prio ${c.prio.toLowerCase()}">${c.prio}</div></div>
    </div>`;
  }).join('');
  $$('#classList [data-class]').forEach(el => el.onclick = () => selectClass(el.dataset.class));
}

function renderHero() {
  const c = selectedClass();
  const color = CATS[c.cat].color;
  $('#heroIcon').textContent = c.icon;
  $('#heroIcon').style.setProperty('--cat', color);
  $('#heroName').textContent = c.name;
  $('#heroId').textContent = `${c.id}@${c.version}`;
  $('#heroDesc').textContent = c.desc;
  $('#heroBadges').innerHTML = `
    <span class="badge ${c.prio.toLowerCase()}">${c.prio}</span>
    <span class="badge" style="color:${color}">${CATS[c.cat].label}</span>
    <span class="badge">${c.instances.length} instances</span>
    <span class="badge">BodyClass</span>`;
}

function renderTabs() {
  $$('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
}

/* ============================================================
   2. 组合 / 实例 / Manifest / 生命周期
   ============================================================ */
function shortHash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16).padStart(8, '0');
}

function digestOf(c) { return 'sha256:' + shortHash(c.id + c.version + c.instances.length) + '…'; }

function chips(arr, cls) {
  return arr.map(x => `<span class="chip ${cls || ''}">${esc(x)}</span>`).join('');
}

function compositionHTML(c) {
  const color = CATS[c.cat].color;
  return `
  <div class="panel" style="border-color:${color}22">
    <div class="panel-head"><b>Body Composition</b><span class="mono" style="font-size:8px;color:var(--faint)">${esc(c.id)}@${esc(c.version)}</span></div>
    <div class="panel-body">
      <div class="layer-strip">
        <div class="layer-node" style="--lc:${color}"><b>BodyClass</b><span>${esc(c.id)}</span></div>
        <div class="layer-arrow">→</div>
        <div class="layer-node" style="--lc:#3b82f6"><b>SurfaceInstance</b><span>${c.surfaces.length} 个面</span></div>
        <div class="layer-arrow">→</div>
        <div class="layer-node" style="--lc:#8b5cf6"><b>FlowInstance</b><span>${c.flows.length} 条线</span></div>
        <div class="layer-arrow">→</div>
        <div class="layer-node" style="--lc:#22c55e"><b>PointInstance</b><span>${c.points.length} 个点</span></div>
      </div>

      <div class="pkg">
        <div class="pkg-head">
          <div>
            <div class="pkg-kicker">Body Package · installed</div>
            <div class="pkg-id">${esc(c.id)} <span>@${esc(c.version)} · r${c.instances.length}</span></div>
            <div class="pkg-sub">manifest + payload + blockmap + signature + digest</div>
          </div>
          <div class="pkg-badges">
            <span class="badge ${c.prio.toLowerCase()}">${c.prio}</span>
            <span class="badge" style="color:${color}">${CATS[c.cat].label}</span>
            <span class="badge">active</span>
          </div>
        </div>

        <div class="pkg-grid" style="margin-top:11px">
          <div class="layer-block">
            <div class="lh">Surfaces · ${c.surfaces.length}</div>
            <div class="chips">${chips(c.surfaces, 'surface')}</div>
          </div>
          <div class="layer-block">
            <div class="lh">Flows · ${c.flows.length}</div>
            <div class="chips">${chips(c.flows, 'flow')}</div>
          </div>
          <div class="layer-block">
            <div class="lh">Points · ${c.points.length}</div>
            <div class="chips">${chips(c.points, 'point')}</div>
          </div>
        </div>

        <div class="pkg-meta">
          <div class="meta-block">
            <div class="lh">Settings</div>
            <div class="chips">${chips(c.settings, 'setting')}</div>
          </div>
          <div class="meta-block">
            <div class="lh">Permissions</div>
            <div class="chips">${chips(c.perms, 'perm')}</div>
          </div>
          <div class="meta-block">
            <div class="lh">Tests</div>
            <div class="chips">${chips(c.tests)}</div>
          </div>
        </div>

        <div class="pkg-foot">
          <span>entrypoint <b>${esc(c.surfaces[0] || '—')}</b></span>
          <span>digest <b>${digestOf(c)}</b></span>
          <span>signature <b>example-key-1</b></span>
          <span>update <b>stable</b></span>
        </div>
      </div>

      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        <span class="chip">BodyInstance: ${c.instances.length}</span>
        <span class="chip">BodyPackage: 1</span>
        <span class="chip">BodyInstallation: 1</span>
        <span class="chip">permissions: ${c.perms.length}</span>
        <span class="chip">tests: ${c.tests.length}</span>
      </div>
    </div>
  </div>`;
}

function instancesHTML(c) {
  return `
  <div class="panel">
    <div class="panel-head"><b>Body Instances</b><span class="mono" style="font-size:8px;color:var(--faint)">${c.instances.length} 个实例 · 点击卡片查看绑定</span></div>
    <div class="panel-body">
      <div class="instance-grid">
        ${c.instances.map(ins => `
          <div class="inst-card ${state.selInstance && state.selInstance.id === ins.id ? 'sel' : ''}" data-inst="${esc(ins.id)}">
            <div class="inst-top"><span class="inst-status"></span><span class="inst-name">${esc(ins.label)}</span><span class="inst-rev">r${ins.rev}</span></div>
            <div class="inst-id">${esc(ins.id)}</div>
            <div class="inst-desc">${esc(ins.desc)}</div>
            <div class="chips inst-chips">${ins.acts.slice(0, 3).map(a => `<span class="chip">${esc(a)}</span>`).join('')}${ins.acts.length > 3 ? `<span class="chip">+${ins.acts.length - 3}</span>` : ''}</div>
            <div class="mono" style="font-size:8px;color:var(--faint);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ins.settings)}</div>
            <button class="start" data-start="${esc(ins.id)}">▶ 启动</button>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function manifest(c) {
  return {
    schemaVersion: '1.0',
    id: c.id,
    version: c.version,
    name: c.name,
    description: c.desc,
    entrypoints: { main: c.surfaces[0] || null, onActivate: c.flows[0] || null },
    contributes: { flows: c.flows, surfaces: c.surfaces, settings: c.settings, triggers: ['hotkey', 'file', 'manual'] },
    permissions: c.perms,
    dependencies: [],
    assets: [],
    tests: c.tests,
    instances: c.instances.map(i => ({ id: i.id, revision: i.rev, status: i.status, activations: i.acts, settings: i.settings })),
    update: { channel: 'stable', autoUpdate: true },
    signature: { publisher: 'example', keyId: 'example-key-1' }
  };
}

function manifestHTML(c) {
  const text = JSON.stringify(manifest(c), null, 2);
  return `
  <div class="panel">
    <div class="panel-head"><b>body.json</b><button class="copy-btn" data-copy-manifest>复制 Manifest</button></div>
    <div class="panel-body"><pre class="manifest-pre">${esc(text)}</pre></div>
  </div>`;
}

const LIFE = [
  { n: '01', name: 'Package', desc: 'body.json + payload + blockmap + signature', gates: ['manifest', 'payload', 'blockmap'], state: 'done' },
  { n: '02', name: 'Verify', desc: '签名 / digest / 权限 / 依赖检查', gates: ['signature', 'digest', 'permissions'], state: 'done' },
  { n: '03', name: 'Install', desc: '写 BodyInstance + BodyInstallation', gates: ['install record', 'file hash'], state: 'done' },
  { n: '04', name: 'Activate', desc: '绑定 FlowInstance / SurfaceInstance / SettingValue', gates: ['bindings', 'health check', 'audit'], state: 'active' },
  { n: '05', name: 'Update', desc: 'migrations + 原子切换 + 回滚点', gates: ['migrations', 'atomic switch', 'rollback'], state: 'pending' },
  { n: '06', name: 'Rollback', desc: '回到上一个 packageDigest', gates: ['previous digest', 'health check'], state: 'pending' },
  { n: '07', name: 'Uninstall', desc: '只删体拥有的文件，保留用户数据', gates: ['hash match', 'keep user data'], state: 'pending' }
];

function lifecycleHTML(c) {
  return `
  <div class="panel">
    <div class="panel-head"><b>Body Lifecycle</b><span class="mono" style="font-size:8px;color:var(--faint)">active · ${digestOf(c)}</span></div>
    <div class="panel-body">
      <div class="life">
        ${LIFE.map(s => `<div class="life-step ${s.state}"><div class="life-num">${s.n}</div><div class="life-name">${s.name}</div><div class="life-desc">${s.desc}</div><div class="life-gates">${s.gates.map(g => `<span class="life-gate">${g}</span>`).join('')}</div></div>`).join('')}
      </div>
      <div class="pkg" style="margin-top:10px">
        <div class="pkg-head">
          <div><div class="pkg-kicker">Installation Record</div><div class="pkg-id">${esc(c.id)} <span>@${esc(c.version)}</span></div><div class="pkg-sub">source=file · channel=stable · status=active</div></div>
          <div class="pkg-badges"><span class="badge">verified</span><span class="badge">signed</span><span class="badge">active</span></div>
        </div>
        <div class="pkg-foot"><span>digest <b>${digestOf(c)}</b></span><span>rollback <b>none</b></span><span>lastVerified <b>2026-11-23</b></span><span>permissions <b>${c.perms.length}</b></span></div>
      </div>
    </div>
  </div>`;
}

function renderContent() {
  const c = selectedClass();
  if (state.tab === 'composition') $('#content').innerHTML = compositionHTML(c);
  else if (state.tab === 'instances') $('#content').innerHTML = instancesHTML(c);
  else if (state.tab === 'manifest') $('#content').innerHTML = manifestHTML(c);
  else $('#content').innerHTML = lifecycleHTML(c);
  bindContentEvents(c);
}

/* ============================================================
   3. Inspector
   ============================================================ */
function renderInspector() {
  const c = selectedClass();
  const ins = state.selInstance && state.selInstance.classId === c.id ? state.selInstance : null;
  if (ins) {
    $('#inspector').innerHTML = `
      <div class="insp-kicker">BodyInstance</div>
      <div class="insp-title">${esc(ins.label)}</div>
      <div class="insp-id">${esc(ins.id)}</div>
      <div class="insp-section"><div class="lh">Identity</div><div class="kv">
        <div class="k">class</div><div class="v">${esc(c.id)}@${esc(c.version)}</div>
        <div class="k">revision</div><div class="v">r${ins.rev}</div>
        <div class="k">status</div><div class="v" style="color:#86efac">${esc(ins.status)}</div>
        <div class="k">effect</div><div class="v">${esc(c.prio)}</div>
      </div></div>
      <div class="insp-section"><div class="lh">Activations</div><div class="chips">${ins.acts.map(a => `<span class="chip">${esc(a)}</span>`).join('')}</div></div>
      <div class="insp-section"><div class="lh">Settings</div><div class="mono" style="font-size:9px;color:#a9bbd0;line-height:1.6">${esc(ins.settings)}</div></div>
      <div class="insp-section"><div class="lh">Permissions</div><div class="chips">${c.perms.map(p => `<span class="chip perm">${esc(p)}</span>`).join('')}</div></div>
      <div class="insp-actions">
        <button class="insp-btn primary" data-launch="${esc(ins.id)}">▶ 启动实例</button>
        <button class="insp-btn" data-back-class>返回类</button>
      </div>
      <div class="insp-section" style="margin-top:8px"><div class="lh">Bindings</div><div class="mono" style="font-size:8.5px;color:var(--faint);line-height:1.7">flows: ${esc(c.flows.join(', '))}<br>surfaces: ${esc(c.surfaces.join(', '))}<br>points: ${esc(c.points.join(', '))}</div></div>`;
  } else {
    $('#inspector').innerHTML = `
      <div class="insp-kicker">BodyClass</div>
      <div class="insp-title">${esc(c.icon)} ${esc(c.name)}</div>
      <div class="insp-id">${esc(c.id)}@${esc(c.version)}</div>
      <div class="insp-section"><div class="lh">Class</div><div class="kv">
        <div class="k">category</div><div class="v" style="color:${CATS[c.cat].color}">${CATS[c.cat].label}</div>
        <div class="k">priority</div><div class="v">${esc(c.prio)}</div>
        <div class="k">instances</div><div class="v">${c.instances.length}</div>
        <div class="k">digest</div><div class="v mono">${digestOf(c)}</div>
      </div></div>
      <div class="insp-section"><div class="lh">Composition</div><div class="kv">
        <div class="k">surfaces</div><div class="v">${esc(c.surfaces.join(', '))}</div>
        <div class="k">flows</div><div class="v">${esc(c.flows.join(', '))}</div>
        <div class="k">points</div><div class="v">${esc(c.points.join(', '))}</div>
      </div></div>
      <div class="insp-section"><div class="lh">Permissions</div><div class="chips">${c.perms.map(p => `<span class="chip perm">${esc(p)}</span>`).join('')}</div></div>
      <div class="insp-section"><div class="lh">Tests</div><div class="chips">${c.tests.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>
      <div class="insp-actions">
        <button class="insp-btn primary" data-insp-tab="instances">查看实例</button>
        <button class="insp-btn" data-copy-manifest>复制 Manifest</button>
      </div>`;
  }
  bindInspectorEvents(c);
}

function bindContentEvents(c) {
  $$('#content [data-inst]').forEach(el => el.onclick = (e) => {
    if (e.target.closest('[data-start]')) return;
    const ins = c.instances.find(i => i.id === el.dataset.inst);
    if (ins) selectInstance(ins);
  });
  $$('#content [data-start]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const ins = c.instances.find(i => i.id === b.dataset.start);
    if (ins) launchInstance(ins);
  });
  $$('#content [data-copy-manifest]').forEach(b => b.onclick = () => copyText(JSON.stringify(manifest(c), null, 2), 'Manifest 已复制'));
}

function bindInspectorEvents(c) {
  $$('#inspector [data-insp-tab]').forEach(b => b.onclick = () => { state.tab = b.dataset.inspTab; renderTabs(); renderContent(); });
  $$('#inspector [data-copy-manifest]').forEach(b => b.onclick = () => copyText(JSON.stringify(manifest(c), null, 2), 'Manifest 已复制'));
  $$('#inspector [data-back-class]').forEach(b => b.onclick = () => { state.selInstance = null; renderContent(); renderInspector(); });
  $$('#inspector [data-launch]').forEach(b => b.onclick = () => {
    const ins = c.instances.find(i => i.id === b.dataset.launch);
    if (ins) launchInstance(ins);
  });
}

function selectClass(id) {
  state.selectedId = id;
  state.selInstance = null;
  state.tab = 'composition';
  renderList(); renderHero(); renderTabs(); renderContent(); renderInspector();
  $('#content').scrollTop = 0;
}

function selectInstance(ins) {
  state.selInstance = ins;
  state.tab = 'instances';
  renderTabs(); renderContent(); renderInspector();
  $('#content').scrollTop = 0;
}

/* ============================================================
   4. 运行与复制
   ============================================================ */
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function copyText(text, label) {
  const done = () => toast(label || '已复制');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  done();
}

function launchInstance(ins) {
  const bubble = $('#bubble');
  bubble.classList.add('show');
  $('#bubbleKind').textContent = 'BODY';
  $('#bubbleName').textContent = ins.id;
  $('#bubbleStatus').textContent = 'running';
  $('#bubbleSub').textContent = `BodyInstance · ${ins.classId} · ${ins.settings}`;
  $('#bubbleBar').style.width = '0%';
  $('#bubblePct').textContent = '0%';
  clearInterval(state.progressTimer);
  clearTimeout(state.bubbleTimer);
  let pct = 0;
  state.progressTimer = setInterval(() => {
    pct = Math.min(100, pct + Math.floor(Math.random() * 9) + 4);
    $('#bubbleBar').style.width = pct + '%';
    $('#bubblePct').textContent = pct + '%';
    if (pct >= 100) {
      clearInterval(state.progressTimer);
      $('#bubbleStatus').textContent = 'ok';
      $('#bubbleSub').textContent = `BodyRun complete · ${ins.acts.length} activations · audit recorded`;
      state.bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 1600);
      toast('BodyRun 完成，已写入运行记录');
    }
  }, 70);
}

/* ============================================================
   5. 初始化
   ============================================================ */
function init() {
  renderStats();
  renderFilters();
  renderList();
  renderHero();
  renderTabs();
  renderContent();
  renderInspector();

  $('#search').addEventListener('input', e => { state.query = e.target.value; renderList(); });
  $$('#prioRow [data-prio]').forEach(b => b.onclick = () => {
    state.prio = b.dataset.prio; renderFilters(); renderList();
  });
  $$('#tabs .tab').forEach(b => b.onclick = () => {
    state.tab = b.dataset.tab; renderTabs(); renderContent();
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('#search')) { e.preventDefault(); $('#search').focus(); }
    if (e.key === 'Escape') { state.query = ''; state.selInstance = null; $('#search').value = ''; renderList(); renderContent(); renderInspector(); }
  });
}

init();
})();

</script>
