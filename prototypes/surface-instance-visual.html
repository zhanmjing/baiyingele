<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>面层实例可视化 · 原子工坊</title>
<style>
:root{
  --bg:#070b14; --bg2:#0b1220; --panel:#0f172a; --panel2:#111c31; --panel3:#16233a;
  --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.24);
  --text:#e5edf8; --dim:#8fa2bb; --faint:#5f7188;
  --blue:#3b82f6; --cyan:#06b6d4; --violet:#8b5cf6; --amber:#f59e0b;
  --green:#22c55e; --red:#ef4444;
  --shadow:0 18px 50px rgba(0,0,0,.34);
  --radius:14px; --radius-sm:9px;
  --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
body.light{
  --bg:#f4f7fb; --bg2:#eaf0f7; --panel:#fff; --panel2:#f7fafc; --panel3:#eef4fb;
  --line:rgba(15,23,42,.10); --line2:rgba(15,23,42,.18);
  --text:#0f172a; --dim:#52637a; --faint:#7c8ba1;
  --shadow:0 18px 44px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;color:var(--text);font-family:var(--font);
  background:
    radial-gradient(900px 480px at 8% -8%, rgba(59,130,246,.16), transparent 60%),
    radial-gradient(760px 420px at 96% 0%, rgba(139,92,246,.12), transparent 62%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  transition:background .25s,color .2s;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
code,.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
.app{max-width:1680px;margin:0 auto;padding:16px 18px 32px}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:11px 14px;
  border:1px solid var(--line);border-radius:16px;background:rgba(10,16,28,.80);
  backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.16);margin-bottom:14px;
}
body.light .topbar{background:rgba(255,255,255,.84)}
.brand{display:flex;align-items:center;gap:11px;min-width:270px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 8px 20px rgba(6,182,212,.24)}
.brand-name{font-size:14px;font-weight:700}
.brand-sub{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:3px}
.search{flex:1;display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);min-width:170px}
.search span{color:var(--faint)}
.search input{width:100%;border:0;outline:0;background:transparent;font-size:12px}
.search input::placeholder{color:var(--faint)}
.icon-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--dim);font-size:16px}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 325px;gap:14px;align-items:start}
.panel{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:var(--shadow)}
.instance-list{padding:13px;position:sticky;top:80px;max-height:calc(100vh - 98px);overflow:auto}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--faint);font-size:10px;letter-spacing:.9px;text-transform:uppercase;margin:3px 0 9px}
.panel-head .n{font-family:var(--mono);font-size:10px;letter-spacing:0}
.group-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:12px 4px 5px;display:flex;align-items:center;gap:6px}
.group-label:before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c,var(--blue))}
.inst-row{width:100%;display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:8px;background:transparent;padding:7px 8px;margin-bottom:2px;text-align:left;color:var(--dim);font-size:11px}
.inst-row:hover{background:var(--panel3);color:var(--text)}
.inst-row.active{background:rgba(6,182,212,.10);border-color:rgba(6,182,212,.22);color:var(--text)}
.inst-row .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex:none}
.inst-row code{font-size:9px;color:var(--faint);margin-left:auto;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{padding:15px;min-height:700px}
.stage-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:13px}
.stage-head h1{font-size:21px;margin:5px 0 3px;line-height:1.2}
.stage-head code{font-size:10px;color:var(--faint);word-break:break-all}
.stage-head p{font-size:11px;line-height:1.6;color:var(--dim);margin:7px 0 0;max-width:680px}
.badges{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.badge{font-size:9px;padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--panel3);color:var(--dim);font-family:var(--mono);white-space:nowrap}
.badge.cyan{color:#67e8f9;border-color:rgba(6,182,212,.22);background:rgba(6,182,212,.08)}
.badge.green{color:#86efac;border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.08)}
.badge.amber{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.08)}
.stage-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.85fr);gap:12px;align-items:start}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden}
.card-label{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-family:var(--mono)}
.card-label .right{letter-spacing:0;text-transform:none;font-family:var(--font);color:var(--dim)}
.preview-wrap{padding:14px;min-height:360px;display:grid;place-items:center;background:
  radial-gradient(600px 240px at 50% 0%,rgba(59,130,246,.08),transparent 70%),
  linear-gradient(rgba(148,163,184,.04) 1px,transparent 1px),
  linear-gradient(90deg,rgba(148,163,184,.04) 1px,transparent 1px);
  background-size:24px 24px}
.preview{width:100%;max-width:620px}
.wire{border:1px solid var(--line2);border-radius:12px;background:var(--panel);box-shadow:0 20px 48px rgba(0,0,0,.28);overflow:hidden;color:var(--text)}
.wire-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.wire-kicker{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--cyan);font-family:var(--mono)}
.wire h3{font-size:15px;margin:4px 0 3px}
.wire p{font-size:11px;line-height:1.65;color:var(--dim);margin:5px 0 0}
.wire-body{padding:14px 16px}
.wire-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px;background:rgba(15,23,42,.35)}
body.light .wire-foot{background:#f8fafc}
.wire-btn{border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--dim);font-size:10px;padding:6px 10px}
.wire-btn.primary{border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.16);color:#93c5fd}
body.light .wire-btn.primary{color:#1d4ed8}
.wire-btn.danger{border-color:rgba(239,68,68,.30);color:#fca5a5;background:rgba(239,68,68,.08)}
.wire-btn:hover{filter:brightness(1.15)}
.dim{position:relative;padding:34px 14px;background:rgba(2,6,23,.52);border-radius:12px;display:grid;place-items:center}
body.light .dim{background:rgba(15,23,42,.08)}
.dialog-card{width:min(430px,100%)}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}
.form-row:last-child{border-bottom:0}
.form-label{color:var(--dim)}
.fake-input{min-width:150px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:5px 8px;font-size:10px;color:var(--faint);text-align:right}
.toggle{width:30px;height:17px;border-radius:99px;background:var(--panel3);position:relative;border:1px solid var(--line)}
.toggle:after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:var(--faint);top:2px;left:2px}
.toggle.on{background:rgba(34,197,94,.22);border-color:rgba(34,197,94,.35)}
.toggle.on:after{left:15px;background:var(--green)}
.site-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.site-card{border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--panel2);cursor:default}
.site-card:hover{border-color:var(--cyan)}
.site-card b{font-size:12px;display:block}
.site-card span{font-size:9px;color:var(--faint);display:block;margin-top:4px;font-family:var(--mono)}
.site-card .state{margin-top:9px;display:inline-block;font-size:8px;padding:2px 5px;border-radius:4px;background:rgba(34,197,94,.10);color:#86efac;border:1px solid rgba(34,197,94,.18)}
.table-wire{width:100%;border-collapse:collapse;font-size:10px}
.table-wire th{text-align:left;color:var(--faint);font-size:8px;letter-spacing:.6px;text-transform:uppercase;padding:6px 5px;border-bottom:1px solid var(--line)}
.table-wire td{padding:7px 5px;border-bottom:1px solid var(--line);color:var(--dim)}
.table-wire tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:8px;padding:2px 5px;border-radius:4px;border:1px solid var(--line);background:var(--panel3);color:var(--dim);font-family:var(--mono)}
.pill.ok{color:#86efac;border-color:rgba(34,197,94,.18);background:rgba(34,197,94,.08)}
.pill.warn{color:#fcd34d;border-color:rgba(245,158,11,.18);background:rgba(245,158,11,.08)}
.pill.err{color:#fca5a5;border-color:rgba(239,68,68,.18);background:rgba(239,68,68,.08)}
.toast-wire{border:1px solid var(--line2);border-radius:10px;background:var(--panel);box-shadow:0 14px 34px rgba(0,0,0,.3);padding:12px;max-width:340px;margin-left:auto}
.toast-wire .bar{height:3px;border-radius:99px;background:linear-gradient(90deg,var(--amber),var(--red));margin-bottom:9px}
.toast-wire b{font-size:12px}
.toast-wire p{font-size:10px;color:var(--dim);line-height:1.6;margin:5px 0 8px}
.toast-actions{display:flex;gap:5px;flex-wrap:wrap}
.palette-wire{max-width:440px;margin:0 auto}
.palette-input{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:9px 10px;font-size:11px;color:var(--faint)}
.palette-list{margin-top:6px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.palette-item{padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px;display:flex;gap:8px;align-items:center}
.palette-item:last-child{border-bottom:0}
.palette-item code{margin-left:auto;font-size:8px;color:var(--faint)}
.run-wire{display:flex;flex-direction:column;gap:5px}
.run-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:10px;background:var(--panel2)}
.run-row b{font-size:10px}.run-row code{margin-left:auto;font-size:8px;color:var(--faint)}
.canvas-wire{position:relative;min-height:210px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden}
.canvas-node{position:absolute;border:1px solid var(--line2);border-radius:6px;background:var(--panel);padding:7px 9px;font-size:9px;color:var(--dim);box-shadow:0 6px 16px rgba(0,0,0,.16)}
.canvas-node b{display:block;color:var(--text);font-size:10px}
.canvas-node:after{content:"";position:absolute;left:100%;top:50%;width:48px;height:1px;background:rgba(139,92,246,.45)}
.canvas-node.last:after{display:none}
.wizard-wire .steps{display:flex;gap:6px;margin-bottom:13px}
.step{flex:1;height:24px;border-radius:6px;background:var(--panel3);border:1px solid var(--line);display:grid;place-items:center;font-size:8px;color:var(--faint)}
.step.active{background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.28);color:#93c5fd}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--panel2)}
.metric span{font-size:8px;color:var(--faint);font-family:var(--mono)}
.metric b{display:block;font-size:18px;margin-top:5px}
.bar{height:6px;border-radius:99px;background:var(--panel3);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.diff-side{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:8px;font-family:var(--mono);font-size:8px;line-height:1.8;color:var(--dim)}
.diff-side .add{color:#86efac}.diff-side .del{color:#fca5a5}
.tray-wire{width:220px;margin-left:auto;border:1px solid var(--line2);border-radius:9px;background:var(--panel);padding:5px;box-shadow:0 14px 30px rgba(0,0,0,.30)}
.tray-item{padding:7px 8px;border-radius:5px;font-size:10px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.tray-item:hover{background:var(--panel3);color:var(--text)}
.tray-sep{height:1px;background:var(--line);margin:4px 2px}
.hud-wire{width:260px;margin:30px auto;border:1px solid rgba(6,182,212,.35);border-radius:10px;background:rgba(8,47,73,.72);backdrop-filter:blur(12px);padding:12px;box-shadow:0 16px 34px rgba(0,0,0,.3)}
body.light .hud-wire{background:rgba(236,254,255,.9)}
.hud-wire b{font-size:12px}.hud-wire p{font-size:10px;color:var(--dim);margin:5px 0}
.tree-wire{font-size:10px;font-family:var(--mono);line-height:2;color:var(--dim)}
.tree-wire .l1{color:var(--text)}.tree-wire .l2{padding-left:14px}.tree-wire .l3{padding-left:28px;color:var(--faint)}
.generic-wire{border:1px dashed var(--line2);border-radius:10px;padding:14px;background:var(--panel2)}
.generic-wire .region{border:1px dashed var(--line);border-radius:6px;padding:8px;margin-bottom:6px;font-size:9px;color:var(--faint);font-family:var(--mono)}
.state-strip{display:flex;flex-wrap:wrap;gap:5px;padding:9px 10px;border-top:1px solid var(--line)}
.state-btn{border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--faint);font-size:9px;padding:3px 6px;font-family:var(--mono)}
.state-btn.active{color:#93c5fd;border-color:rgba(59,130,246,.28);background:rgba(59,130,246,.12)}
.binding-wrap{padding:11px}
.bind-section{margin-bottom:12px}
.bind-section h4{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:0 0 6px;display:flex;justify-content:space-between}
.bind-section h4 .n{font-family:var(--mono);font-size:9px}
.bind-row{display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,.9fr);gap:4px;align-items:center;margin-bottom:4px;font-size:9px}
.bind-row code{font-family:var(--mono);font-size:8px;color:var(--dim);background:var(--panel3);border:1px solid var(--line);border-radius:4px;padding:4px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bind-row code.slot{color:#93c5fd;border-color:rgba(59,130,246,.18);background:rgba(59,130,246,.07)}
.bind-arrow{text-align:center;color:var(--faint);font-size:11px}
.placement-map{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;padding:11px}
.monitor{border:1px solid var(--line2);border-radius:10px;background:var(--panel3);padding:9px;min-height:150px;position:relative}
.monitor:before{content:"";position:absolute;left:50%;bottom:-6px;width:34px;height:6px;border-radius:0 0 4px 4px;background:var(--line2);transform:translateX(-50%)}
.zone{position:absolute;border:1px dashed var(--line2);border-radius:5px;font-size:8px;color:var(--faint);display:grid;place-items:center;font-family:var(--mono)}
.zone.main{left:28%;top:16%;width:44%;height:62%}
.zone.sidebar{right:3%;top:16%;width:20%;height:62%}
.zone.settings{left:28%;top:16%;width:44%;height:62%}
.zone.modal{left:34%;top:25%;width:32%;height:40%}
.zone.toast{right:4%;bottom:7%;width:24%;height:13%}
.zone.tray{right:4%;bottom:7%;width:18%;height:10%}
.zone.overlay{left:32%;top:6%;width:36%;height:16%}
.zone.hotkey{left:7%;bottom:7%;width:22%;height:13%}
body.light .zone{background:rgba(59,130,246,.035)}
.zone.active{border-color:var(--cyan);background:rgba(6,182,212,.10);color:#67e8f9}
.place-meta{display:flex;flex-direction:column;gap:7px;font-size:10px;color:var(--dim)}
.place-meta .kv{display:grid;grid-template-columns:70px 1fr;gap:5px}
.place-meta .k{color:var(--faint)}
.inspector{padding:14px;position:sticky;top:80px;max-height:calc(100vh - 98px);overflow:auto}
.insp-head h2{font-size:17px;margin:5px 0 2px}
.insp-head code{font-size:9px;color:var(--faint);word-break:break-all}
.insp-head p{font-size:10px;line-height:1.65;color:var(--dim);margin:7px 0 0}
.insp-section{margin-top:14px}
.insp-section h4{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:0 0 6px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:9px;padding:3px 5px;border-radius:4px;border:1px solid var(--line);background:var(--panel3);color:var(--dim);font-family:var(--mono)}
.chip.state{color:#93c5fd;border-color:rgba(59,130,246,.18);background:rgba(59,130,246,.07)}
.chip.action{color:#86efac;border-color:rgba(34,197,94,.16);background:rgba(34,197,94,.06)}
.bind-table{width:100%;border-collapse:collapse;font-size:9px}
.bind-table th{text-align:left;color:var(--faint);font-weight:500;padding:4px;border-bottom:1px solid var(--line);font-size:8px;text-transform:uppercase;letter-spacing:.5px}
.bind-table td{padding:4px;border-bottom:1px solid var(--line);color:var(--dim);vertical-align:top}
.bind-table td.mono{font-family:var(--mono);font-size:8px;word-break:break-all}
.json{max-height:210px;overflow:auto;margin:0;padding:8px;border:1px solid var(--line);border-radius:7px;background:#060b13;color:#a9c5e8;font-family:var(--mono);font-size:8px;line-height:1.6;white-space:pre}
body.light .json{background:#f1f5f9;color:#334155}
.chain{display:flex;flex-direction:column;gap:5px;font-size:9px}
.chain-step{border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:var(--panel2);display:flex;gap:7px;align-items:flex-start}
.chain-step .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-top:3px;flex:none}
.chain-step b{display:block;font-size:9px;color:var(--text)}
.chain-step code{font-size:8px;color:var(--faint);display:block;margin-top:2px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#0b1220;border:1px solid var(--line2);color:#dbeafe;padding:9px 13px;border-radius:9px;font-size:11px;box-shadow:0 14px 30px rgba(0,0,0,.35);transition:.2s;z-index:80}
body.light .toast{background:#fff;color:#0f172a}
.toast.show{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--faint)}
.empty{padding:30px 12px;text-align:center;color:var(--faint);font-size:11px}
@media(max-width:1250px){.layout{grid-template-columns:225px minmax(0,1fr) 290px}.stage-grid{grid-template-columns:1fr}}
@media(max-width:1040px){.layout{grid-template-columns:1fr}.instance-list,.inspector{position:static;max-height:none}.instance-list{display:grid;grid-template-columns:1fr 1fr;gap:4px}.instance-list .panel-head,.instance-list .group-label{grid-column:1/-1}}
@media(max-width:700px){.app{padding:10px}.topbar{flex-wrap:wrap}.brand{min-width:0;flex:1}.search{order:3;flex-basis:100%}.stage-head{flex-direction:column}.badges{justify-content:flex-start}.site-grid,.diff-grid,.metric-grid{grid-template-columns:1fr}.placement-map{grid-template-columns:1fr}.instance-list{grid-template-columns:1fr}}
</style>
</head>
<style>
.bind-row[data-bind-index],.bind-table tr[data-bind-index]{cursor:pointer;border-radius:5px}
.bind-row[data-bind-index]:hover{background:rgba(59,130,246,.10);outline:1px solid rgba(59,130,246,.22)}
.bind-table tr[data-bind-index]:hover{background:rgba(59,130,246,.08)}
.bind-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.bind-toolbar span{font-size:9px;color:var(--faint)}
.undo-btn{border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--dim);font-size:9px;padding:4px 7px}
.undo-btn:hover{color:var(--text);border-color:var(--line2)}
.picker-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;background:rgba(2,6,23,.66);backdrop-filter:blur(8px)}
body.light .picker-backdrop{background:rgba(15,23,42,.30)}
.picker-backdrop.hidden{display:none}
.picker{width:min(640px,100%);max-height:min(78vh,760px);display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:14px;background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.picker-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 15px 10px;border-bottom:1px solid var(--line)}
.picker-head h2{font-size:17px;margin:4px 0 3px}
.picker-head p{font-size:10px;color:var(--dim);line-height:1.6;margin:0;font-family:var(--mono)}
.picker-search{display:flex;align-items:center;gap:8px;margin:10px 15px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.picker-search span{color:var(--faint)}
.picker-search input{flex:1;border:0;outline:0;background:transparent;font-size:11px}
.picker-list{overflow:auto;padding:10px 15px 14px;flex:1}
.cand-group{margin:10px 0 5px}
.cand-group h4{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:0 0 5px;display:flex;justify-content:space-between}
.cand{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);margin-bottom:4px;cursor:pointer}
.cand:hover{border-color:var(--cyan);background:rgba(6,182,212,.06)}
.cand.current{border-color:rgba(34,197,94,.30);background:rgba(34,197,94,.06)}
.cand .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-top:5px;flex:none}
.cand b{display:block;font-size:10px;color:var(--text);font-weight:600}
.cand code{display:block;font-family:var(--mono);font-size:8px;color:var(--faint);margin-top:2px;word-break:break-all}
.cand .tag{margin-left:auto;font-family:var(--mono);font-size:8px;color:#67e8f9;border:1px solid rgba(6,182,212,.18);background:rgba(6,182,212,.07);border-radius:4px;padding:2px 5px;white-space:nowrap}
.picker-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 15px;border-top:1px solid var(--line);background:rgba(15,23,42,.35)}
body.light .picker-foot{background:#f8fafc}
.picker-foot span{font-size:9px;color:var(--faint)}
</style>
<style>
.metric-card-preview{border:1px solid var(--line2);border-radius:11px;background:var(--panel);padding:14px;box-shadow:0 14px 34px rgba(0,0,0,.22);max-width:420px;margin:0 auto}
.mc-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mc-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-family:var(--mono)}
.mc-id{font-size:8px;color:var(--faint);margin-top:3px;font-family:var(--mono)}
.mc-value{font-size:34px;line-height:1.05;font-weight:800;margin:10px 0 3px;letter-spacing:-1px}
.mc-value small{font-size:12px;font-weight:500;color:var(--dim);margin-left:4px;letter-spacing:0}
.mc-sub{font-size:10px;color:var(--dim);line-height:1.6}
.mc-spark{width:100%;height:48px;margin:9px 0 4px;display:block}
.mc-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin-top:9px;padding-top:8px;font-size:8px;color:var(--faint);font-family:var(--mono)}
.sys-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sys-tile{border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:10px}
.sys-tile .k{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-family:var(--mono)}
.sys-tile .v{font-size:23px;font-weight:800;margin:5px 0 2px;letter-spacing:-.5px}
.sys-tile .s{font-size:8px;color:var(--dim);font-family:var(--mono)}
.sys-tile .bar{margin-top:7px}
.hud-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.hud-item{border:1px solid rgba(6,182,212,.18);border-radius:6px;padding:6px;background:rgba(6,182,212,.05)}
.hud-item .k{font-size:7px;color:#67e8f9;letter-spacing:.8px;font-family:var(--mono)}
.hud-item .v{font-size:14px;font-weight:700;margin-top:3px}
.hud-item .s{font-size:7px;color:var(--dim);margin-top:2px}
.sys-note{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:9px;color:var(--faint);font-family:var(--mono)}
.sys-live{display:inline-flex;align-items:center;gap:5px;color:#86efac}
.sys-live:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.10)}
</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <div class="brand-name">面层实例可视化</div>
        <div class="brand-sub">SurfaceInstance × SurfaceClass × Bindings</div>
      </div>
    </div>
    <div class="search">
      <span>⌕</span>
      <input id="search" autocomplete="off" placeholder="搜索实例 / 类 / 绑定目标…（/ 聚焦）">
    </div>
    <button class="icon-btn" id="themeBtn" title="切换主题">☾</button>
  </header>

  <div class="layout">
    <aside class="panel instance-list">
      <div class="panel-head"><span>SurfaceInstance</span><span class="n" id="instCount"></span></div>
      <div id="instanceList"></div>
    </aside>

    <main class="panel stage">
      <div class="stage-head">
        <div>
          <div class="kicker" id="stageKicker">SURFACEINSTANCE</div>
          <h1 id="instName">—</h1>
          <code id="instId">—</code>
          <p id="instDesc">—</p>
        </div>
        <div class="badges" id="instBadges"></div>
      </div>

      <div class="stage-grid">
        <section class="card">
          <div class="card-label"><span>LIVE WIREFRAME</span><span class="right" id="placementLabel">—</span></div>
          <div class="preview-wrap"><div class="preview" id="preview"></div></div>
          <div class="state-strip" id="stateStrip"></div>
        </section>

        <section class="card">
          <div class="card-label"><span>BINDINGS</span><span class="right" id="bindingCount">—</span></div>
          <div class="binding-wrap" id="bindingMap"></div>
        </section>
      </div>

      <section class="card" style="margin-top:12px">
        <div class="card-label"><span>PLACEMENT</span><span class="right" id="placementMeta">—</span></div>
        <div class="placement-map">
          <div class="monitor" id="monitor"></div>
          <div class="place-meta" id="placeMeta"></div>
        </div>
      </section>
    </main>

    <aside class="panel inspector" id="inspector"></aside>
  </div>
</div>
<div class="picker-backdrop" id="picker">
  <div class="picker">
    <div class="picker-head">
      <div>
        <div class="wire-kicker" id="pickerKicker">CHANGE BINDING</div>
        <h2 id="pickerTitle">更换绑定</h2>
        <p id="pickerSub">—</p>
      </div>
      <button class="icon-btn" id="pickerClose" title="关闭">✕</button>
    </div>
    <div class="picker-search"><span>⌕</span><input id="pickerSearch" autocomplete="off" placeholder="搜索 target / kind / 说明…"></div>
    <div class="picker-list" id="pickerList"></div>
    <div class="picker-foot"><span>选择后立即生成新的 SurfaceInstance revision</span><button class="wire-btn" id="pickerCancel">取消</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

function renderInstanceList(){
  const q=state.query.trim().toLowerCase();
  const groups=[];
  DATA.classes.forEach(c=>{
    const list=c.instances.filter(i=>!q || [i.id,i.name,i.desc,c.id,c.name,...(i.dataBindings||[]).flatMap(b=>[b.slot,b.kind,b.target]),...(i.actionBindings||[]).flatMap(b=>[b.slot,b.kind,b.target])].join(' ').toLowerCase().includes(q));
    if(list.length) groups.push({c,list});
  });
  $('#instCount').textContent=`${groups.reduce((n,g)=>n+g.list.length,0)} / ${ALL.length}`;
  $('#instanceList').innerHTML=groups.length?groups.map(g=>`
    <div class="group-label" style="--c:${familyColor(g.c.family)}">${esc(g.c.icon)} ${esc(g.c.name)}</div>
    ${g.list.map(i=>`<button class="inst-row ${i.id===state.instanceId?'active':''}" data-inst="${esc(i.id)}"><span class="dot"></span><span>${esc(i.name)}</span><code>${esc(i.id)}</code></button>`).join('')}
  `).join(''):`<div class="empty">没有匹配的实例</div>`;
  $$('#instanceList [data-inst]').forEach(b=>b.onclick=()=>setInstance(b.dataset.inst));

function statePill(){
  const cls=state.uiState==='error'?'err':state.uiState==='waiting'?'warn':state.uiState==='ready'||state.uiState==='visible'?'ok':'';
  return `<span class="pill ${cls}">${esc(state.uiState)}</span>`;
}

function actionButtons(i,preferred=[]){
  let binds=i.actionBindings.filter(b=>preferred.includes(b.slot));
  if(!binds.length) binds=i.actionBindings.filter(b=>b.slot!=='cancel').slice(0,3);
  return binds.map((b,idx)=>{
    let label=ACTION_LABELS[b.slot]||b.slot;
    if(b.slot==='approve'){
      if(i.id.includes('delete')) label='确认删除';
      else if(i.id.includes('deploy')) label='确认部署';
      else if(i.id.includes('vpn')) label='打开 VPN';
    }
    if(b.slot==='reject'&&i.id.includes('vpn')) label='取消';
    if(b.slot==='test'&&i.id.includes('vpn')) label='测试 VPN';
    const tone=idx===0?'primary':(b.slot==='reject'||b.slot==='cancel'?'danger':'');
    return `<button class="wire-btn ${tone}" data-action="${esc(b.slot)}" data-target="${esc(b.target)}">${esc(label)}</button>`;
  }).join('');
}

function wireHead(kicker,title,desc){
  return `<div class="wire-head"><div><div class="wire-kicker">${esc(kicker)}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p></div>${statePill()}</div>`;
}

  const fields=(i.dataBindings||[]).slice(0,6);

    }

function sparkline(points,color='#06b6d4'){
  const w=320,h=44,min=Math.min(...points),max=Math.max(...points),span=Math.max(1,max-min);
  const pts=points.map((v,i)=>`${(i/(points.length-1))*w},${h-((v-min)/span)*(h-6)-3}`).join(' ');
  return `<svg class="mc-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="0,${h} ${pts} ${w},${h}" fill="${color}" opacity=".08" stroke="none"/></svg>`;
}

function closePicker(){
  state.picker=null;
  const el=$('#picker'); if(el) el.classList.add('hidden');
}
function pickerCandidates(){
  const p=state.picker; if(!p) return [];
  const items=[...CANDIDATES[p.type]];
  const i=current(); const b=(p.type==='data'?i.dataBindings:i.actionBindings)[p.index];
  if(b && !items.some(c=>c.kind===b.kind&&c.target===b.target)) items.unshift({kind:b.kind,target:b.target,label:'当前绑定'});
  const q=(p.query||'').trim().toLowerCase();
  return items.filter(c=>!q || [c.kind,c.target,c.label].join(' ').toLowerCase().includes(q));
}
function renderPickerList(){
  const p=state.picker; if(!p) return;
  const items=pickerCandidates();
  const groups={};
  items.forEach(c=>{(groups[c.kind]??=[]).push(c);});
  const i=current(); const cur=(p.type==='data'?i.dataBindings:i.actionBindings)[p.index];
  $('#pickerList').innerHTML=items.length?Object.entries(groups).map(([kind,list])=>`<div class="cand-group"><h4><span>${esc(KIND_LABELS[kind]||kind)}</span><span class="n">${list.length}</span></h4>${list.map(c=>`<div class="cand ${cur&&cur.kind===c.kind&&cur.target===c.target?'current':''}" data-cand-kind="${esc(c.kind)}" data-cand-target="${esc(c.target)}"><span class="dot"></span><div style="min-width:0"><b>${esc(c.label||c.target)}</b><code>${esc(c.target)}</code></div><span class="tag">${esc(c.kind)}</span></div>`).join('')}</div>`).join(''):`<div class="empty">没有匹配的候选 target</div>`;
  $$('#pickerList [data-cand-target]').forEach(el=>el.onclick=()=>applyCandidate(el.dataset.candKind,el.dataset.candTarget));
}
function applyCandidate(kind,target){
  const p=state.picker; if(!p) return;
  const i=current(); const arr=p.type==='data'?i.dataBindings:i.actionBindings; const b=arr[p.index];
  if(!b) return;
  const old={kind:b.kind,target:b.target,slot:b.slot}; const oldRev=i.revision;
  b.kind=kind; b.target=target; i.revision+=1; i._edited=true; i._history=i._history||[];
  i._history.push({type:p.type,slot:b.slot,old,new:{kind:b.kind,target:b.target},oldRev,newRev:i.revision});
  const msg=`${b.slot}: ${old.kind} → ${kind} · ${target} · r${i.revision}`;
  closePicker(); renderAll(); toast(msg);
}
function undoLast(){
  const i=current(); const h=(i._history||[]).pop();
  if(!h){toast('没有可撤销的变更');return;}
  const arr=h.type==='data'?i.dataBindings:i.actionBindings; const b=arr.find(x=>x.slot===h.slot);
  if(b){b.kind=h.old.kind;b.target=h.old.target;}
  i.revision=Math.max(1,h.oldRev);
  if(!(i._history||[]).length) i._edited=false;
  renderAll(); toast(`已撤销 ${h.slot} · 回到 r${i.revision}`);
}

function renderAll(){
  const i=current();
  renderInstanceList();renderHeader(i);renderPreview(i);renderStateStrip(i);renderBindings(i);renderPlacement(i);renderInspector(i);
}

function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>t.classList.remove('show'),1700);
}

function initTheme(){
  let saved=null;try{saved=localStorage.getItem('surface-instance-theme');}catch(e){}
  if(saved==='light')document.body.classList.add('light');
  updateThemeBtn();
  $('#themeBtn').onclick=()=>{
    document.body.classList.toggle('light');
    try{localStorage.setItem('surface-instance-theme',document.body.classList.contains('light')?'light':'dark');}catch(e){}
    updateThemeBtn();
    toast(document.body.classList.contains('light')?'已切换浅色主题':'已切换深色主题');
  };
}
function updateThemeBtn(){$('#themeBtn').textContent=document.body.classList.contains('light')?'☀':'☾';}

function init(){
  initTheme();$('#picker').classList.add('hidden');renderAll();
  $('#search').oninput=(e)=>{state.query=e.target.value;renderInstanceList();};
  $('#bindingMap').onclick=(e)=>{
    if(e.target.closest('#undoBtn')) return;
    const row=e.target.closest('[data-bind-index]');
    if(row) openPicker(row.dataset.bindType,Number(row.dataset.bindIndex));
  };
  $('#inspector').onclick=(e)=>{
    const row=e.target.closest('[data-bind-index]');
    if(row) openPicker(row.dataset.bindType,Number(row.dataset.bindIndex));
  };
  $('#pickerClose').onclick=closePicker;
  $('#pickerCancel').onclick=closePicker;
  $('#picker').onclick=(e)=>{if(e.target===$('#picker')) closePicker();};
  $('#pickerSearch').oninput=(e)=>{if(state.picker){state.picker.query=e.target.value;renderPickerList();}};
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'&&state.picker){closePicker();return;}
    if(e.key==='/'&&document.activeElement!==$('#search')){e.preventDefault();$('#search').focus();}
    if(e.key==='Escape'&&document.activeElement===$('#search')){state.query='';$('#search').value='';$('#search').blur();renderInstanceList();}
  });
}
document.addEventListener('DOMContentLoaded',init);

</script>
</body>
</html>
