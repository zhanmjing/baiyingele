<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>快速启动 · 点/线实例可视化</title>
<style>
:root{
  --bg:#070b14; --bg2:#0b1220; --panel:#0f172a; --panel2:#111c31; --panel3:#16233a;
  --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.24);
  --text:#e5edf8; --dim:#8fa2bb; --faint:#5f7188;
  --blue:#3b82f6; --cyan:#06b6d4; --violet:#8b5cf6; --amber:#f59e0b;
  --green:#22c55e; --red:#ef4444; --pink:#ec4899;
  --shadow:0 24px 70px rgba(0,0,0,.45);
  --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
body.light{
  --bg:#f4f7fb; --bg2:#eaf0f7; --panel:#fff; --panel2:#f7fafc; --panel3:#eef4fb;
  --line:rgba(15,23,42,.10); --line2:rgba(15,23,42,.18);
  --text:#0f172a; --dim:#52637a; --faint:#7c8ba1;
  --shadow:0 24px 60px rgba(15,23,42,.18);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;color:var(--text);font-family:var(--font);
  background:
    radial-gradient(900px 480px at 10% -10%,rgba(59,130,246,.18),transparent 60%),
    radial-gradient(800px 460px at 92% 4%,rgba(139,92,246,.14),transparent 62%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  min-height:100vh;display:grid;place-items:center;padding:22px;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
code,.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

.shell{width:min(1180px,100%);height:min(760px,calc(100vh - 44px));display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:18px;background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:var(--shadow);overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);background:rgba(10,16,28,.55)}
body.light .topbar{background:rgba(255,255,255,.65)}
.brand{display:flex;align-items:center;gap:10px;min-width:220px}
.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 8px 20px rgba(6,182,212,.22);font-size:15px}
.brand b{font-size:13px}
.brand span{display:block;font-size:10px;color:var(--faint);font-family:var(--mono);margin-top:2px}
.hint{flex:1;text-align:center;font-size:10px;color:var(--faint);font-family:var(--mono)}
.hint kbd{border:1px solid var(--line2);border-radius:4px;padding:2px 5px;background:var(--panel3);font-size:9px}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--dim)}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}

.launcher{flex:1;display:grid;grid-template-columns:1.15fr .85fr;min-height:0}
.left{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.search-wrap{padding:13px 14px 9px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:9px 11px}
.search span{color:var(--faint)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:12px}
.search input::placeholder{color:var(--faint)}
.tabs{display:flex;gap:4px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:1px solid transparent;border-radius:7px;background:transparent;color:var(--faint);font-size:10px;padding:5px 8px}
.tab:hover{color:var(--text);background:var(--panel3)}
.tab.active{color:#93c5fd;border-color:rgba(59,130,246,.22);background:rgba(59,130,246,.10)}
.list{overflow:auto;padding:7px 8px 10px;min-height:0}
.group-label{font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);margin:10px 6px 5px;font-family:var(--mono)}
.item{width:100%;display:flex;align-items:flex-start;gap:9px;padding:9px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left;margin-bottom:2px}
.item:hover{background:var(--panel3);border-color:var(--line)}
.item.active{background:rgba(6,182,212,.08);border-color:rgba(6,182,212,.24)}
.kind{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:8px;font-weight:700;letter-spacing:.4px;flex:none;font-family:var(--mono)}
.kind.point{color:#67e8f9;background:rgba(6,182,212,.10);border:1px solid rgba(6,182,212,.20)}
.kind.flow{color:#c4b5fd;background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.20)}
.item-main{min-width:0;flex:1}
.item-title{display:flex;align-items:center;gap:6px}
.item-title b{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-title .eff{font-size:7px;padding:2px 4px;border-radius:3px;border:1px solid var(--line);color:var(--faint);font-family:var(--mono);flex:none}
.item-sub{font-size:9px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.item-meta{display:flex;gap:6px;align-items:center;margin-top:4px}
.item-meta span{font-size:8px;color:var(--faint);font-family:var(--mono)}
.star{border:0;background:transparent;color:var(--faint);font-size:13px;line-height:1;padding:2px}
.star.on{color:var(--amber)}
.empty{padding:36px 12px;text-align:center;color:var(--faint);font-size:11px}

.right{display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,rgba(15,23,42,.35),transparent)}
body.light .right{background:linear-gradient(180deg,rgba(248,250,252,.8),transparent)}
.preview{flex:1;overflow:auto;padding:17px}
.preview-kicker{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-family:var(--mono)}
.preview h2{font-size:20px;margin:6px 0 3px;line-height:1.25}
.preview .id{font-size:10px;color:var(--faint);font-family:var(--mono);word-break:break-all}
.preview .desc{font-size:11px;line-height:1.65;color:var(--dim);margin:9px 0 0}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.badge{font-size:8px;padding:3px 6px;border-radius:4px;border:1px solid var(--line);background:var(--panel3);color:var(--dim);font-family:var(--mono)}
.badge.point{color:#67e8f9;border-color:rgba(6,182,212,.20);background:rgba(6,182,212,.07)}
.badge.flow{color:#c4b5fd;border-color:rgba(139,92,246,.20);background:rgba(139,92,246,.07)}
.badge.green{color:#86efac;border-color:rgba(34,197,94,.18);background:rgba(34,197,94,.06)}
.section{margin-top:16px}
.section h4{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:0 0 7px;display:flex;justify-content:space-between}
.kv{display:grid;grid-template-columns:86px 1fr;gap:5px 8px;font-size:10px;line-height:1.55}
.kv .k{color:var(--faint)}
.kv .v{color:var(--dim);word-break:break-word}
.kv .v code{color:var(--text);font-size:9px}
.slot-list{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:9px;padding:3px 6px;border-radius:4px;border:1px solid var(--line);background:var(--panel3);color:var(--dim);font-family:var(--mono)}
.chip.ok{color:#86efac;border-color:rgba(34,197,94,.18);background:rgba(34,197,94,.06)}
.params{display:flex;flex-direction:column;gap:4px}
.param{display:flex;justify-content:space-between;gap:8px;padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font-size:9px}
.param .k{color:var(--faint);font-family:var(--mono)}
.param .v{color:var(--dim);font-family:var(--mono);text-align:right;word-break:break-all}
.footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:7px;align-items:center;background:rgba(15,23,42,.45)}
body.light .footer{background:#f8fafc}
.btn{border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--dim);font-size:10px;padding:7px 10px}
.btn:hover{color:var(--text);border-color:var(--line2)}
.btn.primary{border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.16);color:#93c5fd;font-weight:600}
body.light .btn.primary{color:#1d4ed8}
.btn.primary:hover{background:rgba(59,130,246,.24)}
.btn.danger{border-color:rgba(239,68,68,.28);color:#fca5a5;background:rgba(239,68,68,.08)}
.spacer{flex:1}

.run-console{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:22px;background:rgba(2,6,23,.68);backdrop-filter:blur(9px)}
body.light .run-console{background:rgba(15,23,42,.30)}
.run-console.hidden{display:none}
.console{width:min(760px,100%);max-height:min(82vh,760px);display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:0 30px 90px rgba(0,0,0,.5);overflow:hidden}
.console-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.console-head h3{font-size:17px;margin:4px 0 3px}
.console-head .sub{font-size:9px;color:var(--faint);font-family:var(--mono)}
.console-body{padding:16px;overflow:auto;flex:1}
.status-row{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 rgba(6,182,212,.35);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(6,182,212,.35)}70%{box-shadow:0 0 0 9px rgba(6,182,212,0)}100%{box-shadow:0 0 0 0 rgba(6,182,212,0)}}
.status-text{font-size:11px;color:var(--dim)}
.progress{height:7px;border-radius:99px;background:var(--panel3);overflow:hidden;margin:10px 0 14px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:99px;transition:width .28s ease}
.flow-map{position:relative;display:flex;align-items:center;gap:0;padding:18px 4px 12px;overflow:auto}
.flow-node{min-width:110px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:9px;text-align:center;font-size:9px;color:var(--faint);transition:.2s;position:relative;flex:none}
.flow-node b{display:block;font-size:10px;color:var(--dim);margin-bottom:3px}
.flow-node.running{border-color:var(--cyan);color:#67e8f9;box-shadow:0 0 0 1px rgba(6,182,212,.25),0 0 24px rgba(6,182,212,.12);transform:translateY(-2px)}
.flow-node.ok{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.06)}
.flow-node.ok b{color:#86efac}
.flow-node.failed{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.06)}
.flow-node.failed b{color:#fca5a5}
.flow-arrow{width:26px;height:1px;background:var(--line2);flex:none;position:relative}
.flow-arrow:after{content:"";position:absolute;right:0;top:-2px;border-left:5px solid var(--line2);border-top:3px solid transparent;border-bottom:3px solid transparent}
.point-run{display:grid;place-items:center;padding:22px 0 10px}
.ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cyan) var(--p,0%),var(--panel3) 0);position:relative}
.ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
.ring b{position:relative;z-index:1;font-size:21px}
.ring small{position:relative;z-index:1;font-size:8px;color:var(--faint);display:block;text-align:center}
.logs{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:#060b13;padding:9px;max-height:150px;overflow:auto;font-family:var(--mono);font-size:9px;line-height:1.8;color:#a9c5e8}
body.light .logs{background:#f1f5f9;color:#334155}
.log-line{display:flex;gap:7px}
.log-line .t{color:var(--faint);flex:none}
.log-line.ok .m{color:#86efac}
.log-line.err .m{color:#fca5a5}
.console-foot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:7px;align-items:center;background:rgba(15,23,42,.45)}
body.light .console-foot{background:#f8fafc}
.result{margin-top:10px;border:1px solid rgba(34,197,94,.22);border-radius:8px;background:rgba(34,197,94,.06);padding:9px;font-size:10px;color:#86efac;display:none}
.result.show{display:block}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#0b1220;border:1px solid var(--line2);color:#dbeafe;padding:9px 13px;border-radius:9px;font-size:11px;box-shadow:0 14px 30px rgba(0,0,0,.35);transition:.2s;z-index:90}
body.light .toast{background:#fff;color:#0f172a}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.shell{height:calc(100vh - 24px)}.launcher{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--line);max-height:52%}.right{min-height:0}.hint{display:none}.preview h2{font-size:17px}.flow-map{overflow:auto}}
</style>
</head>

<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="logo">▶</div>
      <div><b>快速启动</b><span>PointInstance × FlowInstance</span></div>
    </div>
    <div class="hint">选择点实例或线实例 → 可视化启动 · <kbd>↑</kbd><kbd>↓</kbd> 移动 · <kbd>Enter</kbd> 启动</div>
    <button class="icon-btn" id="themeBtn" title="切换主题">☾</button>
  </header>

  <div class="launcher">
    <section class="left">
      <div class="search-wrap">
        <div class="search"><span>⌕</span><input id="search" autocomplete="off" placeholder="搜索点实例 / 线实例 / 类 / 描述…"></div>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="all">全部</button>
        <button class="tab" data-tab="point">点实例</button>
        <button class="tab" data-tab="flow">线实例</button>
        <button class="tab" data-tab="favorite">收藏</button>
        <button class="tab" data-tab="recent">最近</button>
      </div>
      <div class="list" id="list"></div>
    </section>

    <aside class="right">
      <div class="preview" id="preview"></div>
      <div class="footer">
        <button class="btn primary" id="runBtn">▶ 启动</button>
        <button class="btn" id="inspectBtn">检查器</button>
        <button class="btn" id="favoriteBtn">☆ 收藏</button>
        <div class="spacer"></div>
        <span style="font-size:9px;color:var(--faint);font-family:var(--mono)" id="previewHint">ready</span>
      </div>
    </aside>
  </div>
</div>

<div class="run-console hidden" id="console">
  <div class="console">
    <div class="console-head">
      <div>
        <div class="preview-kicker" id="consoleKicker">LAUNCH</div>
        <h3 id="consoleTitle">—</h3>
        <div class="sub" id="consoleSub">—</div>
      </div>
      <button class="icon-btn" id="consoleClose" title="关闭">✕</button>
    </div>
    <div class="console-body">
      <div class="status-row"><span class="pulse" id="pulse"></span><span class="status-text" id="statusText">准备启动…</span></div>
      <div class="progress"><i id="progressBar"></i></div>
      <div id="runVisual"></div>
      <div class="logs" id="logs"></div>
      <div class="result" id="result"></div>
    </div>
    <div class="console-foot">
      <button class="btn danger" id="cancelBtn">取消</button>
      <button class="btn" id="againBtn" disabled>再次启动</button>
      <div class="spacer"></div>
      <button class="btn" id="historyBtn">打开运行历史</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const TARGETS=[
  {id:'vpn.default.status@r1',kind:'point',name:'检测 VPN 状态',classId:'vpn.status',revision:1,effect:'L0',last:'2 分钟前',favorite:true,desc:'读取 VPN 软件进程、窗口与隧道状态，不做任何修改。',params:{app:'DefaultVPN',check:'process + window + tunnel',timeoutMs:3000}},
  {id:'vpn.default.launch@r1',kind:'point',name:'启动默认 VPN',classId:'app.launch',revision:1,effect:'L1',last:'5 分钟前',favorite:true,desc:'启动默认 VPN 软件，可等待主窗口出现。',params:{app:'DefaultVPN',args:'--minimized',waitForWindow:true}},
  {id:'vpn.default.connect@r1',kind:'point',name:'连接 VPN',classId:'vpn.connect',revision:1,effect:'L2',last:'12 分钟前',favorite:false,desc:'通过 UI 自动化点击默认配置的连接按钮；需要 UiAutomation 权限。',params:{profile:'default',method:'uia',timeoutMs:15000}},
  {id:'open.browser.github@r1',kind:'point',name:'打开 GitHub',classId:'sys.open',revision:1,effect:'L1',last:'1 分钟前',favorite:true,desc:'用默认浏览器打开 GitHub。',params:{url:'https://github.com',kind:'url'}},
  {id:'notify.system@r1',kind:'point',name:'系统通知',classId:'notify.toast',revision:1,effect:'L0',last:'刚刚',favorite:false,desc:'发送一条系统通知，不阻塞流程。',params:{level:'info',duration:2500}},
  {id:'inst.ensure-vpn-ask@r2',kind:'flow',name:'确保 VPN（询问）',classId:'flow.ensure-vpn',revision:2,effect:'L2',last:'5 分钟前',favorite:true,desc:'检测 → 启动/询问 → 等待 → 连接；VPN 保障的可复用子流程。',slots:['status','launch','connect','notify'],nodes:['检测 VPN','启动/询问','等待连接','通知']},
  {id:'inst.site-github@r1',kind:'flow',name:'打开 GitHub',classId:'flow.open-external-site',revision:1,effect:'L2',last:'1 分钟前',favorite:true,desc:'确保 VPN → 可达性检查 → 打开 URL → 通知。',slots:['vpn','check','open','notify'],nodes:['VPN 保障','可达性','打开 URL','通知']},
  {id:'inst.workspace-dev@r3',kind:'flow',name:'开发工作区',classId:'flow.open-workspace',revision:3,effect:'L1',last:'1 小时前',favorite:false,desc:'VS Code + 终端 + 双屏布局 + 聚焦编辑器。',slots:['ensureEditor','ensureTerminal','layout','focus'],nodes:['VS Code','终端','布局','聚焦']},
  {id:'inst.invoice-company@r6',kind:'flow',name:'公司发票归档',classId:'flow.batch-archive',revision:6,effect:'L1',last:'昨天',favorite:false,desc:'扫描目录 → OCR → 提取 → 校验 → 归档；批量遍历。',slots:['list','ocr','extract','validate','move'],nodes:['扫描','OCR','提取','校验','归档']},
];
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=(id)=>TARGETS.find(t=>t.id===id);
const state={tab:'all',query:'',selectedId:'inst.site-github@r1',timer:null,run:null,toastTimer:null};

function filtered(){
  const q=state.query.trim().toLowerCase();
  return TARGETS.filter(t=>{
    if(state.tab==='point'&&t.kind!=='point')return false;
    if(state.tab==='flow'&&t.kind!=='flow')return false;
    if(state.tab==='favorite'&&!t.favorite)return false;
    if(state.tab==='recent'&&!['刚刚','1 分钟前','2 分钟前','5 分钟前','12 分钟前'].includes(t.last))return false;
    if(!q)return true;
    return [t.id,t.name,t.classId,t.desc,t.kind,(t.params?JSON.stringify(t.params):''),(t.slots||[]).join(' ')].join(' ').toLowerCase().includes(q);
  });
}

function renderTabs(){
  $$('#tabs [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
}

function renderList(){
  const items=filtered();
  if(!items.length){$('#list').innerHTML=`<div class="empty">没有匹配的实例</div>`;return;}
  const groups={point:items.filter(t=>t.kind==='point'),flow:items.filter(t=>t.kind==='flow')};
  let html='';
  if(groups.point.length){html+=`<div class="group-label">PointInstance · ${groups.point.length}</div>`+groups.point.map(itemRow).join('');}
  if(groups.flow.length){html+=`<div class="group-label">FlowInstance · ${groups.flow.length}</div>`+groups.flow.map(itemRow).join('');}
  $('#list').innerHTML=html;
  $$('#list [data-id]').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('[data-star]'))return;
    state.selectedId=el.dataset.id;renderList();renderPreview();
  });
  $$('#list [data-star]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const t=byId(b.dataset.star);t.favorite=!t.favorite;renderList();renderPreview();toast(t.favorite?'已收藏':'已取消收藏');
  });
}

function itemRow(t){
  const active=t.id===state.selectedId;
  return `<div class="item ${active?'active':''}" data-id="${esc(t.id)}" role="button" tabindex="0">
    <span class="kind ${t.kind}">${t.kind==='point'?'PT':'FLOW'}</span>
    <span class="item-main">
      <span class="item-title"><b>${esc(t.name)}</b><span class="eff">${esc(t.effect)}</span></span>
      <span class="item-sub">${esc(t.id)} · ${esc(t.classId)}</span>
      <span class="item-meta"><span>${esc(t.last)}</span><span>${t.kind==='point'?'PointRun':'FlowRun'}</span></span>
    </span>
    <button class="star ${t.favorite?'on':''}" data-star="${esc(t.id)}" title="收藏">${t.favorite?'★':'☆'}</button>
  </div>`;
}

function renderPreview(){
  const t=byId(state.selectedId)||TARGETS[0];
  const isPoint=t.kind==='point';
  const params=t.params?Object.entries(t.params).map(([k,v])=>`<div class="param"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join(''):'';
  const slots=(t.slots||[]).map(s=>`<span class="chip ok">${esc(s)}</span>`).join('');
  $('#preview').innerHTML=`
    <div class="preview-kicker">${isPoint?'POINTINSTANCE':'FLOWINSTANCE'}</div>
    <h2>${esc(t.name)}</h2>
    <div class="id">${esc(t.id)} @ r${t.revision}</div>
    <p class="desc">${esc(t.desc)}</p>
    <div class="badges"><span class="badge ${t.kind}">${isPoint?'POINT':'FLOW'}</span><span class="badge">${esc(t.classId)}</span><span class="badge">${esc(t.effect)}</span><span class="badge green">${esc(t.last)}</span></div>
    <div class="section"><h4>${isPoint?'参数':'槽位'} <span>${isPoint?Object.keys(t.params||{}).length:(t.slots||[]).length}</span></h4>${isPoint?`<div class="params">${params}</div>`:`<div class="slot-list">${slots}</div>`}</div>
    <div class="section"><h4>启动方式</h4><div class="kv">
      <span class="k">run type</span><span class="v"><code>${isPoint?'PointRun':'FlowRun'}</code></span>
      <span class="k">target</span><span class="v"><code>${esc(t.id)}</code></span>
      <span class="k">preview</span><span class="v">${isPoint?'单项进度 + 输出':'节点逐个点亮 + slotRuns'}</span>
    </div></div>`;
  $('#runBtn').textContent=isPoint?'▶ 启动点实例':'▶ 启动线实例';
  $('#previewHint').textContent=isPoint?'PointRun ready':'FlowRun ready';
  $('#favoriteBtn').textContent=t.favorite?'★ 已收藏':'☆ 收藏';
}

function openConsole(t){
  $('#console').classList.remove('hidden');
  $('#consoleKicker').textContent=t.kind==='point'?'POINT RUN':'FLOW RUN';
  $('#consoleTitle').textContent=t.name;
  $('#consoleSub').textContent=`${t.id} @ r${t.revision} · ${t.classId}`;
  $('#statusText').textContent='准备启动…';
  $('#progressBar').style.width='0%';
  $('#logs').innerHTML='';
  $('#result').className='result';
  $('#result').textContent='';
  $('#againBtn').disabled=true;
  $('#cancelBtn').disabled=false;
  $('#pulse').style.display='block';
  $('#runVisual').innerHTML=t.kind==='flow'?flowMap(t):pointRing();
}

function flowMap(t){
  return `<div class="flow-map">${t.nodes.map((n,i)=>`<div class="flow-node" data-step="${i}"><b>${esc(n)}</b>slot.${esc((t.slots||[])[i]||('s'+i))}</div>${i<t.nodes.length-1?'<div class="flow-arrow"></div>':''}`).join('')}</div>`;
}
function pointRing(){
  return `<div class="point-run"><div class="ring" id="ring" style="--p:0%"><div><b id="ringVal">0%</b><small>POINT RUN</small></div></div></div>`;
}

function addLog(msg,type=''){
  const time=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  const el=document.createElement('div');
  el.className='log-line '+type;
  el.innerHTML=`<span class="t">${time}</span><span class="m">${esc(msg)}</span>`;
  $('#logs').appendChild(el);$('#logs').scrollTop=$('#logs').scrollHeight;
}

function startRun(){
  const t=byId(state.selectedId)||TARGETS[0];
  if(state.timer){clearInterval(state.timer);state.timer=null;}
  state.run={target:t,index:0,total:t.kind==='flow'?t.nodes.length:4,status:'running'};
  openConsole(t);
  addLog(`启动 ${t.kind==='point'?'PointRun':'FlowRun'}：${t.id}@r${t.revision}`);
  addLog(`加载 ${t.kind==='point'?'PointInstance':'FlowInstance'} 绑定与 revision`);
  const tick=()=>{
    const r=state.run;if(!r||r.status!=='running')return;
    const i=r.index;
    if(t.kind==='flow'){
      $$('.flow-node').forEach((n,idx)=>{n.classList.remove('running');if(idx<i)n.classList.add('ok');if(idx===i)n.classList.add('running');});
      addLog(`slotRuns[${i}] · ${t.nodes[i]} · ${t.slots[i]} → running`);
      $('#statusText').textContent=`运行 ${t.nodes[i]}（${i+1}/${r.total}）`;
    }else{
      const pct=Math.round(((i+1)/r.total)*100);
      const ring=$('#ring');if(ring)ring.style.setProperty('--p',pct+'%');
      const rv=$('#ringVal');if(rv)rv.textContent=pct+'%';
      addLog(['加载点实例','校验参数','执行原子能力','写入 PointRun'][i]||`step ${i+1}`);
      $('#statusText').textContent=`执行 ${i+1}/${r.total}`;
    }
    r.index++;
    const pct=Math.round((r.index/r.total)*100);
    $('#progressBar').style.width=pct+'%';
    if(r.index>=r.total){clearInterval(state.timer);state.timer=null;finishRun(t,true);}
  };
  tick();
  state.timer=setInterval(tick,650);
}

function finishRun(t,ok){
  state.run={target:t,status:ok?'ok':'failed'};
  $('#pulse').style.display='none';
  $('#progressBar').style.width='100%';
  $('#statusText').textContent=ok?'完成':'失败';
  if(t.kind==='flow'){
    $$('.flow-node').forEach(n=>{n.classList.remove('running');n.classList.add(ok?'ok':'failed');});
    addLog('FlowRun 完成 · slotRuns 全部成功', 'ok');
  }else{
    const ring=$('#ring');if(ring)ring.style.setProperty('--p','100%');
    const rv=$('#ringVal');if(rv)rv.textContent='100%';
    addLog('PointRun 完成 · 输出已写入运行记录','ok');
  }
  const result=$('#result');
  result.className='result show';
  result.textContent=ok?`${t.kind==='point'?'PointRun':'FlowRun'} ${t.id}@r${t.revision} 成功 · ${t.kind==='point'?'1 个叶子实例':'slotRuns 已记录'} · 用时 2.6s`:`${t.kind==='point'?'PointRun':'FlowRun'} ${t.id}@r${t.revision} 失败 · 查看运行历史`;
  $('#againBtn').disabled=false;
  $('#cancelBtn').disabled=true;
}

function cancelRun(){
  if(!state.run||state.run.status!=='running')return;
  clearInterval(state.timer);state.timer=null;
  state.run.status='canceled';
  $('#pulse').style.display='none';
  $('#statusText').textContent='已取消';
  addLog('用户取消运行','err');
  $('#result').className='result show';
  $('#result').textContent='运行已取消；已完成的 slotRuns / PointRuns 保留在运行历史。';
  $('#againBtn').disabled=false;
  $('#cancelBtn').disabled=true;
}

function closeConsole(){
  if(state.timer){clearInterval(state.timer);state.timer=null;}
  $('#console').classList.add('hidden');
  state.run=null;
}

function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>t.classList.remove('show'),1700);
}

function initTheme(){
  let saved=null;try{saved=localStorage.getItem('quick-launch-theme');}catch(e){}
  if(saved==='light')document.body.classList.add('light');
  updateTheme();
  $('#themeBtn').onclick=()=>{
    document.body.classList.toggle('light');
    try{localStorage.setItem('quick-launch-theme',document.body.classList.contains('light')?'light':'dark');}catch(e){}
    updateTheme();toast(document.body.classList.contains('light')?'浅色主题':'深色主题');
  };
}
function updateTheme(){$('#themeBtn').textContent=document.body.classList.contains('light')?'☀':'☾';}

function moveSelection(dir){
  const items=filtered();if(!items.length)return;
  let idx=items.findIndex(t=>t.id===state.selectedId);
  if(idx<0)idx=0;
  idx=(idx+dir+items.length)%items.length;
  state.selectedId=items[idx].id;renderList();renderPreview();
}

function init(){
  initTheme();renderTabs();renderList();renderPreview();
  $('#search').oninput=(e)=>{state.query=e.target.value;renderList();};
  $$('#tabs [data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderTabs();renderList();});
  $('#runBtn').onclick=startRun;
  $('#inspectBtn').onclick=()=>toast(`模拟：打开 ${byId(state.selectedId).kind==='point'?'surface.inspector.point':'surface.inspector.slot-vpn'}`);
  $('#favoriteBtn').onclick=()=>{const t=byId(state.selectedId);t.favorite=!t.favorite;renderList();renderPreview();toast(t.favorite?'已收藏':'已取消收藏');};
  $('#cancelBtn').onclick=cancelRun;
  $('#againBtn').onclick=startRun;
  $('#consoleClose').onclick=closeConsole;
  $('#historyBtn').onclick=()=>toast('模拟：打开 surface.run-history.flow');
  $('#console').onclick=(e)=>{if(e.target===$('#console'))closeConsole();};
  document.addEventListener('keydown',(e)=>{
    if(!$('#console').classList.contains('hidden')){
      if(e.key==='Escape')closeConsole();
      return;
    }
    if(e.key==='ArrowDown'){e.preventDefault();moveSelection(1);}
    if(e.key==='ArrowUp'){e.preventDefault();moveSelection(-1);}
    if(e.key==='Enter'&&document.activeElement!==$('#search')){e.preventDefault();startRun();}
    if(e.key==='/'&&document.activeElement!==$('#search')){e.preventDefault();$('#search').focus();}
    if(e.key==='Escape'&&document.activeElement===$('#search')){state.query='';$('#search').value='';$('#search').blur();renderList();}
  });
}
document.addEventListener('DOMContentLoaded',init);

</script>
</body>
</html>
