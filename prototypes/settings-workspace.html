<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>整个软件设置 · Settings Workspace</title>
<style>
:root{
  --bg:#070b12;--panel:#0d1420;--card:#111a29;--card2:#152235;--line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.25);
  --ink:#e6eef9;--dim:#8fa2bb;--faint:#5f7188;--cyan:#22d3ee;--blue:#3b82f6;--violet:#8b5cf6;
  --amber:#f59e0b;--green:#22c55e;--red:#ef4444;
  --mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
  --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:246px minmax(0,1fr) 300px;grid-template-rows:54px minmax(0,1fr) 30px;height:100%}
header{position:relative;grid-column:1/-1;display:flex;align-items:center;gap:9px;padding:0 13px;background:linear-gradient(180deg,#0e1725,#0a111c);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-width:110px}
.brand .mark{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#04121a;font:800 13px var(--mono)}
.brand b{font-size:13px}
.brand span{display:block;font:7px var(--mono);color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.section-sel{display:none;border:1px solid var(--line);background:#0a1420;color:#a9bbd0;border-radius:6px;padding:5px 6px;font:8.5px var(--mono);outline:none}
.scope{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:#0a1420}
.scope label{font:7px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.scope select{border:none;background:transparent;color:#a9bbd0;font-size:9px;outline:none;padding:2px 1px}
.search{flex:1;min-width:0;max-width:420px;margin-left:auto;border:1px solid var(--line);border-radius:7px;background:#0a1420;padding:7px 9px;color:var(--ink);font-size:10.5px;outline:none}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:rgba(34,211,238,.42);box-shadow:0 0 0 2px rgba(34,211,238,.06)}
.btn{border:1px solid var(--line);background:#111b28;color:#9fb1c8;border-radius:6px;padding:6px 9px;font-size:9px}
.btn:hover{color:#dbeafe;border-color:var(--line2)}
.btn.primary{border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.11);color:#a5f3fc}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.22);background:rgba(239,68,68,.05)}
.more-btn{padding:5px 8px;font-size:13px;line-height:1}
.more-menu{display:none;position:absolute;right:10px;top:48px;z-index:40;min-width:150px;flex-direction:column;gap:2px;border:1px solid var(--line2);border-radius:7px;background:#0e1826;padding:4px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.more-menu.on{display:flex}
.more-menu button{border:none;background:transparent;color:#9fb1c8;text-align:left;border-radius:4px;padding:6px 8px;font-size:9px}
.more-menu button:hover{background:#152235;color:#dbeafe}
#nav{grid-row:2;background:linear-gradient(180deg,#0e1624,#080d15);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px 20px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
#nav::-webkit-scrollbar{width:7px}
#nav::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px;border:2px solid #080d15}
.nav-group{margin-bottom:10px}
.nav-label{font:7px var(--mono);color:var(--faint);letter-spacing:.15em;text-transform:uppercase;padding:5px 7px 4px}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid transparent;border-radius:7px;cursor:pointer;margin-bottom:1px;position:relative}
.nav-item:hover{background:#121d2c;border-color:var(--line)}
.nav-item.on{background:rgba(34,211,238,.07);border-color:rgba(34,211,238,.22)}
.nav-icon{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:#162234;border:1px solid var(--line);color:var(--cat,#22d3ee);flex:0 0 22px}
.nav-main{min-width:0;flex:1}
.nav-name{font-size:10.5px;color:#dbeafe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sub{font:7px var(--mono);color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 7px var(--amber);flex:0 0 6px}
.nav-lock{font-size:8px;color:#fca5a5;flex:0 0 auto}
#main{grid-row:2;min-width:0;min-height:0;overflow-y:auto;background:radial-gradient(circle at 25% 0%,rgba(34,211,238,.04),transparent 45%),linear-gradient(180deg,#0a111c,#070b12);padding:16px 18px 26px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
#main::-webkit-scrollbar{width:8px}
#main::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px;border:2px solid #070b12}
.section-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.section-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#162234;border:1px solid var(--line2);color:var(--cat,#22d3ee);font-size:16px;flex:0 0 38px}
.section-text{min-width:0;flex:1}
.section-kicker{font:7.5px var(--mono);color:var(--faint);letter-spacing:.14em;text-transform:uppercase}
.section-head h1{font-size:18px;margin:2px 0 2px}
.section-head p{margin:0;color:#94a8c0;font-size:10.5px;line-height:1.55;max-width:760px}
.section-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.group{border:1px solid var(--line);border-radius:9px;background:rgba(17,26,41,.72);margin-bottom:10px;overflow:hidden}
.group-head{display:flex;align-items:center;gap:7px;padding:8px 11px;border-bottom:1px solid var(--line);background:rgba(15,26,41,.85)}
.group-head b{font:8.5px var(--mono);color:#a9bbd0;letter-spacing:.03em}
.group-head span{font-size:7.5px;color:var(--faint);margin-left:auto}
.group-body{padding:0 11px}
.setting-row{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(130px,1fr) 82px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(148,163,184,.075);position:relative}
.setting-row:last-child{border-bottom:none}
.setting-row:hover{background:rgba(34,211,238,.018)}
.setting-row.dirty{background:rgba(245,158,11,.035);box-shadow:inset 2px 0 0 rgba(245,158,11,.55)}
.setting-row.highlight{background:rgba(34,211,238,.065);box-shadow:inset 2px 0 0 rgba(34,211,238,.65)}
.row-main{min-width:0}
.row-label{font-size:10px;color:#dbeafe;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.row-desc{font-size:7.5px;color:var(--faint);line-height:1.5;margin-top:2px;max-width:520px}
.row-meta{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.mini{font:6.5px var(--mono);padding:1px 3px;border-radius:2px;border:1px solid var(--line);color:#8fa2bb;background:#121d2c}
.mini.l1{color:#a5f3fc;border-color:rgba(34,211,238,.2);background:rgba(34,211,238,.05)}
.mini.l2{color:#fcd34d;border-color:rgba(245,158,11,.2);background:rgba(245,158,11,.05)}
.mini.restart{color:#fca5a5;border-color:rgba(239,68,68,.2);background:rgba(239,68,68,.05)}
.mini.secret{color:#c4b5fd;border-color:rgba(139,92,246,.2);background:rgba(139,92,246,.06)}
.row-control{min-width:0}
.row-control select,.row-control input[type=text],.row-control input[type=number],.row-control input[type=password]{width:100%;border:1px solid var(--line);background:#0a1420;color:#a9bbd0;border-radius:4px;font:8.5px var(--mono);padding:5px 6px;outline:none}
.row-control select:focus,.row-control input:focus{border-color:rgba(34,211,238,.35)}
.row-control input:disabled,.row-control select:disabled{opacity:.55;cursor:not-allowed}
.switch{position:relative;display:inline-block;width:32px;height:18px;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#1e293b;border:1px solid var(--line);border-radius:99px;transition:.15s}
.switch span::before{content:"";position:absolute;width:12px;height:12px;left:2px;top:2px;border-radius:50%;background:#64748b;transition:.15s}
.switch input:checked+span{background:rgba(34,211,238,.18);border-color:rgba(34,211,238,.4)}
.switch input:checked+span::before{transform:translateX(14px);background:#22d3ee;box-shadow:0 0 6px #22d3ee}
.switch input:disabled+span{opacity:.45}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0}
.src{font:6.5px var(--mono);padding:1px 3px;border-radius:2px;border:1px solid var(--line);color:#8fa2bb;background:#121d2c}
.src.user{color:#a5f3fc;border-color:rgba(34,211,238,.22);background:rgba(34,211,238,.05)}
.src.workspace{color:#86efac;border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.05)}
.src.machine{color:#c4b5fd;border-color:rgba(139,92,246,.22);background:rgba(139,92,246,.05)}
.src.policy{color:#fca5a5;border-color:rgba(239,68,68,.22);background:rgba(239,68,68,.05)}
.reset{border:none;background:transparent;color:#5f7188;font:7px var(--mono);padding:1px 2px}
.reset:hover{color:#a5f3fc}
.secret-box{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.secret-dot{font:7.5px var(--mono);color:#c4b5fd;border:1px solid rgba(139,92,246,.22);border-radius:3px;padding:2px 4px;background:rgba(139,92,246,.06)}
.secret-btn{border:1px solid var(--line);background:#121d2c;color:#9fb1c8;border-radius:3px;padding:2px 4px;font:7px var(--mono)}
.section-foot{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:4px}
.foot-note{font:7px var(--mono);color:var(--faint);margin-left:auto}
.policy-banner{border:1px solid rgba(245,158,11,.25);background:rgba(245,158,11,.05);color:#fcd34d;border-radius:7px;padding:8px 10px;font-size:9px;line-height:1.5;margin-bottom:10px}
.search-results .result{border:1px solid var(--line);border-radius:7px;background:var(--card);padding:8px;margin-bottom:6px;cursor:pointer}
.search-results .result:hover{border-color:rgba(34,211,238,.28);background:#121f30}
.result-top{display:flex;align-items:center;gap:6px}
.result-label{font-size:9.5px;color:#dbeafe}
.result-key{font:7px var(--mono);color:var(--faint);margin-left:auto}
.result-desc{font-size:7.5px;color:var(--faint);margin-top:3px;line-height:1.5}
.empty{padding:28px 10px;text-align:center;color:var(--faint);font-size:9px}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.info-card{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:10px}
.info-card h3{margin:0 0 6px;font:8.5px var(--mono);color:#a5f3fc;letter-spacing:.05em;display:flex;align-items:center;gap:5px}
.info-kv{display:grid;grid-template-columns:78px 1fr;gap:3px 6px;font:7.5px var(--mono);line-height:1.5}
.info-kv .k{color:var(--faint)}
.info-kv .v{color:#b9c7da;word-break:break-all}
.info-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.info-btn{border:1px solid var(--line);background:#121d2c;color:#93a4ba;border-radius:4px;padding:3px 5px;font:7px var(--mono)}
.info-btn:hover{color:#a5f3fc;border-color:rgba(34,211,238,.25)}
#changes{grid-row:2;border-left:1px solid var(--line);background:linear-gradient(180deg,#0e1624,#080d15);overflow-y:auto;padding:12px 11px 24px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
#changes::-webkit-scrollbar{width:7px}
#changes::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px;border:2px solid #080d15}
.ch-head{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.ch-head b{font:8px var(--mono);color:#a9bbd0;letter-spacing:.08em;text-transform:uppercase}
.ch-count{margin-left:auto;font:7px var(--mono);color:#fcd34d}
.ch-list{border:1px solid var(--line);border-radius:7px;background:var(--card);padding:7px;margin-bottom:8px;max-height:330px;overflow:auto}
.ch-row{padding:5px 0;border-bottom:1px solid rgba(148,163,184,.07);font:7.5px var(--mono)}
.ch-row:last-child{border-bottom:none}
.ch-label{color:#b9c7da;display:block;margin-bottom:2px}
.ch-diff{color:#8fa2bb;word-break:break-all}
.ch-diff .from{color:#fca5a5;text-decoration:line-through}
.ch-diff .to{color:#86efac}
.ch-actions{display:flex;gap:5px}
.ch-actions .btn{flex:1;text-align:center}
.restart-box{border:1px solid rgba(245,158,11,.22);background:rgba(245,158,11,.045);border-radius:6px;padding:7px;margin-top:8px;font-size:8px;color:#fcd34d;line-height:1.5}
#status{grid-column:1/-1;grid-row:3;display:flex;align-items:center;gap:7px;padding:0 12px;border-top:1px solid var(--line);background:#080e17;font:7px var(--mono);color:var(--faint)}
#status .dot{width:5px;height:5px;border-radius:50%;background:var(--green)}
#status .grow{flex:1}
.toast{position:fixed;left:50%;bottom:42px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#0b1420;border:1px solid var(--line2);color:#dbeafe;padding:7px 11px;border-radius:7px;font-size:9px;z-index:60;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){#app{grid-template-columns:218px minmax(0,1fr)}#changes{display:none}}
@media(max-width:760px){#app{grid-template-columns:168px minmax(0,1fr)}.brand{min-width:auto}.brand span{display:none}.scope label{display:none}.search{max-width:130px}#importBtn,#exportBtn{display:none}.setting-row{grid-template-columns:1fr;gap:5px;padding:9px 0}.row-side{flex-direction:row;align-items:center}.info-grid{grid-template-columns:1fr}}
@media(max-width:560px){#app{grid-template-columns:1fr}#nav{display:none}#status{font-size:6.5px}.search{display:none}.section-sel{display:block;width:92px}.brand b{font-size:12px}#applyBtn{padding:5px 6px;font-size:8px}#closeBtn{padding:5px 7px}}
.btn:disabled{opacity:.4;cursor:not-allowed}
.info-btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.24);background:rgba(239,68,68,.05)}
#changes.dirty .ch-head b{color:#fcd34d}

/* Layer catalogs */
.layer-tabs{display:flex;gap:2px;border:1px solid var(--line);border-radius:7px;padding:2px;background:#0a1420;width:max-content;max-width:100%;margin-bottom:10px}
.layer-tab{border:none;background:transparent;color:#7e91a7;border-radius:5px;padding:5px 9px;font-size:9px;white-space:nowrap}
.layer-tab span{font:6.5px var(--mono);color:var(--faint);margin-left:3px}
.layer-tab.on{background:rgba(34,211,238,.10);color:#a5f3fc}
.layer-tab:hover{color:#dbeafe}
.cat-stats{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.cat-group{margin-bottom:11px}
.cat-group-head{display:flex;align-items:center;gap:6px;font:8px var(--mono);color:var(--faint);letter-spacing:.1em;text-transform:uppercase;padding:4px 2px 6px}
.cat-group-head span{color:#8fa2bb}
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.cat-class{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px;cursor:pointer;min-width:0}
.cat-class:hover{border-color:rgba(34,211,238,.25);background:#121f30}
.cat-class.on{border-color:rgba(34,211,238,.42);box-shadow:inset 0 0 0 1px rgba(34,211,238,.12);background:rgba(34,211,238,.035)}
.cc-top{display:flex;align-items:center;gap:5px}
.cc-id{font:7.5px var(--mono);color:#a5f3fc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.cc-status{font:6.5px var(--mono);padding:1px 3px;border-radius:2px;border:1px solid var(--line);color:#86efac;background:rgba(34,197,94,.05);white-space:nowrap}
.cc-status.draft{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.05)}
.cc-status.active{color:#86efac;border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.05)}
.cc-name{font-size:9.5px;color:#dbeafe;margin-top:3px}
.cc-desc{font-size:7.3px;color:var(--faint);line-height:1.45;margin-top:2px;max-height:22px;overflow:hidden}
.cc-meta{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.cat-badge{font:6.3px var(--mono);padding:1px 3px;border-radius:2px;border:1px solid var(--line);color:#8fa2bb;background:#121d2c}
.cat-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.cat-toolbar select{border:1px solid var(--line);background:#0a1420;color:#a9bbd0;border-radius:4px;font:8px var(--mono);padding:4px 5px;outline:none;max-width:260px}
.cat-table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 280px);background:#0a1420}
.cat-table{width:100%;border-collapse:collapse;font-size:8px}
.cat-table th{position:sticky;top:0;z-index:2;text-align:left;font:7px var(--mono);color:var(--faint);padding:6px 7px;border-bottom:1px solid var(--line);background:#0d1926;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.cat-table td{padding:5px 7px;border-bottom:1px solid rgba(148,163,184,.07);color:#9fb1c8;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.cat-table tr:hover td{background:#101d2c;cursor:pointer}
.cat-table tr.on td{background:rgba(34,211,238,.06);color:#dbeafe}
.cat-table .muted{color:var(--faint);white-space:normal;max-width:360px;line-height:1.4}
.cat-table .status{font:6.5px var(--mono);padding:1px 3px;border-radius:2px;border:1px solid var(--line);color:#86efac;background:rgba(34,197,94,.05)}
.cat-table .status.draft{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.05)}
.cat-table .status.disabled{color:#94a3b8;background:#121d2c}
.cat-insp-kicker{font:6.8px var(--mono);color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.cat-insp-id{font:8px var(--mono);color:#a5f3fc;word-break:break-all;margin-top:3px;line-height:1.4}
.cat-insp-name{font-size:12px;color:#dbeafe;margin-top:3px}
.cat-insp-desc{font-size:7.5px;color:var(--faint);line-height:1.5;margin-top:3px}
.cat-instance-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:5px;background:#0a1420}
.cat-inst-btn{display:flex;justify-content:space-between;gap:5px;width:100%;border:none;border-bottom:1px solid rgba(148,163,184,.07);background:transparent;color:#8fa2bb;text-align:left;padding:5px 6px;font:7px var(--mono)}
.cat-inst-btn:hover{background:#121f30;color:#dbeafe}
.cat-inst-btn.on{background:rgba(34,211,238,.07);color:#a5f3fc}
.cat-inst-btn span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-inst-btn span:last-child{color:var(--faint);flex:0 0 auto}
.cat-inst-detail{border:1px solid var(--line);border-radius:6px;background:#0c1623;padding:7px;margin-top:7px}
.cat-detail-text{font-size:7.2px;color:#8fa2bb;line-height:1.5;margin-top:4px;max-height:80px;overflow:auto;word-break:break-word}
@media(max-width:900px){.cat-grid{grid-template-columns:1fr}}

/* combined layer management */
.mgmt-summary{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mgmt-toolbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mgmt-table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 280px);background:#0a1420}
.mgmt-combined{width:100%;border-collapse:collapse;font-size:8px}
.mgmt-combined th{position:sticky;top:0;z-index:2;text-align:left;font:7px var(--mono);color:var(--faint);padding:7px 8px;border-bottom:1px solid var(--line);background:#0d1926;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.mgmt-combined td{padding:6px 8px;border-bottom:1px solid rgba(148,163,184,.07);color:#9fb1c8;vertical-align:middle}
.mgmt-cls-row{cursor:pointer;background:rgba(255,255,255,.012)}
.mgmt-cls-row:hover td{background:#101d2c}
.mgmt-cls-row.on td{background:rgba(34,211,238,.055);color:#dbeafe}
.mgmt-cls-row b{font-size:9.5px;color:#dbeafe}
.mgmt-chev{display:inline-block;width:12px;color:#7e91a7;font:8px var(--mono)}
.mgmt-cls-id{font:7px var(--mono);color:var(--faint);margin-top:2px;word-break:break-all}
.mgmt-inst-row{cursor:pointer;background:#08111c}
.mgmt-inst-row:hover td{background:#101d2c}
.mgmt-inst-row.on td{background:rgba(34,211,238,.04)}
.mgmt-indent{color:#3f5269;margin-right:4px;font:8px var(--mono)}
.mgmt-inst-name{font-size:8.5px;color:#b9c7da}
.mgmt-inst-id{display:block;font:6.8px var(--mono);color:var(--faint);margin-top:1px;word-break:break-all}
.mgmt-status{font:6.5px var(--mono);padding:1px 3px;border-radius:2px;border:1px solid var(--line);color:#86efac;background:rgba(34,197,94,.05);white-space:nowrap}
.mgmt-status.draft{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.05)}
.mgmt-status.archived,.mgmt-status.disabled{color:#94a3b8;border-color:var(--line);background:#121d2c}
.mgmt-detail{color:var(--faint);max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.mgmt-detail{max-width:160px}}

.manage-jump{display:flex;align-items:center;gap:9px;border:1px solid rgba(34,211,238,.20);border-radius:8px;background:rgba(34,211,238,.035);padding:8px 10px;margin-bottom:10px}
.mj-icon{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.22);color:#a5f3fc;font-size:12px;flex:0 0 26px}
.mj-main{min-width:0;flex:1}.mj-main b{display:block;font:8.5px var(--mono);color:#a5f3fc}.mj-main span{display:block;font-size:7.5px;color:var(--faint);line-height:1.5;margin-top:2px}
@media(max-width:700px){.manage-jump{align-items:flex-start;flex-wrap:wrap}.manage-jump .btn{margin-left:35px}}
</style>

<body>
<div id="app">

    <div class="brand">
      <div class="mark">⚙</div>
      <div><b>Settings</b><span>Settings Workspace</span></div>
    </div>
    <select class="section-sel" id="sectionSel"></select>
    <div class="scope">
      <label>Scope</label>
      <select id="scopeSel">
        <option value="User">User</option>
        <option value="Workspace">Workspace</option>
        <option value="Machine">Machine</option>
        <option value="Policy">Policy</option>
      </select>
    </div>
    <input class="search" id="search" placeholder="搜索设置…  Cmd/Ctrl+K">
    <button class="btn primary" id="applyBtn" disabled>Apply</button>
    <button class="btn more-btn" id="moreBtn">⋯</button>
    <div class="more-menu" id="moreMenu">
      <button data-more="import">Import settings…</button>
      <button data-more="export">Export settings…</button>
      <button data-more="close">Close</button>
    </div>
  </header>

  <nav id="nav"></nav>

  <main id="main"></main>

  <aside id="changes"></aside>

  <footer id="status">
    <span class="dot"></span>
    <span id="statusLeft">Settings · User scope · clean</span>
    <span class="grow"></span>
    <span id="statusRight">v1.4.2 · build 2026.11.23</span>
  </footer>
</div>

const state = {
  sectionId: 'general',
  scope: 'User',
  query: '',
  values: {},
  saved: {},
  highlightKey: null,
  showAdvanced: false,
  restartPending: [],
  layerTab: 'settings',
  selectedClassId: null,
  selectedInstanceId: null,
  expandedClasses: new Set(),
  filterClass: 'all',
  toastTimer: null
};

const ALL_SETTINGS = SECTIONS.flatMap(s => (s.groups || []).flatMap(g => g.settings));
const settingById = key => ALL_SETTINGS.find(s => s.key === key);
const sectionById = id => SECTIONS.find(s => s.id === id);

function initValues() {
  state.values = {};
  for (const s of ALL_SETTINGS) {
    state.values[s.key] = { value: s.default, source: s.policy ? 'policy' : (s.initialSource || 'default') };
  }
  state.saved = clone(state.values);
}
initValues();

/* ============================================================
   状态 / 渲染
   ============================================================ */
function dirtyKeys() {
  return ALL_SETTINGS.filter(s => JSON.stringify(state.values[s.key]?.value) !== JSON.stringify(state.saved[s.key]?.value)).map(s => s.key);
}
function isDirty(key) { return dirtyKeys().includes(key); }
function sectionSettings(id) {
  const sec = sectionById(id);
  return sec && sec.groups ? sec.groups.flatMap(g => g.settings) : [];
}
function sectionDirty(id) { return sectionSettings(id).some(s => isDirty(s.key)); }
function sectionLocks(id) { return sectionSettings(id).filter(s => state.values[s.key]?.source === 'policy').length; }

const LAYER_IDS = ['point', 'line', 'surface', 'body', 'field'];
function isLayerSection(id) { return LAYER_IDS.includes(id); }
function catalogFor(id) { return (typeof LAYER_CATALOGS !== 'undefined' && LAYER_CATALOGS[id]) || null; }
function catalogInstances(cat) { return cat ? cat.classes.reduce((n, c) => n + c.instances.length, 0) : 0; }
function currentClass() {
  const cat = catalogFor(state.sectionId);
  if (!cat) return null;
  return cat.classes.find(c => c.id === state.selectedClassId) || cat.classes[0] || null;
}
function currentInstance() {
  const c = currentClass();
  if (!c) return null;
  return c.instances.find(i => i.id === state.selectedInstanceId) || c.instances[0] || null;
}
function ensureLayerSelection(id) {
  const cat = catalogFor(id);
  if (!cat) return;
  if (!cat.classes.some(c => c.id === state.selectedClassId)) {
    state.selectedClassId = cat.classes[0]?.id || null;
    state.selectedInstanceId = cat.classes[0]?.instances[0]?.id || null;
  }
  const c = currentClass();
  if (c && !c.instances.some(i => i.id === state.selectedInstanceId)) state.selectedInstanceId = c.instances[0]?.id || null;
  if (c && state.expandedClasses) state.expandedClasses.add(c.id);
}
function formatVal(spec, v) {
  if (spec.secret) return v ? '••••••••' : 'not configured';
  if (typeof v === 'boolean') return v ? 'on' : 'off';
  if (v === '' || v === null || v === undefined) return '—';
  return String(v);
}

function renderHeader() {
  const n = dirtyKeys().length;
  $('#scopeSel').value = state.scope;
  if ($('#sectionSel')) $('#sectionSel').value = state.sectionId;
  const apply = $('#applyBtn');
  apply.disabled = n === 0 || state.scope === 'Policy' || (isLayerSection(state.sectionId) && state.layerTab !== 'settings');
  apply.textContent = n ? `Apply (${n})` : 'Apply';
}

function renderNav() {
  const groups = [
    { label: 'General', ids: ['general'] },
    { label: 'Layers', ids: LAYER_IDS },
    { label: 'Info', ids: ['info'] }

  $('#nav').innerHTML = groups.map(g => `<div class="nav-group"><div class="nav-label">${esc(g.label)}</div>${g.ids.map(id => {
    const s = sectionById(id);
    const cat = catalogFor(id);
    const dirty = sectionDirty(id);
    const locks = sectionLocks(id);
    const sub = cat ? `${cat.classes.length} 类 / ${catalogInstances(cat)} 实例` : (id === 'general' ? 'app settings' : 'read only');
    return `<div class="nav-item ${s.id === state.sectionId ? 'on' : ''}" data-section="${esc(s.id)}" style="--cat:${s.color}">
      <div class="nav-icon">${esc(s.icon)}</div>
      <div class="nav-main"><div class="nav-name">${esc(s.title)}</div><div class="nav-sub">${esc(sub)}${locks ? ' · ' + locks + ' locked' : ''}</div></div>
      ${dirty ? '<span class="nav-dot"></span>' : ''}${locks ? '<span class="nav-lock">🔒</span>' : ''}
    </div>`;
  }).join('')}</div>`).join('');
  $$('#nav [data-section]').forEach(el => el.onclick = () => {
    state.sectionId = el.dataset.section;
    state.layerTab = 'settings';
    state.filterClass = 'all';
    state.query = '';
    $('#search').value = '';
    if (isLayerSection(state.sectionId)) ensureLayerSelection(state.sectionId);
    renderAll();
  });
}

function sourceBadge(src) { return `<span class="src ${esc(src)}">${esc(src)}</span>`; }

function controlHTML(spec, v, locked) {
  if (spec.type === 'secret') {
    return `<div class="secret-box"><span class="secret-dot">${v ? 'Configured' : 'Not configured'}</span><span style="font:7px var(--mono);color:var(--faint)">${v ? esc(v) : 'no secretRef'}</span><button class="secret-btn" data-secret="${esc(spec.key)}" ${locked ? 'disabled' : ''}>${v ? 'Replace' : 'Set'}</button></div>`;
  }
  if (spec.type === 'bool') {
    return `<label class="switch"><input type="checkbox" data-key="${esc(spec.key)}" ${v ? 'checked' : ''} ${locked ? 'disabled' : ''}><span></span></label>`;
  }
  if (spec.type === 'enum') {
    return `<select data-key="${esc(spec.key)}" ${locked ? 'disabled' : ''}>${(spec.options || []).map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  }
  if (spec.type === 'number') {
    return `<input type="number" data-key="${esc(spec.key)}" value="${esc(v)}" min="${spec.min ?? ''}" max="${spec.max ?? ''}" ${locked ? 'disabled' : ''}>`;
  }
  return `<input type="text" data-key="${esc(spec.key)}" value="${esc(v)}" ${locked ? 'disabled' : ''}>`;
}

function rowHTML(spec, section) {
  const cur = state.values[spec.key] || { value: spec.default, source: 'default' };
  const locked = cur.source === 'policy' || state.scope === 'Policy';
  const dirty = isDirty(spec.key);
  const highlight = state.highlightKey === spec.key;
  const badges = [`<span class="mini l${String(spec.effect).slice(1)}">${esc(spec.effect)}</span>`];
  if (spec.restart) badges.push(`<span class="mini restart">restart ${esc(spec.restart)}</span>`);
  if (spec.secret) badges.push('<span class="mini secret">secretRef</span>');
  if (cur.source === 'policy') badges.push('<span class="mini restart">policy locked</span>');
  if (spec.unit) badges.push(`<span class="mini">${esc(spec.unit)}</span>`);
  const showReset = !locked && (dirty || cur.source !== 'default');
  return `<div class="setting-row ${dirty ? 'dirty' : ''} ${highlight ? 'highlight' : ''}" data-row="${esc(spec.key)}">
    <div class="row-main">
      <div class="row-label">${esc(spec.label)} ${badges.join('')}</div>
      <div class="row-desc">${esc(spec.desc)}</div>
    </div>
    <div class="row-control">${controlHTML(spec, cur.value, locked)}</div>
    <div class="row-side">${sourceBadge(cur.source)}${showReset ? `<button class="reset" data-reset="${esc(spec.key)}">reset</button>` : ''}</div>
  </div>`;
}

      <div class="section-text"><div class="section-kicker">Info / read only</div><h1>${esc(sec.title)}</h1><p>${esc(sec.desc)}</p></div>

    </div>
    <div class="info-grid">${INFO_CARDS.map(c => `<div class="info-card"><h3>${esc(c.icon)} ${esc(c.title)}</h3><div class="info-kv">${c.rows.map(([k, v]) => `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`).join('')}</div><div class="info-actions">${(c.actions || []).map(([label]) => `<button class="info-btn ${c.danger ? 'danger' : ''}" data-info-action="${esc(label)}">${esc(label)}</button>`).join('')}</div></div>`).join('')}</div>`;
}

function renderSearch() {
  const q = state.query.trim().toLowerCase();
  const matches = ALL_SETTINGS.filter(s => {
    const hay = [s.key, s.label, s.desc, ...(s.alias || []), ...(s.options || [])].join(' ').toLowerCase();
    return hay.includes(q);
  });
  const grouped = {};
  for (const s of matches) {
    const sec = SECTIONS.find(x => (x.groups || []).some(g => g.settings.includes(s)));
    if (!sec) continue;
    (grouped[sec.id] ||= []).push(s);
  }
  const catMatches = [];
  for (const layer of LAYER_IDS) {
    const cat = catalogFor(layer);
    if (!cat) continue;
    for (const c of cat.classes) {
      if ([c.id, c.name, c.group, c.summary, c.effect, c.status].join(' ').toLowerCase().includes(q)) {
        catMatches.push({ kind: 'class', layer, classId: c.id, label: c.name, sub: c.id, desc: c.summary, count: c.instances.length });
      }
      for (const ins of c.instances) {
        if ([ins.id, ins.name, ins.detail, c.id, c.name].join(' ').toLowerCase().includes(q)) {
          catMatches.push({ kind: 'instance', layer, classId: c.id, instanceId: ins.id, label: ins.name, sub: ins.id, desc: ins.detail, rev: ins.rev });
        }
      }
    }
  }
  const shownCat = catMatches.slice(0, 60);
  $('#main').innerHTML = `
    <div class="section-head"><div class="section-icon" style="--cat:#22d3ee">⌕</div><div class="section-text"><div class="section-kicker">Search / ${matches.length + catMatches.length} results</div><h1>搜索设置与层目录</h1><p>匹配 key、label、描述、alias、enum 选项，以及 PointClass / FlowClass / SurfaceClass / BodyClass / AIClass 与其实例。</p></div><div class="section-actions"><span class="mini">${esc(state.query)}</span></div></div>
    <div class="search-results">
      ${Object.entries(grouped).map(([id, list]) => {
        const sec = sectionById(id);
        if (!sec) return '';
        return `<div class="group"><div class="group-head"><b>${esc(sec.icon)} ${esc(sec.title)} · settings</b><span>${list.length} matches</span></div><div class="group-body">${list.map(s => {
          const cur = state.values[s.key];
          return `<div class="result" data-result="${esc(s.key)}"><div class="result-top"><span class="result-label">${esc(s.label)}</span><span class="result-key">${esc(s.key)}</span></div><div class="result-desc">${esc(s.desc)}</div><div style="margin-top:3px"><span class="src ${esc(cur.source)}">${esc(cur.source)}</span> <span class="mini">${esc(formatVal(s, cur.value))}</span></div></div>`;
        }).join('')}</div></div>`;
      }).join('')}
      ${shownCat.length ? `<div class="group"><div class="group-head"><b>Layer Catalog</b><span>${catMatches.length} matches${catMatches.length > 60 ? ' · showing 60' : ''}</span></div><div class="group-body">${shownCat.map(x => `<div class="result" data-cat-kind="${x.kind}" data-layer="${x.layer}" data-class="${esc(x.classId)}" data-instance="${esc(x.instanceId || '')}"><div class="result-top"><span class="result-label">${x.kind === 'class' ? '◆' : '·'} ${esc(x.label)}</span><span class="result-key">${esc(x.sub)}</span></div><div class="result-desc">${esc(x.desc || '')}</div><div style="margin-top:3px"><span class="mini l1">${x.kind === 'class' ? 'class' : 'instance'}</span> <span class="mini">${esc(LAYER_CATALOGS[x.layer].label)}</span>${x.count !== undefined ? `<span class="mini">${x.count} instances</span>` : `<span class="mini">r${x.rev}</span>`}</div></div>`).join('')}</div></div>` : ''}
      ${matches.length + catMatches.length ? '' : '<div class="empty">没有匹配的设置或层目录项。试试 “theme”、“timeout”、“vpn”、“ocr”、“agent” 或 “body”。</div>'}
    </div>`;
  $$('#main [data-result]').forEach(el => el.onclick = () => {
    const spec = settingById(el.dataset.result);
    const sec = SECTIONS.find(x => (x.groups || []).some(g => g.settings.includes(spec)));
    state.sectionId = sec.id;
    state.layerTab = 'settings';
    state.query = '';
    $('#search').value = '';
    state.highlightKey = spec.key;
    renderAll();
    setTimeout(() => { state.highlightKey = null; if (!state.query) renderSection(); }, 1600);
  });
  $$('#main [data-cat-kind]').forEach(el => el.onclick = () => {
    const layer = el.dataset.layer;
    const c = catalogFor(layer);
    const cls = c.classes.find(x => x.id === el.dataset.class);
    const inst = el.dataset.instance || cls?.instances[0]?.id || '';
    const hash = `#${layer}/${encodeURIComponent(el.dataset.class)}${inst ? '/' + encodeURIComponent(inst) : ''}`;
    window.location.href = `layer-management.html${hash}`;
  });
}

function renderMain() {
  if (state.query.trim()) return renderSearch();
  renderSection();
}

function catalogHeader(sec, cat, title, desc) {
  return `<div class="section-head">
    <div class="section-icon" style="--cat:${sec.color}">${esc(sec.icon)}</div>
    <div class="section-text"><div class="section-kicker">${esc(sec.group)} / ${esc(sec.id)} / ${esc(state.layerTab)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div>
    <div class="section-actions"><span class="mini l1">${cat.classes.length} classes</span><span class="mini">${catalogInstances(cat)} instances</span></div>
  </div>${layerTabsHTML(sec)}`;
}

function renderClassCatalog() {
  const sec = sectionById(state.sectionId);
  const cat = catalogFor(state.sectionId);
  if (!sec || !cat) return renderSection();
  ensureLayerSelection(state.sectionId);
  const groups = [...new Set(cat.classes.map(c => c.group))];
  $('#main').innerHTML = `${catalogHeader(sec, cat, `${sec.title} · 功能类`, `按 group 浏览 ${cat.classes.length} 个类；点击类查看实例与元数据。`)}
    <div class="cat-stats"><span class="mini l1">${cat.classes.length} classes</span><span class="mini">${catalogInstances(cat)} instances</span><span class="mini">${groups.length} groups</span><span class="foot-note" style="margin-left:auto">class = 契约 · instance = 绑定/参数</span></div>
    ${groups.map(g => {
      const list = cat.classes.filter(c => c.group === g);
      return `<div class="cat-group"><div class="cat-group-head">${esc(g)} <span>${list.length}</span></div><div class="cat-grid">${list.map(c => `<div class="cat-class ${c.id === state.selectedClassId ? 'on' : ''}" data-cat-class="${esc(c.id)}">
        <div class="cc-top"><span class="cc-id">${esc(c.id)}</span><span class="cc-status ${esc(c.status)}">${esc(c.status)}</span></div>
        <div class="cc-name">${esc(c.name)}</div>
        <div class="cc-desc">${esc(c.summary || '')}</div>
        <div class="cc-meta"><span class="cat-badge">${esc(c.group)}</span><span class="cat-badge">${esc(c.effect || 'L0')}</span><span class="cat-badge">${c.instances.length} inst</span><span class="cat-badge">v${esc(c.version || '1.0.0')}</span></div>
      </div>`).join('')}</div></div>`;
    }).join('')}`;
  $$('#main [data-cat-class]').forEach(el => el.onclick = () => {
    const c = cat.classes.find(x => x.id === el.dataset.catClass);

    state.selectedInstanceId = c.instances[0]?.id || null;
    renderClassCatalog();
    renderLayerInspector();

}

function renderInstanceCatalog() {
  const sec = sectionById(state.sectionId);
  const cat = catalogFor(state.sectionId);
  if (!sec || !cat) return renderSection();
  ensureLayerSelection(state.sectionId);
  if (state.filterClass !== 'all' && !cat.classes.some(c => c.id === state.filterClass)) state.filterClass = 'all';
  const classes = state.filterClass === 'all' ? cat.classes : cat.classes.filter(c => c.id === state.filterClass);
  const list = classes.flatMap(c => c.instances.map(ins => ({ ...ins, classId: c.id, className: c.name, group: c.group })));
  $('#main').innerHTML = `${catalogHeader(sec, cat, `${sec.title} · 实例`, `按类筛选实例；点击行查看 revision、状态与绑定。`)}
    <div class="cat-toolbar"><span class="mini l1">${list.length} shown</span><select data-class-filter><option value="all">All classes</option>${cat.classes.map(c => `<option value="${esc(c.id)}" ${state.filterClass === c.id ? 'selected' : ''}>${esc(c.id)}</option>`).join('')}</select><span class="foot-note">instance id · class · revision · status</span></div>
    <div class="cat-table-wrap"><table class="cat-table"><thead><tr><th>Instance</th><th>Class</th><th>Rev</th><th>Status</th><th>Detail</th></tr></thead><tbody>${list.map(ins => `<tr data-cat-instance="${esc(ins.id)}" data-cat-class="${esc(ins.classId)}" class="${ins.id === state.selectedInstanceId ? 'on' : ''}"><td class="mono">${esc(ins.id)}</td><td class="mono">${esc(ins.classId)}</td><td>r${ins.rev}</td><td><span class="status ${esc(ins.status)}">${esc(ins.status)}</span></td><td class="muted">${esc(ins.detail || '')}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No instances.</td></tr>'}</tbody></table></div>`;
  $$('#main [data-cat-instance]').forEach(el => el.onclick = () => {
    state.selectedClassId = el.dataset.catClass;
    state.selectedInstanceId = el.dataset.catInstance;
    renderInstanceCatalog();
    renderLayerInspector();
  });
}

function renderLayerManagement() {
  const sec = sectionById(state.sectionId);
  const cat = catalogFor(state.sectionId);
  if (!sec || !cat) return renderSection();
  ensureLayerSelection(state.sectionId);
  const stable = cat.classes.filter(c => c.status === 'stable').length;
  const draft = cat.classes.filter(c => c.status === 'draft').length;
  const archived = cat.classes.filter(c => c.status === 'archived').length;
  const total = catalogInstances(cat);
  const expanded = state.expandedClasses || (state.expandedClasses = new Set());
  const rows = cat.classes.map(c => {
    const open = expanded.has(c.id);
    const selected = c.id === state.selectedClassId;
    const instRows = open ? c.instances.map(i => `<tr class="mgmt-inst-row ${i.id === state.selectedInstanceId ? 'on' : ''}" data-mgmt-inst="${esc(i.id)}" data-mgmt-class="${esc(c.id)}">
      <td><span class="mgmt-indent">└</span><span class="mgmt-inst-name">${esc(i.name)}</span><span class="mono mgmt-inst-id">${esc(i.id)}</span></td>
      <td>${esc(c.group)}</td><td><span class="mgmt-status ${esc(i.status)}">${esc(i.status)}</span></td><td>${esc(c.effect || 'L0')}</td><td>r${i.rev}</td><td class="mgmt-detail">${esc(i.detail || '')}</td>
    </tr>`).join('') : '';
    return `<tr class="mgmt-cls-row ${selected ? 'on' : ''}" data-mgmt-class="${esc(c.id)}">
      <td><span class="mgmt-chev">${open ? '▾' : '▸'}</span><b>${esc(c.name)}</b><div class="mono mgmt-cls-id">${esc(c.id)}</div></td>
      <td>${esc(c.group)}</td><td><span class="mgmt-status ${esc(c.status)}">${esc(c.status)}</span></td><td>${esc(c.effect || 'L0')}</td><td>${c.instances.length}</td><td class="mgmt-detail">${esc(c.summary || '')}</td>
    </tr>${instRows}`;
  }).join('');
  $('#main').innerHTML = `${catalogHeader(sec, cat, `${sec.title} · 管理`, '类与实例合并在一张表；展开类查看实例，点击行打开右侧 Inspector。')}
    <div class="mgmt-summary"><span class="mini l1">${cat.classes.length} classes</span><span class="mini">${total} instances</span><span class="mini">${stable} stable</span><span class="mini">${draft} draft</span><span class="mini">${archived} archived</span><span class="foot-note" style="margin-left:auto">设置与管理两个 tab；不再拆功能类/实例 tab</span></div>
    <div class="mgmt-toolbar"><button class="btn" data-expand-all>展开全部类</button><button class="btn" data-collapse-all>收起全部</button><button class="btn" data-open-manager>打开完整管理页</button><span class="foot-note" style="margin-left:auto">类行 → 选中类；实例行 → 选中实例</span></div>
    <div class="mgmt-table-wrap"><table class="mgmt-combined"><thead><tr><th>类 / 实例</th><th>Group</th><th>Status</th><th>Effect</th><th>Inst</th><th>Summary / Detail</th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="empty">No classes.</td></tr>'}</tbody></table></div>`;
  $$('#main [data-mgmt-class]').forEach(el => el.onclick = (e) => {
    if (el.dataset.mgmtInst) {
      state.selectedClassId = el.dataset.mgmtClass;
      state.selectedInstanceId = el.dataset.mgmtInst;
      state.expandedClasses.add(state.selectedClassId);
    } else {
      state.selectedClassId = el.dataset.mgmtClass;
      const c = cat.classes.find(x => x.id === state.selectedClassId);
      state.selectedInstanceId = c?.instances[0]?.id || null;
      if (state.expandedClasses.has(state.selectedClassId)) state.expandedClasses.delete(state.selectedClassId); else state.expandedClasses.add(state.selectedClassId);
    }
    renderLayerManagement();
    renderLayerInspector();
  });
  $$('#main [data-expand-all]').forEach(b => b.onclick = () => { cat.classes.forEach(c => state.expandedClasses.add(c.id)); renderLayerManagement(); });
  $$('#main [data-collapse-all]').forEach(b => b.onclick = () => { state.expandedClasses.clear(); renderLayerManagement(); });
  $$('#main [data-open-manager]').forEach(b => b.onclick = () => openManager());
}

function openManager() {
  if (state.sectionId === 'point') {
    try { window.open('atom-catalog-management.html', '_blank', 'noopener'); } catch (_) { toast('打开点层管理页'); }
    toast('打开点层管理页：atom-catalog-management.html');
  } else {
    toast(`${catalogFor(state.sectionId)?.label || state.sectionId} 管理页 · registry / body manager（模拟）`);
  }
}

function renderLayerInspector() {
  const cat = catalogFor(state.sectionId);
  if (!cat) return renderChanges();
  ensureLayerSelection(state.sectionId);
  const c = currentClass();
  const ins = currentInstance();
  if (!c) { $('#changes').innerHTML = '<div class="empty">No class selected.</div>'; return; }
  const instances = c.instances.slice(0, 14);
  $('#changes').innerHTML = `
    <div class="ch-head"><b>Layer Inspector</b><span class="ch-count">${esc(cat.label)}</span></div>
    <div class="cat-insp">
      <div class="cat-insp-kicker">${esc(c.group)} · ${esc(c.status || 'active')}</div>
      <div class="cat-insp-id">${esc(c.id)}</div>
      <div class="cat-insp-name">${esc(c.name)}</div>
      <div class="cat-insp-desc">${esc(c.summary || '')}</div>
      <div class="cat-stats" style="margin-top:7px"><span class="mini">${esc(c.effect || 'L0')}</span><span class="mini">${esc(c.priority || 'P1')}</span><span class="mini">${c.instances.length} inst</span><span class="mini">v${esc(c.version || '1.0.0')}</span></div>
      <div class="ch-actions"><button class="btn" data-open-layer-settings>设置</button><button class="btn" data-open-manager>管理页</button></div>
      <div class="lh" style="margin-top:11px">Instances · ${c.instances.length}</div>
      <div class="cat-instance-list">${instances.map(i => `<button class="cat-inst-btn ${i.id === ins?.id ? 'on' : ''}" data-insp-inst="${esc(i.id)}"><span>${esc(i.id)}</span><span>r${i.rev}</span></button>`).join('') || '<div class="empty">No instances.</div>'}${c.instances.length > instances.length ? `<div class="foot-note">+${c.instances.length - instances.length} more</div>` : ''}</div>
      ${ins ? `<div class="cat-inst-detail"><div class="lh">Selected instance</div><div class="mono" style="font-size:7.5px;color:#a5f3fc;word-break:break-all">${esc(ins.id)}</div><div class="foot-note" style="margin-top:4px">r${ins.rev} · ${esc(ins.status)}</div><div class="cat-detail-text">${esc(ins.detail || '')}</div></div>` : ''}
    </div>`;
  $$('#changes [data-open-layer-settings]').forEach(b => b.onclick = () => { state.layerTab = 'settings'; renderAll(); });
  $$('#changes [data-open-manager]').forEach(b => b.onclick = openManager);
  $$('#changes [data-insp-inst]').forEach(b => b.onclick = () => {
    state.selectedInstanceId = b.dataset.inspInst;
    if (state.layerTab === 'manage') renderLayerManagement();
    renderLayerInspector();
  });
}

function renderChanges() {
  const keys = dirtyKeys();
  const restart = [...new Set(keys.map(k => settingById(k)?.restart).filter(Boolean))];
  const rows = keys.map(k => {
    const s = settingById(k);
    const from = state.saved[k]?.value;
    const to = state.values[k]?.value;
    return `<div class="ch-row"><span class="ch-label">${esc(s.label)}</span><span class="ch-diff"><span class="from">${esc(formatVal(s, from))}</span> → <span class="to">${esc(formatVal(s, to))}</span></span></div>`;
  }).join('');
  $('#changes').innerHTML = `
    <div class="ch-head"><b>Changes</b><span class="ch-count">${keys.length} unsaved</span></div>
    ${keys.length ? `<div class="ch-list">${rows}</div>` : '<div class="empty">No unsaved changes.</div>'}
    <div class="ch-actions"><button class="btn primary" data-apply ${keys.length ? '' : 'disabled'}>Apply</button><button class="btn" data-discard ${keys.length ? '' : 'disabled'}>Discard</button></div>
    ${restart.length || state.restartPending.length ? `<div class="restart-box">Restart required: ${esc([...new Set([...restart, ...state.restartPending])].join(' / '))}${state.restartPending.length ? ' · applied, pending restart' : ''}</div>` : ''}`;
  $$('#changes [data-apply]').forEach(b => b.onclick = applyChanges);
  $$('#changes [data-discard]').forEach(b => b.onclick = discardChanges);
}

function renderStatus() {
  const n = dirtyKeys().length;
  const errs = 0;
  $('#statusLeft').textContent = `Settings · ${state.scope} scope · ${n ? n + ' unsaved' : 'clean'} · ${errs} errors`;
  $('#statusRight').textContent = state.restartPending.length ? `restart required: ${state.restartPending.join('/')}` : 'v1.4.2 · build 2026.11.23';
  $('#changes').classList.toggle('dirty', n > 0);
}

function renderAll() {
  renderHeader(); renderNav(); renderMain(); renderChanges(); renderStatus();
}

/* ============================================================
   变更
   ============================================================ */
function setValue(key, value) {
  if (state.scope === 'Policy') return;
  const spec = settingById(key);
  if (!spec || state.values[key]?.source === 'policy') return;
  state.values[key] = { value, source: state.scope.toLowerCase() };
  state.highlightKey = null;
  renderAll();
}

function resetKey(key) {
  const spec = settingById(key);
  if (!spec || state.values[key]?.source === 'policy' || state.scope === 'Policy') return;
  state.values[key] = { value: spec.default, source: 'default' };
  renderAll();
}

function resetSection() {
  if (state.scope === 'Policy') return;
  const sec = sectionById(state.sectionId);
  for (const s of sectionSettings(sec.id)) {
    if (state.values[s.key]?.source !== 'policy') state.values[s.key] = { value: s.default, source: 'default' };
  }
  renderAll();
  toast('Section reset to defaults');
}

function applyChanges() {
  if (state.scope === 'Policy') return;
  const restart = [...new Set(dirtyKeys().map(k => settingById(k)?.restart).filter(Boolean))];
  state.restartPending = [...new Set([...state.restartPending, ...restart])];
  state.saved = clone(state.values);
  renderAll();
  toast(restart.length ? `Applied · restart ${restart.join('/')} required` : 'Settings applied');
}

function discardChanges() {
  state.values = clone(state.saved);
  state.restartPending = [];
  renderAll();
  toast('Changes discarded');
}

function exportSettings() {
  const out = { schema: 1, scope: state.scope, values: {}, secrets: {} };
  for (const s of ALL_SETTINGS) {
    const v = state.values[s.key];
    if (s.secret) out.secrets[s.key] = v.value ? 'secretRef' : null;
    else out.values[s.key] = v.value;
  }
  copyText(JSON.stringify(out, null, 2), 'Settings exported (secrets as refs only)');
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
}

function copyText(text, label) {
  const done = () => toast(label || '已复制');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  done();
}

/* ============================================================
   事件
   ============================================================ */
function init() {
  try {
    const hash = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (hash && SECTIONS.some(s => s.id === hash)) state.sectionId = hash;
  } catch (_) {}
  $('#sectionSel').innerHTML = SECTIONS.map(s => `<option value="${esc(s.id)}">${esc(s.title)}</option>`).join('');
  $('#sectionSel').addEventListener('change', e => { state.sectionId = e.target.value; state.layerTab = 'settings'; state.filterClass = 'all'; state.query = ''; $('#search').value = ''; if (isLayerSection(state.sectionId)) ensureLayerSelection(state.sectionId); renderAll(); });

  $('#scopeSel').addEventListener('change', e => {
    state.scope = e.target.value;
    renderAll();
    toast(`Scope: ${state.scope}${state.scope === 'Policy' ? ' · read only' : ''}`);
  });
  $('#search').addEventListener('input', e => {
    state.query = e.target.value;
    renderMain();
  });
  $('#applyBtn').addEventListener('click', applyChanges);
  $('#moreBtn').addEventListener('click', e => { e.stopPropagation(); $('#moreMenu').classList.toggle('on'); });
  document.addEventListener('click', e => { if (!e.target.closest('#moreMenu') && !e.target.closest('#moreBtn')) $('#moreMenu').classList.remove('on'); });
  $('#moreMenu').addEventListener('click', e => {
    const b = e.target.closest('[data-more]');
    if (!b) return;
    $('#moreMenu').classList.remove('on');
    if (b.dataset.more === 'import') toast('Import: schema validation → diff preview → apply');
    if (b.dataset.more === 'export') exportSettings();
    if (b.dataset.more === 'close') toast(dirtyKeys().length ? 'Unsaved changes · Apply or Discard first' : 'Close settings');
  });

  $('#main').addEventListener('change', e => {
    const cf = e.target.closest('[data-class-filter]');
    if (cf) { state.filterClass = cf.value; renderInstanceCatalog(); return; }
    const adv = e.target.closest('[data-show-advanced]');
    if (adv) { state.showAdvanced = adv.checked; renderMain(); return; }
    const el = e.target.closest('[data-key]');
    if (!el) return;
    const spec = settingById(el.dataset.key);
    let val = el.type === 'checkbox' ? el.checked : el.value;
    if (spec.type === 'number') val = Number(val);
    setValue(el.dataset.key, val);
  });
  $('#main').addEventListener('click', e => {
    const jump = e.target.closest('[data-jump-manager]');
    if (jump) { window.location.href = managerUrlFor(state.sectionId); return; }
    const lt = e.target.closest('[data-layer-tab]');
    if (lt) {
      state.layerTab = lt.dataset.layerTab;
      state.filterClass = 'all';
      state.query = '';
      $('#search').value = '';
      ensureLayerSelection(state.sectionId);
      renderAll();
      return;
    }
    const reset = e.target.closest('[data-reset]');
    if (reset) { resetKey(reset.dataset.reset); return; }
    const resetSec = e.target.closest('[data-reset-section]');
    if (resetSec) { resetSection(); return; }
    const secret = e.target.closest('[data-secret]');
    if (secret) { toast('Credential dialog: value stored in OS credential vault, never shown'); return; }
    const info = e.target.closest('[data-info-action]');
    if (info) { toast(`${info.textContent.trim()} · simulated`); return; }
  });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      $('#search').focus();
    }
    if (e.key === 'Escape') {
      if (document.activeElement === $('#search')) {
        state.query = '';
        $('#search').value = '';
        $('#search').blur();
        renderMain();
      } else {
        toast(dirtyKeys().length ? 'Unsaved changes · Apply or Discard first' : 'Close settings');
      }
    }
  });

  renderAll();
}

init();
})();

</script>
</body>
</html>
