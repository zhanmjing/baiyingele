<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Management · 面板管理</title>
<style>
:root{--bg:#070b12;--panel:#0d1420;--card:#111a29;--line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.26);--ink:#e6eef9;--dim:#8fa2bb;--faint:#5f7188;--cyan:#22d3ee;--blue:#3b82f6;--violet:#8b5cf6;--amber:#f59e0b;--green:#22c55e;--red:#ef4444;--mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;--font:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px}button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
#app{display:grid;grid-template-rows:54px minmax(0,1fr);height:100%}
header{display:flex;align-items:center;gap:10px;padding:0 13px;background:linear-gradient(180deg,#0e1725,#0a111c);border-bottom:1px solid var(--line);position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:8px;min-width:190px}.brand .mark{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#08111c;font:800 12px var(--mono)}.brand b{font-size:13px}.brand span{display:block;font:7px var(--mono);color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.top-stats{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-left:auto}.mini{font:6.8px var(--mono);padding:2px 4px;border-radius:3px;border:1px solid var(--line);color:#8fa2bb;background:#121d2c;white-space:nowrap}.mini.cyan{color:#a5f3fc;border-color:rgba(34,211,238,.22);background:rgba(34,211,238,.06)}.mini.green{color:#86efac;border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.06)}.mini.amber{color:#fcd34d;border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.06)}.mini.violet{color:#c4b5fd;border-color:rgba(139,92,246,.24);background:rgba(139,92,246,.06)}
.btn{border:1px solid var(--line);background:#111b28;color:#9fb1c8;border-radius:6px;padding:5px 8px;font-size:8.5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:3px;cursor:pointer}.btn:hover{color:#dbeafe;border-color:var(--line2)}.btn.primary{border-color:rgba(139,92,246,.36);background:rgba(139,92,246,.12);color:#ddd6fe}.btn.small{padding:3px 5px;font-size:7px}.btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.25)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;min-height:0}
.left{border-right:1px solid var(--line);background:#0a111c;overflow-y:auto;padding:10px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
.left::-webkit-scrollbar,main::-webkit-scrollbar,#inspector::-webkit-scrollbar{width:7px}.left::-webkit-scrollbar-thumb,main::-webkit-scrollbar-thumb,#inspector::-webkit-scrollbar-thumb{background:#26344a;border-radius:5px;border:2px solid #080d15}
.pane-head{display:flex;align-items:center;gap:5px;margin:6px 2px 5px}.pane-head b{font:8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}.pane-head .count{font:6.5px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:1px 3px}.pane-head button{margin-left:auto;border:1px solid var(--line);background:#111b28;color:#9fb1c8;border-radius:4px;width:18px;height:18px;line-height:1;font-size:10px}
.flow-item{border:1px solid var(--line);border-radius:6px;background:#0e1826;padding:6px 7px;margin-bottom:4px;cursor:pointer}.flow-item:hover{border-color:var(--line2);background:#121f30}.flow-item.on{border-color:rgba(139,92,246,.45);background:rgba(139,92,246,.08)}.fi-top{display:flex;align-items:center;gap:4px}.fi-name{font-size:9px;font-weight:650;color:#dbeafe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fi-ver{font:6px var(--mono);color:var(--faint);margin-left:auto;white-space:nowrap}.fi-id{font:6px var(--mono);color:var(--faint);margin-top:2px;word-break:break-all}.fi-meta{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}.fi-badge{font:6px var(--mono);color:#8fa2bb;border:1px solid var(--line);border-radius:2px;padding:1px 2px}
.inst-item{border:1px solid var(--line);border-radius:5px;background:#0b1420;padding:5px 6px;margin-bottom:3px;cursor:pointer}.inst-item:hover{background:#121f30}.inst-item.on{border-color:rgba(34,211,238,.38);background:rgba(34,211,238,.06)}.ii-top{display:flex;align-items:center;gap:4px}.ii-name{font-size:8px;color:#b9c7da;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ii-rev{font:6px var(--mono);color:#a5f3fc;margin-left:auto}.ii-id{font:6px var(--mono);color:var(--faint);margin-top:2px;word-break:break-all}.ii-status{font:6px var(--mono);padding:1px 2px;border-radius:2px;border:1px solid var(--line);color:#86efac;margin-top:3px;display:inline-block}.ii-status.draft{color:#fcd34d;border-color:rgba(245,158,11,.22)}.ii-status.archived{color:#94a3b8}
main{min-width:0;overflow-y:auto;padding:14px 16px 28px;background:radial-gradient(circle at 30% 0%,rgba(139,92,246,.045),transparent 45%),linear-gradient(180deg,#0a111c,#070b12);scrollbar-width:thin;scrollbar-color:#26344a transparent}
.hero{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}.hero-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#171f33;border:1px solid rgba(139,92,246,.25);color:#c4b5fd;font:800 13px var(--mono);flex:0 0 38px}.hero-main{min-width:0;flex:1}.kicker{font:7px var(--mono);color:var(--faint);letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:18px;margin:2px 0 2px}.hero p{margin:0;color:#94a8c0;font-size:10px;line-height:1.5}.hero-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.mode-tabs{display:flex;gap:2px;border:1px solid var(--line);border-radius:5px;padding:2px;background:#0a1420;align-self:flex-start}.mode-tabs button{border:none;background:transparent;color:#7e91a7;border-radius:3px;padding:4px 6px;font-size:7.5px}.mode-tabs button.on{background:rgba(139,92,246,.14);color:#ddd6fe}
.stats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}
.graph-panel{border:1px solid var(--line);border-radius:8px;background:#0a1420;margin-bottom:9px;overflow:hidden}.panel-head{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}.panel-head b{font-size:8.5px;color:#dbeafe}.panel-head .sub{font:6.8px var(--mono);color:var(--faint)}.panel-head .right{margin-left:auto;display:flex;gap:4px;align-items:center}.graph-scroll{overflow:auto;max-height:440px;min-height:250px;background:#08101b}.canvas{position:relative;margin:12px}.canvas svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{position:absolute;border:1px solid var(--line2);border-radius:7px;background:#101b2a;padding:7px 7px 6px;cursor:pointer;transition:border-color .12s,background .12s,box-shadow .12s;overflow:hidden}.node:hover{background:#152238}.node.selected{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(34,211,238,.22),0 6px 18px rgba(0,0,0,.24)}.node.point.impl{border-color:rgba(34,197,94,.42)}.node.point.placeholder{border-style:dashed;border-color:rgba(245,158,11,.42);background:rgba(35,27,16,.7)}.node.gate{border-color:rgba(139,92,246,.38);background:rgba(24,20,38,.8)}.node.subflow{border-color:rgba(59,130,246,.4);background:rgba(15,26,45,.8)}.n-kind{font:6px var(--mono);letter-spacing:.08em;color:var(--faint);text-transform:uppercase}.n-label{font-size:9px;font-weight:650;color:#dbeafe;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n-meta{font:6.5px var(--mono);color:#8fa2bb;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n-pin{font:6px var(--mono);color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n-badge{position:absolute;right:4px;bottom:4px;font:5.5px var(--mono);padding:1px 2px;border-radius:2px;border:1px solid var(--line);color:#8fa2bb;background:#0a1420}.n-badge.ok{color:#86efac;border-color:rgba(34,197,94,.28)}.n-badge.sub{color:#93c5fd;border-color:rgba(59,130,246,.28)}.n-badge.ph{color:#fcd34d;border-color:rgba(245,158,11,.28)}.n-jump{position:absolute;right:4px;top:4px;width:16px;height:16px;border-radius:4px;border:1px solid rgba(34,197,94,.3);background:rgba(34,197,94,.09);color:#86efac;font-size:8px;line-height:1;padding:0}
.legend{display:flex;gap:9px;flex-wrap:wrap;padding:5px 8px;border-top:1px solid var(--line);font:6.8px var(--mono);color:var(--faint)}.legend span{display:flex;align-items:center;gap:3px}.legend i{width:6px;height:6px;border-radius:2px;display:inline-block}.legend i.impl{background:var(--green)}.legend i.ph{background:var(--amber)}.legend i.gate{background:var(--violet)}.legend i.sub{background:var(--blue)}
.bind-panel{border:1px solid var(--line);border-radius:8px;background:#0a1420;overflow:hidden}.table-wrap{overflow:auto;max-height:290px}table{width:100%;border-collapse:collapse;font-size:8px}th{position:sticky;top:0;z-index:2;text-align:left;font:7px var(--mono);color:var(--faint);padding:6px 7px;border-bottom:1px solid var(--line);background:#0d1926;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}td{padding:6px 7px;border-bottom:1px solid rgba(148,163,184,.07);color:#9fb1c8;vertical-align:middle}.tr-node{cursor:pointer}.tr-node:hover td{background:#101d2c}.tr-node.on td{background:rgba(34,211,238,.05)}.mono{font-family:var(--mono);font-size:7px;color:#8fa2bb}.t-label{font-size:8.5px;color:#dbeafe}.t-sub{display:block;font:6.3px var(--mono);color:var(--faint);margin-top:1px;word-break:break-all}.pill{font:6px var(--mono);padding:1px 3px;border-radius:2px;border:1px solid var(--line);white-space:nowrap}.pill.ok{color:#86efac;border-color:rgba(34,197,94,.25);background:rgba(34,197,94,.05)}.pill.ph{color:#fcd34d;border-color:rgba(245,158,11,.28);background:rgba(245,158,11,.05)}.pill.gate{color:#c4b5fd;border-color:rgba(139,92,246,.28);background:rgba(139,92,246,.06)}.pill.sub{color:#93c5fd;border-color:rgba(59,130,246,.28);background:rgba(59,130,246,.06)}.plink{font:6.8px var(--mono);color:#86efac;border:1px solid rgba(34,197,94,.28);border-radius:3px;padding:2px 4px;background:rgba(34,197,94,.06);white-space:nowrap}.plink:hover{background:rgba(34,197,94,.12)}
#inspector{border-left:1px solid var(--line);background:linear-gradient(180deg,#0e1624,#080d15);overflow-y:auto;padding:12px 12px 32px;scrollbar-width:thin;scrollbar-color:#26344a transparent}
.insp-kicker{font:7px var(--mono);color:var(--faint);letter-spacing:.14em;text-transform:uppercase}.insp-title{font-size:13px;margin:4px 0 2px;color:#dbeafe}.insp-id{font:8px var(--mono);color:#c4b5fd;word-break:break-all;margin-bottom:7px}.insp-section{border:1px solid var(--line);border-radius:7px;background:var(--card);padding:8px;margin-bottom:7px}.lh{font:7px var(--mono);color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}.kv{display:grid;grid-template-columns:60px 1fr;gap:3px 6px;font-size:8px;line-height:1.45}.kv .k{color:var(--faint);font-family:var(--mono)}.kv .v{color:#b9c7da;word-break:break-all}.note{font-size:7.5px;line-height:1.55;color:var(--faint);border-left:2px solid rgba(245,158,11,.4);padding-left:6px;margin-top:6px}.actions{display:flex;gap:4px;flex-wrap:wrap}.actions .btn{flex:1;min-width:70px}.insp-list{border:1px solid var(--line);border-radius:5px;overflow:auto;max-height:190px;background:#0a1420}.insp-row{display:flex;justify-content:space-between;gap:5px;padding:4px 6px;border-bottom:1px solid rgba(148,163,184,.07);font:6.8px var(--mono);color:#8fa2bb;cursor:pointer}.insp-row:hover,.insp-row.on{background:#121f30;color:#dbeafe}.empty{padding:24px 8px;text-align:center;color:var(--faint);font-size:9px}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#0b1420;border:1px solid var(--line2);color:#dbeafe;padding:7px 11px;border-radius:7px;font-size:9px;z-index:60;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1250px){.layout{grid-template-columns:225px minmax(0,1fr)}#inspector{display:none}}
@media(max-width:820px){.layout{grid-template-columns:1fr}.left{display:none}main{padding:10px}.hero{flex-wrap:wrap}.top-stats{display:none}}

/* ===== panel management workbench ===== */
.panel-toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;border:1px solid var(--line);border-radius:7px;background:#0d1826;padding:6px 7px;margin-bottom:7px}
.panel-toolbar .group{display:flex;gap:2px;border:1px solid var(--line);border-radius:4px;padding:1px;background:#08111c}
.panel-toolbar button{border:none;background:transparent;color:#7e91a7;border-radius:3px;padding:3px 5px;font:6.5px var(--mono);white-space:nowrap}
.panel-toolbar button.on{background:rgba(34,211,238,.1);color:#a5f3fc}
.panel-toolbar select,.panel-toolbar input[type=number]{border:1px solid var(--line);border-radius:4px;background:#08111c;color:#9fb1c8;font:6.5px var(--mono);padding:3px 4px;outline:none}
.panel-toolbar input[type=range]{width:86px;accent-color:var(--cyan)}
.panel-toolbar .chk{display:flex;align-items:center;gap:3px;font:6.5px var(--mono);color:#8fa2bb}.panel-toolbar .chk input{accent-color:var(--cyan);width:11px;height:11px;margin:0}
.pv-workbench{position:relative;height:430px;border:1px solid var(--line2);border-radius:8px;background:#070e18;overflow:hidden;margin-bottom:8px}
.pv-fake-sidebar{position:absolute;left:0;top:0;bottom:0;width:140px;border-right:1px solid var(--line);background:rgba(10,18,29,.9);padding:10px 8px;z-index:1}
.pv-fake-sidebar .fs-brand{font:7px var(--mono);color:#a5f3fc;margin-bottom:9px}.pv-fake-sidebar .fs-item{font:6px var(--mono);color:#5f7188;padding:4px 5px;border-radius:3px;margin-bottom:2px}.pv-fake-sidebar .fs-item.on{background:rgba(34,211,238,.07);color:#a5f3fc}
.pv-fake-main{position:absolute;left:140px;right:0;top:0;bottom:0;padding:24px 26px;background:radial-gradient(circle at 30% 10%,rgba(139,92,246,.05),transparent 50%),#0a111b;z-index:1}
.pv-fake-main .fm-kicker{font:6px var(--mono);color:#5f7188;letter-spacing:.12em;text-transform:uppercase}.pv-fake-main h2{font-size:15px;margin:4px 0;color:#c7d5e8}.pv-fake-main p{font:7px var(--mono);color:#5f7188;line-height:1.6;max-width:320px}.pv-fake-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px;max-width:360px}.pv-fake-card{border:1px solid var(--line);border-radius:5px;background:rgba(17,27,40,.5);padding:6px}.pv-fake-card span{display:block;height:3px;border-radius:2px;background:#223146;margin-bottom:4px}.pv-fake-card span:last-child{width:55%;margin-bottom:0}
.pv-backdrop{position:absolute;inset:0;background:rgba(2,6,12,.52);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:6}
.pv-shell{position:absolute;display:flex;flex-direction:column;background:linear-gradient(180deg,#101a29,#0c1522);border:1px solid rgba(148,163,184,.22);box-shadow:0 18px 50px rgba(0,0,0,.42);z-index:8;min-width:0;overflow:hidden;transition:top .2s,left .2s,right .2s,bottom .2s,width .12s,height .2s,transform .2s,opacity .2s}
.pv-workbench.mode-right .pv-shell{top:0;right:0;bottom:0;width:var(--pw);border-radius:0;border-right:none;border-top:none;border-bottom:none}.pv-workbench.mode-right .pv-fake-main{right:var(--pw)}.pv-workbench.mode-right .pv-fake-sidebar{width:110px}.pv-workbench.mode-right .pv-fake-main{left:110px}
.pv-workbench.mode-left .pv-shell{top:0;left:0;bottom:0;width:var(--pw);border-radius:0;border-left:none;border-top:none;border-bottom:none}.pv-workbench.mode-left .pv-fake-sidebar{display:none}.pv-workbench.mode-left .pv-fake-main{left:var(--pw)}
.pv-workbench.mode-bottom .pv-shell{left:0;right:0;bottom:0;height:245px;border-radius:0;border-bottom:none;border-left:none;border-right:none}.pv-workbench.mode-bottom .pv-fake-main{bottom:245px}.pv-workbench.mode-bottom .pv-fake-sidebar{bottom:245px}
.pv-workbench.mode-floating .pv-shell{right:14px;bottom:14px;top:auto;width:var(--pw);height:min(330px,calc(100% - 28px));border-radius:9px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.pv-workbench.mode-modal .pv-shell{left:50%;top:50%;right:auto;bottom:auto;width:min(var(--pw),calc(100% - 40px));height:min(330px,calc(100% - 40px));transform:translate(-50%,-50%);border-radius:9px;z-index:12}.pv-workbench.mode-modal .pv-backdrop{opacity:1;pointer-events:auto}
.pv-workbench.mode-sheet .pv-shell{left:0;right:0;bottom:0;top:auto;height:245px;border-radius:10px 10px 0 0;z-index:12}.pv-workbench.mode-sheet .pv-backdrop{opacity:1;pointer-events:auto}
.pv-head{flex:0 0 38px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--line);position:relative}
.pv-h-icon{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:#162234;border:1px solid var(--line);font-size:10px;color:#a5f3fc;flex:0 0 20px}.pv-h-main{min-width:0;flex:1}.pv-h-name{font:600 8.5px var(--mono);color:#dbeafe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pv-h-sub{font:6px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}.pv-h-actions{display:flex;gap:2px}.pv-icon-btn{width:17px;height:17px;border:1px solid transparent;border-radius:3px;background:transparent;color:#72859b;font-size:8px;display:grid;place-items:center}
.pv-toolbar{flex:0 0 26px;display:flex;align-items:center;gap:4px;padding:0 7px;border-bottom:1px solid var(--line);background:rgba(13,22,35,.55);overflow:hidden}.pv-tab{font:6px var(--mono);color:#7e91a7;padding:2px 4px;border-radius:3px;white-space:nowrap}.pv-tab.on{background:rgba(34,211,238,.08);color:#a5f3fc}.pv-sep{width:1px;height:10px;background:var(--line);margin:0 1px}
.pv-body{flex:1;min-height:0;overflow:auto;padding:8px;position:relative;scrollbar-width:thin;scrollbar-color:#26344a transparent}.pv-body::-webkit-scrollbar{width:6px}.pv-body::-webkit-scrollbar-thumb{background:#26344a;border-radius:4px}
.pv-foot{flex:0 0 24px;display:flex;align-items:center;gap:5px;padding:0 8px;border-top:1px solid var(--line);background:rgba(13,22,35,.55);font:6px var(--mono);color:var(--faint);position:relative}.pv-foot .dot{width:4px;height:4px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e}.pv-foot .grow{flex:1}
.pv-anatomy [data-region]{outline:1px dashed rgba(34,211,238,.6);outline-offset:-1px;position:relative}.pv-anatomy [data-region]::after{content:attr(data-region);position:absolute;right:2px;top:1px;font:5.5px var(--mono);color:#a5f3fc;background:rgba(8,17,30,.9);border:1px solid rgba(34,211,238,.25);border-radius:2px;padding:0 2px;z-index:20;pointer-events:none}
.wire-stack{display:flex;flex-direction:column;gap:3px}.wire-row{display:flex;align-items:center;gap:4px;font:6px var(--mono);color:#8fa2bb;border-bottom:1px solid rgba(148,163,184,.07);padding:3px 0}.wire-k{color:#5f7188;min-width:42px}.wire-v{color:#b9c7da;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wire-chips{display:flex;gap:3px;flex-wrap:wrap}.wire-chip{font:5.8px var(--mono);border:1px solid var(--line);border-radius:2px;padding:1px 3px;color:#8fa2bb;background:#0c1725}.wire-chip.cyan{color:#a5f3fc;border-color:rgba(34,211,238,.24);background:rgba(34,211,238,.06)}.wire-chip.amber{color:#fcd34d;border-color:rgba(245,158,11,.24);background:rgba(245,158,11,.06)}
.wire-box{border:1px solid var(--line);border-radius:4px;background:#0a1420;padding:5px;margin-bottom:5px}.wire-box .wb-title{font:5.8px var(--mono);color:#5f7188;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.wire-field{display:flex;align-items:center;gap:4px;font:6px var(--mono);color:#8fa2bb;border-bottom:1px solid rgba(148,163,184,.06);padding:2px 0}.wire-field:last-child{border-bottom:none}.wire-field .wf-name{color:#5f7188;min-width:42px}.wire-field .wf-val{color:#b9c7da;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wire-field .wf-box{width:44px;height:7px;border:1px solid var(--line);border-radius:2px;background:#0d1826}

.wire-search{border:1px solid var(--line);border-radius:4px;background:#0b1420;padding:4px 5px;font:6px var(--mono);color:#5f7188;margin-bottom:5px}

.wire-code{border:1px solid var(--line);border-radius:4px;background:#08111b;padding:5px;font:5.8px/1.5 var(--mono);color:#9fb1c8;white-space:pre-wrap;word-break:break-word;margin-bottom:5px}.wire-code .add{color:#86efac}.wire-code .del{color:#fca5a5}

.modal-overlay{position:fixed;inset:0;background:rgba(2,6,12,.65);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:14px}
.modal{width:min(520px,100%);max-height:88vh;overflow:auto;border:1px solid var(--line2);border-radius:9px;background:#0d1724;padding:13px;box-shadow:0 24px 70px rgba(0,0,0,.55)}

  $('#main').innerHTML = `<div class="hero"><div class="hero-icon" style="color:${gm.color}">${esc(c.icon)}</div><div class="hero-main"><div class="kicker">PanelClass · ${esc(gm.label)}</div><h1>${esc(c.name)}</h1><p>${esc(c.desc)}</p></div><div class="hero-actions"><button class="btn" data-action="edit-class">✎ 编辑类</button><button class="btn primary" data-action="new-instance">＋ 实例</button><button class="btn danger" data-action="delete-class">⌫ 删除类</button></div></div>
    <div class="stats"><span class="mini cyan">${c.modes.join(' / ')}</span><span class="mini">${c.regions.length} regions</span><span class="mini">${c.instances.length} instances</span><span class="mini violet">v${esc(c.version)}</span><span class="mini">${esc(c.content)}</span></div>
    <div class="panel-toolbar"><div class="group">${['right', 'left', 'bottom', 'floating', 'modal', 'sheet'].map(m => `<button data-mode-btn="${m}" class="${state.mode === m ? 'on' : ''}">${m}</button>`).join('')}</div><span class="mini">width</span><input id="pwRange" type="range" min="300" max="720" value="${state.width}"><b id="pwLabel" class="mono" style="color:#a5f3fc">${state.width}px</b><select id="instSel">${c.instances.map(x => `<option value="${esc(x.label)}" ${x.label === state.instLabel ? 'selected' : ''}>${esc(x.label)} · r${x.rev}</option>`).join('')}</select><label class="chk"><input type="checkbox" id="anatomyChk" ${state.anatomy ? 'checked' : ''}> anatomy</label><select id="panelStateSel">${['ready', 'loading', 'empty', 'error', 'streaming', 'needsApproval', 'blocked'].map(s => `<option value="${s}" ${state.panelState === s ? 'selected' : ''}>${s}</option>`).join('')}</select><button class="btn small" data-action="reset-view">reset view</button></div>
    ${previewHTML(c, i)}
    <div class="bind-panel"><div class="panel-head"><b>Panel Contract</b><span class="sub">${esc(c.id)}</span><span class="right"><span class="mini">${esc(c.content)}</span></span></div><div style="padding:7px 8px"><div class="wire-chips" style="margin-bottom:5px">${c.states.map(s => `<span class="wire-chip amber">${esc(s)}</span>`).join('')}${c.behaviors.map(b => `<span class="wire-chip cyan">${esc(b)}</span>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px">${[['modes', c.modes.join(' / ')], ['regions', c.regions.join(' / ')], ['version', 'v' + c.version], ['a11y', c.a11y.join(' / ')], ['instances', c.instances.length], ['status', c.status || 'active']].map(([k, v]) => `<div class="contract-cell"><div class="cc-k">${esc(k)}</div><div class="cc-v">${esc(v)}</div></div>`).join('')}</div></div></div>`;
  $$('#main [data-mode-btn]').forEach(b => b.onclick = () => { state.mode = b.dataset.modeBtn; renderMain(); });
  $$('#main [data-action]').forEach(b => b.onclick = () => handleAction(b.dataset.action));
  const range = $('#pwRange'); if (range) range.addEventListener('input', e => { state.width = Number(e.target.value); $('#pwLabel').textContent = state.width + 'px'; const wb = $('#pvWorkbench'); if (wb) wb.style.setProperty('--pw', state.width + 'px'); });
  const isel = $('#instSel'); if (isel) isel.addEventListener('change', e => { state.instLabel = e.target.value; ensureSelection(); updateHash(); renderAll(); });
  const achk = $('#anatomyChk'); if (achk) achk.addEventListener('change', e => { state.anatomy = e.target.checked; renderMain(); });
  const psel = $('#panelStateSel'); if (psel) psel.addEventListener('change', e => { state.panelState = e.target.value; renderMain(); });
}
function renderInspector() {
  const c = cls(), i = ins();
  if (!c) { $('#inspector').innerHTML = '<div class="empty">没有面板类。</div>'; return; }
  const gm = groupMeta(c.group);
  $('#inspector').innerHTML = `<div class="insp-kicker">PanelClass · 面板类</div><div class="insp-title">${esc(c.icon)} ${esc(c.name)}</div><div class="insp-id">${esc(c.id)} · v${esc(c.version)}</div>
    <div class="insp-section"><div class="lh">Contract</div><div class="kv"><div class="k">group</div><div class="v" style="color:${gm.color}">${esc(gm.label)}</div><div class="k">status</div><div class="v">${esc(c.status || 'active')}</div><div class="k">modes</div><div class="v">${esc(c.modes.join(' / '))}</div><div class="k">regions</div><div class="v">${esc(c.regions.join(' / '))}</div><div class="k">content</div><div class="v">${esc(c.content)}</div><div class="k">instances</div><div class="v">${c.instances.length}</div></div></div>
    <div class="insp-section"><div class="lh">Instance · ${esc(i?.label || '—')}</div><div class="kv"><div class="k">mode</div><div class="v">${esc(i?.mode || '—')}</div><div class="k">width</div><div class="v">${i?.width || '—'} px</div><div class="k">state</div><div class="v">${esc(i?.state || '—')}</div><div class="k">rev</div><div class="v">r${i?.rev || 1}</div><div class="k">content</div><div class="v">${esc(i?.content || '—')}</div></div></div>
    <div class="insp-section"><div class="lh">States</div>${c.states.map(x => `<span class="wire-chip amber">${esc(x)}</span>`).join(' ')}</div>
    <div class="insp-section"><div class="lh">Behaviors</div>${c.behaviors.map(x => `<span class="wire-chip cyan">${esc(x)}</span>`).join(' ') || '<span class="empty">无</span>'}</div>
    <div class="insp-section"><div class="lh">A11y</div>${c.a11y.map(x => `<span class="wire-chip">${esc(x)}</span>`).join(' ') || '<span class="empty">无</span>'}</div>
    <div class="insp-section"><div class="lh">Class Actions</div><div class="actions"><button class="btn" data-action="edit-class">✎ 编辑</button><button class="btn" data-action="new-instance">＋ 实例</button><button class="btn danger" data-action="delete-class">⌫ 删除</button></div></div>
    ${i ? `<div class="insp-section"><div class="lh">Instance Actions</div><div class="actions"><button class="btn" data-action="edit-instance">✎ 编辑</button><button class="btn" data-action="duplicate-instance">⧉ 复制</button><button class="btn danger" data-action="delete-instance">⌫ 删除</button></div></div>` : ''}`;
  $$('#inspector [data-action]').forEach(b => b.onclick = () => handleAction(b.dataset.action));
}
function openModal(html) { $('#modalRoot').innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal">${html}</div></div>`; }
function closeModal() { $('#modalRoot').innerHTML = ''; }
function confirmModal(title, message, label, onConfirm) {
  openModal(`<h3>${esc(title)}</h3><p>${esc(message)}</p><div class="modal-actions"><button class="btn" data-modal-close>取消</button><button class="btn danger" id="modalConfirm">${esc(label)}</button></div>`);
  $('#modalConfirm').onclick = () => { closeModal(); onConfirm(); };
}
function openClassModal(edit = false) {
  const c = edit ? cls() : null;
  openModal(`<h3>${edit ? '编辑 PanelClass' : '新建 PanelClass'}</h3><p>PanelClass = 面板外壳契约；modes/regions/states/behaviors/a11y 用逗号分隔。</p>
    <div class="form-grid">
      <div class="field"><label>ID</label><input id="mClassId" value="${esc(c?.id || 'panel.custom')}" ${edit ? 'disabled' : ''}></div>
      <div class="field"><label>名称</label><input id="mClassName" value="${esc(c?.name || 'Custom Panel')}"></div>
      <div class="field"><label>icon</label><input id="mClassIcon" value="${esc(c?.icon || '◧')}"></div>
      <div class="field"><label>group</label><select id="mClassGroup">${Object.entries(GROUPS).map(([k, v]) => `<option value="${k}" ${c?.group === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select></div>
      <div class="field"><label>version</label><input id="mClassVersion" value="${esc(c?.version || '0.1.0')}"></div>
      <div class="field"><label>status</label><select id="mClassStatus">${['active', 'draft', 'archived'].map(s => `<option value="${s}" ${(c?.status || 'active') === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="field full"><label>说明</label><textarea id="mClassDesc">${esc(c?.desc || '')}</textarea></div>
      <div class="field"><label>modes</label><input id="mClassModes" value="${esc((c?.modes || ['right', 'floating']).join(', '))}"></div>
      <div class="field"><label>regions</label><input id="mClassRegions" value="${esc((c?.regions || ['header', 'body', 'footer']).join(', '))}"></div>
      <div class="field"><label>states</label><input id="mClassStates" value="${esc((c?.states || ['ready']).join(', '))}"></div>
      <div class="field"><label>behaviors</label><input id="mClassBehaviors" value="${esc((c?.behaviors || []).join(', '))}"></div>
      <div class="field"><label>a11y</label><input id="mClassA11y" value="${esc((c?.a11y || []).join(', '))}"></div>
      <div class="field"><label>content</label><input id="mClassContent" value="${esc(c?.content || 'surface.custom')}"></div>
    </div><div class="modal-actions"><button class="btn" data-modal-close>取消</button><button class="btn primary" id="modalSaveClass">${edit ? '保存新版本' : '创建类'}</button></div>`);
  $('#modalSaveClass').onclick = () => {
    const id = $('#mClassId').value.trim(), name = $('#mClassName').value.trim();
    if (!id || !name) { showToast('ID 和名称必填'); return; }
    if (!edit && CLASSES.some(x => x.id === id)) { showToast('ID 已存在'); return; }
    const data = { id, name, icon: $('#mClassIcon').value.trim() || '◧', group: $('#mClassGroup').value, version: $('#mClassVersion').value.trim() || '1.0.0', status: $('#mClassStatus').value, desc: $('#mClassDesc').value.trim(), modes: $('#mClassModes').value.split(',').map(s => s.trim()).filter(Boolean), regions: $('#mClassRegions').value.split(',').map(s => s.trim()).filter(Boolean), states: $('#mClassStates').value.split(',').map(s => s.trim()).filter(Boolean), behaviors: $('#mClassBehaviors').value.split(',').map(s => s.trim()).filter(Boolean), a11y: $('#mClassA11y').value.split(',').map(s => s.trim()).filter(Boolean), content: $('#mClassContent').value.trim() };
    if (edit) { Object.assign(c, data); showToast('PanelClass 已更新'); }
    else { CLASSES.push({ ...data, instances: [] }); state.classId = id; state.instLabel = ''; showToast('PanelClass 已创建'); }
    saveData(); closeModal(); ensureSelection(); updateHash(); renderAll();
  };
}
function openInstanceModal(edit = false) {
  const c = cls(), i = edit ? ins() : null;
  if (!c) return;
  openModal(`<h3>${edit ? '编辑 PanelInstance' : '新建 PanelInstance'}</h3><p>PanelInstance = 内容绑定 + 位置 + 尺寸 + 状态。</p>
    <div class="form-grid">
      <div class="field"><label>label</label><input id="mInstLabel" value="${esc(i?.label || 'New Instance')}"></div>
      <div class="field"><label>mode</label><select id="mInstMode">${['right', 'left', 'bottom', 'floating', 'modal', 'sheet'].map(m => `<option value="${m}" ${i?.mode === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
      <div class="field"><label>width</label><input id="mInstWidth" type="number" min="300" max="900" value="${i?.width || 380}"></div>
      <div class="field"><label>state</label><select id="mInstState">${['ready', 'loading', 'empty', 'error', 'streaming', 'needsApproval', 'blocked'].map(s => `<option value="${s}" ${i?.state === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="field full"><label>content</label><input id="mInstContent" value="${esc(i?.content || 'content')}"></div>
      <div class="field full"><label>data</label><input id="mInstData" value="${esc(i?.data || '')}"></div>
      <div class="field full"><label>actions</label><input id="mInstActions" value="${esc((i?.actions || []).join(', '))}"></div>
    </div><div class="modal-actions"><button class="btn" data-modal-close>取消</button><button class="btn primary" id="modalSaveInst">${edit ? '保存新 revision' : '创建实例'}</button></div>`);
  $('#modalSaveInst').onclick = () => {
    const label = $('#mInstLabel').value.trim(); if (!label) { showToast('label 必填'); return; }
    const data = { label, mode: $('#mInstMode').value, width: Number($('#mInstWidth').value) || 380, state: $('#mInstState').value, content: $('#mInstContent').value.trim(), data: $('#mInstData').value.trim(), actions: $('#mInstActions').value.split(',').map(s => s.trim()).filter(Boolean), rev: edit ? (i.rev || 1) + 1 : 1, status: 'active' };
    if (edit) { Object.assign(i, data); showToast('PanelInstance 已更新 · rev +1'); }
    else { c.instances.push(data); state.instLabel = label; showToast('PanelInstance 已创建'); }
    state.mode = data.mode; state.width = data.width; state.panelState = data.state; saveData(); closeModal(); updateHash(); renderAll();
  };
}
function handleAction(action) {
  const c = cls(), i = ins();
  if (action === 'new-class') { openClassModal(false); return; }
  if (action === 'edit-class') { openClassModal(true); return; }
  if (action === 'delete-class') { if (!c) return; confirmModal('删除 PanelClass？', `会删除 ${c.id} 及其 ${c.instances.length} 个实例。`, '删除', () => { CLASSES = CLASSES.filter(x => x.id !== c.id); state.classId = CLASSES[0]?.id || ''; state.instLabel = ''; ensureSelection(); saveData(); renderAll(); showToast('PanelClass 已删除'); }); return; }
  if (action === 'new-instance') { openInstanceModal(false); return; }
  if (action === 'edit-instance') { openInstanceModal(true); return; }
  if (action === 'delete-instance') { if (!i) return; confirmModal('删除 PanelInstance？', `会删除 ${i.label}。`, '删除', () => { c.instances = c.instances.filter(x => x.label !== i.label); state.instLabel = c.instances[0]?.label || ''; ensureSelection(); saveData(); renderAll(); showToast('PanelInstance 已删除'); }); return; }
  if (action === 'duplicate-instance') { if (!i) return; const copy = deep(i); copy.label = `${i.label} 副本`; copy.rev = 1; copy.status = 'draft'; c.instances.push(copy); state.instLabel = copy.label; state.mode = copy.mode; state.width = copy.width; state.panelState = copy.state; saveData(); updateHash(); renderAll(); showToast('PanelInstance 已复制'); return; }
  if (action === 'reset-view') { if (i) { state.mode = i.mode || 'right'; state.width = Number(i.width) || 380; state.panelState = i.state || 'ready'; } state.anatomy = false; renderMain(); return; }
  if (action === 'reset-data') { confirmModal('重置示例数据？', '会覆盖本地新增/修改，恢复 14 PanelClass / 37 PanelInstance。', '重置', () => { CLASSES = deep(PANEL_DATA.classes).map(x => ({ ...x, status: x.status || 'active' })); state.classId = CLASSES[0].id; state.instLabel = CLASSES[0].instances[0]?.label || ''; saveData(); ensureSelection(); updateHash(); renderAll(); showToast('示例数据已重置'); }); return; }
}
function renderAll() { renderTopStats(); renderLeft(); renderMain(); renderInspector(); }
function init() {
  parseHash(); ensureSelection(); renderAll();
  $('#modalRoot').addEventListener('click', e => { if (e.target.id === 'modalOverlay' || e.target.closest('[data-modal-close]')) closeModal(); });
  window.addEventListener('hashchange', () => { parseHash(); ensureSelection(); renderAll(); });
}
init();
})();

</script>
</body>
</html>
